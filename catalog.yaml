    note: "THE MASS ESTIMATOR PROPERTIES AND LEMMAS, 10 OCTOBER, record written by Claude 2026-10-10 at the user request ('The mass estimator lemmas are in a supersession folder right? Just copy the old lemma list and edit the new version. That way you can write all of it as accepted and just put a provisional above all of it. Do 1 and 2 please.'). KIND STAMPED record. SUPERSEDES mass_estimator_lemmas_2026-09-29.md (the second supersedes in this discussion; the 29 Sept record superseded the 27 Sept one): the 29 Sept record copied, every row keeping its 29-30 Sept state, with the 10 Oct changes marked inside the rows. PROVISIONAL banner above all of it on his instruction: the 10 Oct material is written as accepted but is provisional as a whole; L14 status unchanged and the L14/swap trade unruled (his ruling); O9 and O11 additions are proposed, not closed. CHANGES: sec 1 type gains the reading WINDOW (one window per reading over which both channels are averaged; ruled 'I like the window'); L18 window joins the reading structure; L5 and L14 read as the linearity of the two pairings a-prime(.) and F-prime(.) (m-regression = a-prime(F), mu-regression = F-prime(a)); L3-prime gains the units argument fixing k = 1; T1 restated in pairing form (two totals, P = cos^2 theta classifies: one mass iff P = 1 and value in (0,inf); no mass = disagreement or agreement outside; every mass at 0/0); NEW T32 the misfit is the pairings disagreement in noise units (Q lambda_plus = M11 M22 (1-P), checked 7e-13 against ours29_reference); NEW T33 same window (mismatched windows break Newton II noise-free); O9 window criterion proposed; O11 units argument written in (c may depend only on swap-inverting declared quantities; one noise pair forces c = s); sources add the units-and-axes record. Source of all 10 Oct material: mass_as_force_paired_with_reciprocal_acceleration_2026-10-10.md secs 6-9, checks in its sec 9.4 (check script not yet kept). Normalization 2026-10-10: NO-OP, math already in d