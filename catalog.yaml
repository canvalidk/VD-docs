    note: "ENTRY WRITING GUIDE: AUDITABLE COMPOSITIONS - active guidance dated 2026-06-12 (E5 inertial-frame wall feedback rounds, Can + Claude). The principle: a definiens is headword references (mechanical, auditable) plus residual (latent strings whose whole contribution is the reaction they produce); a novel figure doing definitional work in the residual is undeclared machinery, so the writer must either promote it to its own entry or compose the residual only from reactions already installed. Gives the residual provenance ledger practice and a worked E5 example. SORTED 2026-09-02 from inbox/VD unsorted important under the custody rule: guides are this repos responsibility, so this is the home; VD-Newton holds a byte-identical copy at 04_entry_design_guides/, which is a context copy of this record. Normalization a no-op, nothing banked."
