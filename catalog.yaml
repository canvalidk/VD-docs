    note: "ENTRY PACKET E10 `inertial-mass-material-object`, d4 — successor after the independent-measurement / joint-fit correction. Self-described status: supersedes d3 as the working account, does NOT promote wording into the active Design 2.1 entry draft (decision 12), and keeps d3 as the pre-correction reasoning state. Revised from d3 using the local handoff now filed as Newton-analysis/vector_division_mass_estimation/why_the_mass_entry_must_be_long_joint_measurement_d3.md; both drafted against this repo at commit 8e09dbf (2026-07-31). Twelve decisions logged, the load-bearing ones being: (1) the branch selector is EXACT/SUPPLIED versus EMPIRICALLY MEASURED, not codirectional versus non-codirectional — this is the reversal from d3; (2) every empirical determination takes the joint branch, aligned pairs included; (5) the empirical operation is `JointNewtonIIFit`, replacing d3's `MeasuredForceVector × MeasuredAccelerationVector -> MassEstimateResult`; (7) the residual survives because the latent outputs satisfy Newton II by construction; (8) inputs derived through the sought mass or through each other support only a CONSISTENCY RESTATEMENT, not independent evidence; (9) the exact branch and its result vocabulary survive from d3 unchanged; (11) estimator ownership stays capability-named pending the E12 decision. Chosen wording is candidate A (the long empirical-branch form carrying provenance, joint estimation, retained discrepancy and the circularity clause); B is the lesson-facing compression, C is d3's measured sentence now rejected, D the short refined-type form deferred. Eight questions left open, incl. final wording, headword suffixes, estimator ownership, result vocabulary, the provenance-independence threshold, the joint-result schema, and a NML2.1 lesson-plan successor (lesson d1 now sits behind both content d2 and this packet). Sorted from inbox 2026-08-01; dN honoured as the file states it. RECORDED EXCEPTION (user instruction 2026-07-27) as for d2/d3: packet internals are the USER's, not managed by the catalog or by Claude. Normalization was a no-op: already in $/$$ form at source, nothing banked. CORRECTION NOTE FILED AGAINST THIS PACKET 2026-08-01 — Newton-analysis/vector_division_mass_estimation/why_reconciliation_cannot_be_upstream_of_E10.md. SUPERSEDED as the working account by d5 the same day; retained as the pre-correction reasoning state. This file was NOT edited — the correction was carried into a new packet, per the packet-internals exception and the never-archive rule."
