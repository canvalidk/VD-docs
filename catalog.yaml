    note: "MASS ESTIMATION INTRODUCTION: DEVELOPMENT PLAN (221 lines, VD-Newton-side, 2026-09-06), received 2026-09-08 from VD-Newton's pass to VD-docs/ staging folder (branch codex/nml2-entry-renumbering @5ae1797, subfolder Mass estimator/). Filed IN THE NOTE FOLDER as a workbench record - the plan d5 was drafted from, requested by him before drafting after he endorsed the argumentative order; same placement caveat as the sources record. THE PLAN: bring the reader to 'What, then, is inertial mass - what operation determines it from force and acceleration?' by six stages - (1) the apparent symmetry and the vector-division hook, the magnitude repair allowed to arise; (2) the requirement that all three operations remain usable over the same quantities, brought in BEFORE the counterexamples; (3) THE PIVOT, independent obtainability derived from the other two corners, with the hinge paragraph and four precisions (it concerns determining an unavailable quantity, not computing from two measured ones; dependencies not statistical correlation; an externally imposed common direction is a special case; a separate compatible latent pair is part of the determination whatever routine computes it); (4) why magnitude division cannot discharge the required operation, the perpendicular example now testing an operation whose input obligations are established; (5) the zeros and the practical stakes, exact facts stated separately from empirical readings, the sigma/A, F/sigma, sigma/sigma behaviours only with their model stated, and no industry-wide claim before a concrete example is verified; (6) the question the rest of the work must answer, with the estimator, its measure, the composition theorem and the loss deliberately withheld. Sec 4 the smaller pressures to weave in (mass should not be undefined; correct units are not enough; multiplication by zero erases the distinction; no single number patches exact zero-zero; a finite result can disagree with the naive quotient - not to be established by assuming our estimator). Sec 5 how to revise d4: keep the opening, move and strengthen the justification for independent channels so it precedes the counterexamples. Sec 6 two writing passes and seven completion questions. His steering preserved in sec 7. Normalization a NO-OP, nothing banked."
