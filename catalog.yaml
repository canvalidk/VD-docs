    note: "A COMPOSITION UNIQUENESS PROOF FOR THE MASS READOUT (163 lines, VD-Newton-side, 2026-09-06), received 2026-09-08 from VD-Newton's pass to VD-docs/ staging folder (branch codex/nml2-entry-renumbering @5ae1797, subfolder Mass estimator/); flat in the mass_estimator discussion, kind unstamped. THE THEOREM: for a readout R determined by the JOINT LAW of the positive magnitudes (f, alpha) with finite means, five assumptions force R = E[f]/E[alpha]: C1 force composition R(X1+X2,Y) = R(X1,Y)+R(X2,Y) on one propagated joint law; C2 inverse-mass composition under acceleration addition; C3 magnitude-law dependence (no probability-space labels, no extra latent variable, no direction information beyond that law); C4 point calibration R(x,y) = x/y on constants; C5 constant-limit continuity (L1 convergence to a constant c gives T to c). THE NEW STEP (sec 2): computing R(X+1,Y+1) in the two composition orders gives expressions whose difference is minus (ry-x)^2 over a positive denominator, so ry = x and R separates as T(X)/S(Y) for ARBITRARY couplings - no product-law or coefficient-family restriction, which is what the earlier sketch in what_forces_the_ratio_of_means_readout sec 4 lacked. Sec 3: additivity plus law-dependence plus C5 give T = E via iid sample means. Existence and uniqueness both hold. Sec 5 THE NECESSARY CAUTION: if the readout may use the full (f, alpha, u) law rather than the induced magnitude law, a direction-tilted family R_h = E[h(u)f]/E[h(u)alpha] with h = 1+(u.v)^2 satisfies both compositions, reciprocity, units covariance, calibration and continuity yet differs (109/92 vs 5/4 on a two-point example) - so C3 is load-bearing and the paper must justify using P's magnitude law without a second direction weighting. Sec 6 what still needs finishing: justify the theorem's scope as requirements of the operation (C1/C2 are operational commitments, not consequences of F=ma); specify the measure and the measurement model (the theorem takes P as given); uncertainty and downstream standing; repeated-trial scope (common-mass measure unsolved); numerical validation. The two-order identity was checked by exact polynomial expansion. It answers his 'eleventh solution' objection at the readout level. Relation: scopes what_forces_the_ratio_of_means_readout (replaces its sec 4 sketch with a direct argument) - unbound, as before. Normalization a NO-OP (dollar delimiters), nothing banked. KEPT FLAT 2026-09-15 when the rest of the 09-06..09-08 batch went into unsanctioned/ - Claude's call, not his: a self-contained theorem that answers a question the flat records pose (what_forces_the_ratio_of_means_readout). Cheap to push down if he disagrees. REVIEWED 2026-10-22 in the mass-estimator sweep: confirmed a record under his ruling that VD-docs holds made decisions only. A decision is its subject (thesis, settled correction, proof or ruling), so it stays in the slimmed discussion; kind stamped record."
