    note: "WHY THREE? UNEQUAL STATEMENTS OF ONE LAW, LAW CORNERS, AND THE ORIENTATION TRAP - record written by Claude 2026-10-19/20 at the user's request ('Yes will you rewrite it please'), superseding law_corners_and_the_orientation_trap_2026-10-19.md wholesale after his correction that the earlier record emphasised the wrong point ('Have you ever asked why forms of Thermo second law and 3 restatements ... even though they aren't exactly all the same?'). Attribution inline: [Can] for his points, [Claude] for mappings, formulations and objections, offered not ruled on; literature unverified. NEW CENTRE: (sec 1, his) the nerve of asking WHY THREE - anyone sees the count, nobody had a place to put the question; Claude's gloss: physics, history and logic each call the count noise, so question and answer arrive together. (sec 2) The statements are NOT equivalent: Planck strictly stronger than Nernst, Nernst-unattainability long disputed; Clausius = Kelvin-Planck proved, Caratheodory needs extra assumptions, entropy increase and Carnot's theorem are further standard statements. (sec 3) THESIS: a law is its HOUSE (the headword triplet), not one proposition - physics counts unequal statements as one law, so non-equivalence is the evidence for the corner view, not an embarrassment; his line that a corner need not carry the full content but can; the 'law identity is the house' formulation is Claude's, emphasis confirmed by him. Carried over: worked corners for third, second, first law and Newton II, Caratheodory integrating factor as co-birth, houses chain; mystery-as-dropped-node (energy conservation); the orientation trap, now explicitly fuelled by the non-equivalence (equivalent corners would make the choice mere taste); alternative logs and the SI. NEW sec 5: predictions P1 (unequal statements sort by headword) and P2 (differences live in the borrowings); THE HINGE - the second law has more than three statements, so the claim is three CORNER statements with the extras reducing to corner plus wall, otherwise selection; a candidate MEMBERSHIP TEST against 'same law' degrading into 'same topic'. Open items renumbered to 12; RULINGS OWED on item 1 (VD_LAW_HOUSE_FOUNDATION rule 8) and item 7 (energy and symmetry); old item 2 became the thesis, old item 4 the hinge. PLACEMENT: same Theory record folder as its predecessor (a record folder binds superseded versions). Not a criticism of the entry structure (SORTING 2a). Normalization: NO-OP, written in $/$$ form at source, nothing banked."
