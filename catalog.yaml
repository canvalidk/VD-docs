    note: "PARTICIPANT-SYMMETRIC CANONICAL ORIENTATION - MESHING NOTE, d1, 2026-08-15, CLAUDE-AUTHORED at user request in VD-docs (unlike its two parents, which were authored outside the repo). Meshes Newton-analysis/participant_symmetric_forces/ (owner-blind activation, closure theorem, half-weighting) with Newton-analysis/canonical_force_orientation/ (canonical recipient + canonical vector as the V(f) wall's runtime input, sigma(f) rejected), and DISCHARGES the convention note's open question 4: for the participant-symmetric branch the canonical recipient is supplied STRUCTURALLY, per owned instance - it is the non-owner, with the owner in the constitutive-carrier role of the asymmetry sketch's template - so no human runtime orientation choice survives at the evaluation level. THE SIGNS, with r-hat oriented owner -> non-owner: A_gravity = -(G m_o m_n / 2r^2) r-hat on the non-owner, R_gravity = +(G m_o m_n / 2r^2) r-hat on the owner; the MINUS BELONGS TO THE ACTION (template fit; textbook continuity - the quoted canonical formula is the familiar -Gmm/r^2 r-hat with owner as source, halved; the flip passes the convention-reversal test but is pointlessly nonstandard). Coulomb has the same structure with the sign carried by the coupling product: A = +(q_o q_n / 8 pi eps0 r^2) r-hat. VERIFICATION: four-occurrence table sums to the full equal-and-opposite textbook pair on each target; passes convention reversal, equal-and-opposite underdetermination (the demanded input relocated from human supply to ownership typing), interaction-before-value, and invalid-target from the convention note's test battery. STRONGEST STRUCTURAL FINDING (sec 10): the two members landing on any one target are EQUAL VECTORS, so a fully convention-free local statement exists - every gravity member on target p has value (Gmm/2r^2) r-hat_{p->other}, half strength, pointed at the other participant, exactly two of them - and the A/R labels are EVALUATION-INVISIBLE (real, carrying instance identity and construction history, but never affecting the value a target receives). Sec 11: this makes NML3's distinct-equal-valued-forces case (open problem test E) the GENERIC gravitational case rather than an edge case - direct pressure on NML3 open item 6 toward instance-carried identity. Sec 16 RECORDS THE ALGORITHMIC RATIONALE from the 2026-08-15 discussion, not previously in the corpus: three algorithms compared - (a) field/per-target, stateless but drops the pair ontology and needs a j-not-equal-i clause; (b) pair-based with N3, keeps pairs but demands an arbitrary side choice corresponding to NO physical datum in the symmetric case plus a pair-ledger of global mutable state threaded through the trace; (c) VD owner-uniform with halving, stateless AND pair-preserving, self-action excluded by typing, with 1/2 as the entire price, fixed at design time by the closure theorem rather than counted at runtime. Sec 17 resolves the apparent collision with NML3's banned half-F_net decomposition: the banned move manufactures MEMBERS from algebra on the resultant, whereas half-weighting assigns VALUES inside already-warranted members - membership first, values second, forward-only reading preserved. PART VII (secs 18-20) is a READING GUIDE for cold readers (human or AI): a dependency-chain diagram from the aggregate/member correction through the Force-Sum abstraction (custody: VD-Newton; local carrier is the asymmetry sketch) to the NML3 membership machinery, the asymmetry sketch, the half-weighting theorem and the convention note, then a per-note what-to-read-it-for paragraph and a three-sentence summary of the whole. OPEN (sec 21): whether the constitutive-carrier branch's recipient is also structurally discharged or retains genuine runtime convention content (convention note qq 2-3); the locally decidable mark of branch membership licensing weight 1/2 vs 1 (half-weighting q3 in operational form); whether A/R evaluation-invisibility bears on convention q6 (action/reaction as headwords); interaction with the open problem's identity-representation candidates; n-participant generalization. PLACEMENT: own note folder per house convention, beside its two parent siblings in Newton-analysis. No entry wording proposed, no headword selected, no VD-Newton file read or edited. Normalization check 2026-08-15: no-op, authored in $/$$ form from the start, nothing banked."
