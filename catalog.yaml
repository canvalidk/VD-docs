    note: "THE NO-LOOKUP RULE, d1, 2026-08-17, CLAUDE-AUTHORED, SUPERSEDED THE SAME DAY BY d2. The rule is the user's, stated in rejection of a lookup-based proposal Claude had made in the same discussion: a reader executing a residual may use the local text of that residual and their own external competence, but may NOT consult the log; the log is reachable only by expansion, at a tracked position, from the mechanical layer. d1's structure: a three-way failure decomposition (locality, append-monotonicity, licensing) treated as CO-EQUAL criteria; lookup read as delta done wrongly (same information, no position, no record, no reversibility, uncheckable licensing); the two-way wall framing (mechanical layer never consults reader judgment; reader never consults the log); and the identification of the implemented headword scan and order-0-by-fiat guards as instances of the same rule. RETAINED FOR THE RECORD, NOT FOR USE - d2 itemizes in its Part V exactly what it withdraws, and the withdrawals are substantive rather than editorial: d1 stated the rule with the WRONG DISCRIMINANT (log-vs-trace rather than positional), so it mislocated both the failure mode and the boundary. Specifically superseded: the three co-equal failures (demoted to symptoms of a single disease, the second argument to raw_meaning); the permitted-use list of sec 7, which silently OMITTED trace memory and so neither permitted nor excluded it; the frame/lookup discrimination by append-monotonicity (withdrawn - trace memory passes that test); depth-1 positional access as a cheap starting mechanism (withdrawn - bounded memory is memory); and the treatment of target as a trace-level constant needing no delivery. Read d2 only, or d1 for the record of the misdiagnosis. Normalization check 2026-08-17: no-op, authored in $/$$ form, nothing banked. RECORDED DEFECT (shared with d2 and with the argument-layer note, NOT fixed on filing per user hold): the 'Bears on' list cites 'specs/2026-06-10-vd-reduction.md' and 'specs/2026-06-10-vd-residual-cleanup.md', which are not real paths - the files are Code/specs/vd_reduction_spec.md and Code/specs/vd_residual_cleanup_spec.md. The section numbers cited against them do resolve. 2026-08-20 KIND PASS (first application of the record/note model, deliberately limited to three cases so the model can be felt before a full pass): RECLASSIFIED as a RECORD, superseded on content. Applying the successor test: d2 does not say this document better, it says something DIFFERENT - the user rejected the rule stated here and the rule itself changed, with d2 carrying an itemized retraction list. That is supersession, not drafting. Both files stay live and keep their filenames."
