    informs: "Code -> Newton (sec 19.1: every object-dependent Newton headword gains an arity, the tokeniser stops dropping arguments everywhere at once, and this lands on the ALREADY-QUEUED Newton rewrite with a second reason and a wider scope; sec 19.2: arity is a physics claim, so wrong arity is substantive error rather than typo). NO INFORMING COPY MATERIALIZED - link recorded only."
    note: "THE ARGUMENT LAYER - WHY POSITIONAL LOCALITY FORCES ARITY INTO THE INTERPRETER, d1, 2026-08-17, CLAUDE-AUTHORED, CURRENT. A SEPARATE NOTE FROM no_lookup_positional_locality, not a d3 of it: its own header names the no-lookup d2 as a PARENT rather than a predecessor, and note identity follows the file's own declaration (same ruling as the participant-symmetric case, 2026-08-14). Parents: no-lookup d2 (positional locality, pull vs push), the participant-symmetric canonical-orientation meshing note d2 (the V(f) case), and the two simulator specs. THE CLAIM: positional locality is not a hygiene rule but a constraint on what the interpreter must compute; given it, argument delivery cannot be left to notation, convention or the reader, and must be a mechanical-layer operation. Stated priority (the user's): LOCAL DETERMINATION OUTRANKS MINIMALITY OF THE VD'S PRIMITIVES - machinery is justified by locality failing without it, never by elegance. Sec 4 is the mechanical-necessity argument: delivery cannot be a convention, because a reader supplying the argument from recollection makes execution depend on another position no matter that the datum is correct; the datum must be IN THE TEXT, and only the interpreter knows the position. Sec 5 lists what the interpreter must therefore compute - declaration, delivery, propagation, gating, recording - of which delivery and propagation are the layer proper. PART II SHAPE: sec 6, ARITY IS DECLARED BY THE DOMAIN HEADWORD, so the slot name IS the domain headword (net-force(point-particle), impressed-force(interaction-instance, point-particle)); no new declaration syntax, admission type-checked by the meta-typing triplet E28-E30 which HAS HAD NO CONSUMER UNTIL NOW, and the dependency edge runs to the static DOMAIN headword rather than the delivered value, so law detection, cycle detection, house structure and degree computation are untouched and the graph never moves at trace time. Sec 7 (the user's): the bare headword IS the parameterised headword, no unparameterised fallback, which is what makes propagation automatic rather than per-entry opt-in - and retires both the underscore device and the category of 'ignorable dependence'. Sec 8: coreference falls out, since one slot delivered once fills every occurrence and the index-mismatch error becomes UNWRITABLE rather than auditable. Sec 9: arity is per headword, not per definition - two definitions wanting different parameter lists is the formalism reporting that one name is doing two jobs, the same diagnostic as the additivity and MDP collisions. Sec 10 (the user's rejection of closure-as-gate): open parameters are a LEGITIMATE state, closure is a degree and not a gate on presentation; an open slot is information, not absence, and the reader's correct act is to wait. Reduction gains a second precondition alongside is_resolved. Sec 11 WITHDRAWS an earlier draft's requirement that delivered arguments be order-0: headwords are constants, not free variables, so the real condition is that a delivered value be CLOSED, which splits parameters into headword-valued (creates a hole, expandable, verified by instance-of) and instance-valued (ground data, no hole). Sec 12: dispatch IS a headword-valued argument - vtable structure, first-order - and dispatch has been the single item blocking Design 3 entry, needing no machinery beyond this layer. PART III THE IDENTIFICATION: the holes of a Residual, keyed by original position, ARE a binder, and because the keying is positional the positions are DE BRUIJN INDICES - which is why original-position keying gives stability for free and why capture cannot arise. The forwards pass is DELTA (expand and deliver both BUILD the term, neither computes) and the backwards pass is BETA (fold is a post-order sweep, i.e. call-by-value, and the is_resolved gate is exactly the CBV strictness requirement) - the identification of the backwards pass as beta is the user's. Sec 15 offers the evidence: four spec decisions each justified locally at the time fall out of the beta reading (unresolve clearing reduced up the ancestor chain; a reduced node masking its descendants; reduced text being order-0 so the graph cannot grow backwards; strong gate for reduce vs provisional gate for cleanup). Sec 16 nonetheless argues the fragment is NOT lambda-calculus, on three grounds - one binder with several bodies makes it a CLAUSE SET WITH A SHARED HEAD PATTERN (logic-programming shape, so adding the binder sharpened the multiple-definitions obstruction rather than dissolving it), it is first-order, and there is no unification - and notes that capture is UNREACHABLE, so the formalism needs lambda's notation and not its machinery, escaping the higher-order and non-termination hazards. SEC 17 IS THE ITEM FLAGGED HIGHEST-VALUE PER UNIT OF WORK: confluence is an AUDIT. Since the contraction engine is a human, Church-Rosser is not guaranteed and is therefore testable - fold the same trace twice under different orders and the root values must agree, with divergence localising a bad contraction to the split node. This is the checker previously thought unbuildable (a (render, reduced) checker would have to decide which arithmetic lies within its competence, and there is no principled line; confluence needs no competence at all), and it is the consistency condition the probability programme requires. It also reframes fold's open scope-variant question as reduction strategy rather than UX. COST (sec 19) and BUILD ORDER (sec 20): parameter representation and delivery with slots inside latents so hole positions never shift; the reduce-gate extension; instance-of wiring; the confluence comparison, independent of the rest; and the sigil and tokeniser change LAST, so it settles together with the hyphen convention rather than in competition with it. Nothing requires Design 3 to land first; items 1-4 are additive to the current engine. Also flagged: delivery interacts with cleanup, so the cleanup offer must fire ON DELIVERY and not only on settle. OPEN (sec 21): whether a provenance field is needed under sec 7's uniformity, and DEFINITION SELECTION - two coexisting definitions of net-force make expansion nondeterministic, so selection is an input never named as one and not a wall in the current taxonomy; it does not break locality, since the choice precedes the residual's existence and expand records it, but it is unaccounted. PROVENANCE, per the note's own closing section: positional locality and its correction, the priority of local determination over minimality, the uniformity of parameterisation, the rejection of closure-as-gate, and the beta identification are the USER'S; the elimination table, mechanical-necessity argument, domain-edge construction, coreference result, fragment classification and confluence audit are Claude's analysis. No entry wording is proposed and no VD-Newton file was read or edited. FILED TO CODE 2026-08-17 with its parent note - see that entry for the Code-vs-VDfirst reasoning. Normalization check 2026-08-17: no-op, authored in $/$$ form, nothing banked. Broken spec citation paths recorded on the no-lookup d1 entry, not fixed (user hold)."
