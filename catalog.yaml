    note: "NML3 ENTRY-STRUCTURE RESET RECORD (2026-08-17), parent-level object in nml3/. Records the reset of NML3 triggered by the decision to re-cut the entry structure after the conceptual work matured. WHAT IT DOES: fixes the boundary between what the re-cut retires and what it leaves standing, and does so BY LAYER rather than by date - the criterion is whether a note's content depends on which entries exist and which wall each carries. Two layer subfolders created (STRUCTURE EXCEPTION, the same shape as the nml2/ parent-folder exception): nml3/conceptual/ holds the six entry-cut-INDEPENDENT notes (foundational understanding, warranted-account explication, steel-man, logical consequences, vocabulary reservoir, open problem) which are NOT retired and are the input to the new cut; nml3/entry-cut-dependent/ holds the five notes written against the retired cut (entry-to-lesson bridge d1, content specification d1, primitive exercise bank, younger-student mock lesson and its Newton-meters add-on), RETIRED AS AUTHORITY and KEPT AS REASONING RECORD. Retired specifically: the bridge's sec 3 one-wall-per-winter-word repair (E16 force-member/admission wall as generator, E17 IFS/closure wall as closer), its triplet-corner assignment (E14 IFS corner, E15 force-member corner, E13 net-force-material-object summed after closure), its sec 9 packet targets for E13-E17 as IRIL-allowed/IRIL-blocked/IRIE slots, and its sec 11 twelve-step production order incl. write-E13-last. METHOD FOLLOWS THE E10 PACKET PRECEDENT: nothing deleted or archived (never-archive rule), and NO RETIRED FILE WAS EDITED IN PLACE - no banners were added, the boundary lives in the folder placement, the catalog notes, and this record, exactly as the E10 d2-d5 corrections were carried into new files rather than written back. THE NEW CUT IS NOT IN THIS FILE: entry production is authoritative in VD-Newton and E-numbers are shared across all of Newton (E8-E17 span the entry passes and packets), so the ruling on whether the new structure reuses E13-E17 with new wall assignments or advances to fresh numbers is a source-side decision to be mirrored here. Reuse would make every existing citation of E16 ambiguous between the two structures; until it is settled, bare E13-E17 references inside nml3/ name the RETIRED cut. When the new cut lands it goes in a NEW parent-level note, not as a dN of the bridge (a re-cut is not a successor draft of what it replaces), and this record gains a pointer to it. TWO JUDGMENT CALLS FLAGGED IN SEC 2 for revisiting: the primitive exercise bank and the two younger-student lessons may carry cut-INDEPENDENT material (the primitive-exercise insight, the pedagogical devices) inside a cut-dependent organisation; if so the durable part should be re-extracted into conceptual/ as its own note rather than promoted back in place. NOT an excavated note - it is a boundary marker, so no dN, no successor line, and the layer subfolders are NOT note folders (no note_name implied by membership, no draft order implied by the split). Claude-authored on user instruction; the choice of layer-split over a dated generation folder was the user's."
