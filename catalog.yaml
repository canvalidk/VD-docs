    note: "NML3 LOGICAL CONSEQUENCES: CONSOLIDATED STATEMENT (2026-08-08). Self-described status: active local consolidation that deliberately REPEATS material from the other NML3 notes so the consequences can be read in one place; it selects no final entry wording. Structure: 8 accepted premises, 22 direct consequences, 1 conditional architectural consequence, a compact evaluator summary, and a provenance section. The premises are the ones the other nml3 notes had already reached - one correct IFS per target under fixed conditions, membership warranted independently of whether the vector value helps reproduce the measured net force, one acting-object instance as each member key, the material object as owner/target rather than key, set (not list) semantics, net force as the sum of all and only complete-IFS members, a generator with successor structure R(N) = {W_N} + R(N+1), and a separate closer supplying a terminal R(K) = empty. Load-bearing consequences: the account-to-resultant map is MANY-TO-ONE (8), so repeated positive generation never establishes completeness (9) and generation and closure have different logical forms (10) - existential vs universal; a matching current sum does not establish closure (14) and residual testing is ASYMMETRIC (15), a nonzero residual refutes while a zero residual proves nothing; search failure is not proof of absence (17); vector cancellation does not erase membership (6) and zero net force does not determine an empty IFS (7); duplicate-freedom and completeness are independent (12); there is no intrinsic final force in a completed set (11). Consequence 23 is the flagged CONDITIONAL one: requiring every valid trace to reach a finite K with R(K) empty commits the architecture to FINITE force accounts, and permitting infinite accounts would need separately specified infinite summation, convergence, and enumeration-order independence - not yet chosen. COVERAGE GAP worth knowing: its provenance section lists six local source notes, and four of them have NO copy in VD-docs (NML3_ACTING_OBJECT_FORCE_ROLE_SET_CONSTRAINT_2026-08-08, NML3_GENERATOR_NONTERMINATION_CLOSURE_CONSTRAINT_2026-08-08, NML3_ENTRY_WORKING_PLAN, nm_l3_lesson_draft) - they are live at VD-Newton, so this consolidation is currently the only managed record of what they established. Sorted from inbox 2026-08-09. NOT an excavated note - no dN model applied. NORMALIZED on intake: 7 inline-delim edits, all four hard gates passed, original banked at _math_originals/2026-08-09/. Soft flag mixed-delimiter-styles, same two-convention drafting as the 2026-08-05 explication. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/conceptual/ (path field updated; filename untouched, no dN implied by the move). This note is ENTRY-CUT-INDEPENDENT and is NOT retired by the reset - its content does not depend on which entries exist or which wall each carries, so a re-cut of the NML3 entry structure leaves it standing as live authority and as input to the new cut. Boundary record: Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md. The layer subfolder is NOT a note folder - note_name stays null."
