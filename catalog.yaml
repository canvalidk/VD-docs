    note: "CURRENT SYNTHESIS of this note (~700 lines), authored 2026-08-01 against VD-docs commit 8e09dbf. The correction: the earlier arguments said 'measured vectors' without separating three stages — OBSERVATION (raw channel output, not yet a bare value of the demanded headword), INDEPENDENT MEASUREMENT RESULT (estimate + covariance + provenance, produced per channel), and JOINT NEWTON-II-CONSTRAINED ESTIMATE (latent codirectional pair + mass, fitted under the law). The tempting move — defining a measurement as one already reconciled with Newton II — is shown UNAVAILABLE by two counterfactuals (secs 3): it makes the force and acceleration channels mutually dependent, so the law confirms itself. Consequences: EVERY empirical mass determination takes the joint branch, including a displayed-aligned pair (sec 5); the joint fit does not by itself supply evidence FOR mass (sec 6); and the residual must survive (sec 4) because the latent outputs satisfy Newton II by construction, so the discrepancy is the only thing keeping the imposed law answerable to the evidence. Sec 7 is why E10 must still be long — the IRIL cannot carry the distinction alone, the lesson cannot repair the entry, and a refined type does not make the total design shorter for free. Sec 9 draws the NML2.1 boundary (teach the topology of the joint operation, do not select or execute an estimator); sec 10 the packet/evaluator consequences; sec 12 states the intended catalog disposition, which is what the d1/d2/cannot_be_short updates above implement. Sorted from inbox 2026-08-01; dN honoured as the file states it. Its selective supersession is the point: d1's estimator mathematics and d2's secs 1-6 stay live — see the exceptions recorded on both. Normalization was a no-op: already in $/$$ form at source, so nothing banked. COMPANION ADDED 2026-08-01: why_reconciliation_cannot_be_upstream_of_E10.md supplies a STRUCTURAL argument this note does not make (sec 3 here argues reconciled inputs are epistemical