  - path: "Newton/nml/nml2/nml2.2/NML2_2_pre_water_student_content_inventory_d1.md"
    type: md
    role: primary
    tags: []
    project: nml2.2
    status: draft
    dup_group: d33
    note_name: nml2_2_pre_water_inventory
    draft: d1
    current: true
    variant: null
    orig_name: null
    note: "WORKING NOTE (NML2.2 target construction): exhaustive inventory of everything the student must own BEFORE the flowing-water / lower-dimensional-redundancy example — trackability I/II, iterability, task/tolerance, five-aspect coverage, translational redundancy, lumping, target/mass addresses, MDP families, the two-halves persistence certificate, halt discipline; ends at the handoff question that opens 1D redundancy. Synthesises the current NML2.2 drafting context, split ratification, question bank, trackability/lumping note, mass pipeline, and the five-aspect coverage note (its own sec 39). Sorted from inbox 2026-07-22. Feeds the future nml2.2_lesson; informing copies into the 2.2 bundle deferred until 2.2 drafting starts, per the standing deferral. CORRECTED BY vd_review_corrections d1 (2026-07-24, filed 2026-07-25) - amendments to record, this draft NOT yet edited: sec 14.1's offset criterion is replaced by distance preservation and split into eps_shape plus eps_trans (sec 1 of the record); sec 14.6's inertial-frame leak into lumping is resolved by that split; sec 9.2's coverage parameter must gain its own mass budget eps_m (sec 4.4); sec 19 needs negligibility as a sixth determination family and Part VIII needs a framing paragraph declaring its procedures unjustified worked examples; sec 20's record form must be reweighted UP in the checklist; secs 10.4, 11 and 12.2-12.3 need distinctiveness reclassified as experimental preparation, a distinctiveness-vs-fidelity trade-off added, and a re-audit of extent, density and balance on surviving tracks; sec 36's water example is proposed for replacement by the inextensible chain, with water demoted to a one-page contrast case."
  - path: "Newton/nml/nml2/nml2.2/one_dimensional_redundancy_vscode_math_d1.md"
    type: md
    role: primary
    tags: []
    project: nml2.2
    status: draft
    dup_group: d34
    note_name: one_dimensional_redundancy
    draft: d1
    current: true
    variant: null
    orig_name: "one_dimensional_redundancy_vscode_math.md"
    note: "WORKING NOTE (NML2.2 target construction): the post-gate content the pre-water inventory hands off to — one-dimensional projected redundancy licensing a fluid to be represented as an ordered, address-discrete stream of massive particles; emission-time mass labels; continuum lambda=dm/dh read as a coarse-graining OF already-addressed particles, not their origin; droplets / Rayleigh-Plateau as downstream; failure modes; the hose worked example. Renamed +_d1 (lossless, orig_name recorded). Sorted from inbox 2026-07-22. Feeds the future nml2.2_lesson (the flowing-water example). CORRECTED BY vd_review_corrections d1 (2026-07-24, filed 2026-07-25) - amendments to record, this draft NOT yet edited: secs 4 and 19's max-height-spread test is RETAINED but renamed a localisation criterion, distinct from redundancy, which now carries the two tolerances eps_shape and eps_trans (record sec 1); the velocity-spread-times-interval coupling is what forces re-lumping over a long fall; sec 7's ordered-many point is promoted from caveat to result by pairing water against the inextensible chain, which projects to ONE bundle where water projects to an ordered many (record Part II) - and the record's open item 7 flags that treating water as a success case may conflict with nml2_split_ratification, which has fluids as a defeat case (unconfirmed, the ratification doc was not retrievable during the review)."
  - path: "Newton/nml/nml2/nml2.2/vd_coverage_five_aspects_and_industry_appearances_d1.md"
    type: md
    role: primary
    tags: []
    project: nml2.2
    status: draft
    dup_group: d35
    note_name: coverage_five_aspects
    draft: d1
    current: true
    variant: null
    orig_name: null
    note: "WORKING NOTE (NML2.2 target construction): develops the coverage half of the target-persistence certificate — the five aspects (extent, density, balance, distinctiveness, observability), their trade-offs, the operational audit, the two residues (seeding vs resolution), and industrial groundings (DIC, PIV/PTV, structural health monitoring / optimal sensor placement). Cites vd_trackability_scene_to_particles d4, the NML2 question bank, and nml2_split_ratification as internal sources. Sorted from inbox 2026-07-22. Feeds the future nml2.2_lesson. BEARS ON vd_review_corrections d1 (2026-07-24, filed 2026-07-25): the record's sec 5 reclassifies distinctiveness as experimental preparation (scene-making) rather than a fifth coequal sampling aspect, adds a distinctiveness-vs-fidelity trade-off (a more distinctive tracer risks tracking itself - density mismatch, Stokes number, tracer slip, as in PIV practice), and its sec 4.4 requires the coverage declaration to carry its own mass budget eps_m, since a position tolerance cannot bound escaped mass. The record cites the inventory's section numbers rather than this note, so these are read as bearing on this note's content; confirm against this draft before amending it."
  - path: "Newton/nml/nml2/nml2.2/glass_ball_mdp_example_d1.md"
    type: md
    role: primary
    tags: []
    project: nml2.2
    status: draft
    dup_group: d36
    note_name: glass_ball_mdp_example
    draft: d1
    current: true
    variant: null
    orig_name: "glass_ball_mdp_example.md"
    informs: "glass_ball_mdp_example (home) -> nml2_2_lesson (worked example; informing copy into the 2.2 bundle deferred until 2.2 drafting starts, per the standing deferral)"
    note: "WORKING NOTE (NML2.2 target construction), authored 2026-07-24, sorted from inbox 2026-07-25. The glass-ball worked example separating lumping from mass determination: lumping decides which target may own a mass value, an MDP decides what value sits at that target's mass address. A 1 kg glass ball hits a wall and cracks; object count is shown to be an OUTPUT of the redundancy audit, not something supplied by the word 'glass' or by the visible crack (crack is neither necessary nor sufficient for a split). Three post-impact cases (licence held / licence lost then reassembled / several surviving targets), then a fast-robot scenario that runs four determination routes on the same scene - density-volume, weight-gravity, partition and remainder/assembly - each with its assumptions, failure modes and uncertainty budget, ending in a Newton-II prediction that inherits its mass value's provenance. Eight numbered lessons in Part XI. Renamed with +_d1 suffix (lossless, orig_name recorded); filename deliberately KEEPS 'mdp' pending the terminology decision recorded on the vd_review_corrections entry (user 2026-07-25: record the rename, do not act on it). CORRECTED BY vd_review_corrections d1: sec 3 (the M_A = M_B deduction needs n persistence certificates plus material closure stated as premises, currently hidden in the notation) and sec 4 (the sub-resolution loss must be given its own flake TARGET bound by a negligibility determination, not absorbed into the variance budget; the bound is asymmetric and non-zero). Both are amendments to record, not yet written into this draft."
  - path: "Newton/nml/nml2/nml2.2/vd_review_corrections_d1.md"
    type: md
    role: primary
    tags: []
    project: nml2.2
    status: draft
    dup_group: d37
    note_name: vd_review_corrections
    draft: d1
    current: true
    variant: null
    orig_name: null
    informs: "vd_review_corrections (home) -> nml2_2_lesson (Parts I, II and V - the lesson-facing corrections and the open-item list); -> presentation track (Part III - see the SEAM FLAG below; receiving home not yet established, no copy materialized)"
    note: "WORKING NOTE (NML2.2 target construction), authored 2026-07-24, sorted from inbox 2026-07-25. Corrections record from an adversarial review of three NML2.2 documents - the pre-water inventory d1, the 1D redundancy note d1, and glass_ball_mdp_example d1 - filing each objection as resolved, withdrawn, retracted or promoted. Part I: (1) the redundancy criterion is split into TWO named tolerances, eps_shape (distance preservation, licenses a body, permits rotation and forbids bending - replacing the offset criterion, which wrongly forbade rotation) and eps_trans (residual scatter, licenses one particle), with the 1D note's max-height-spread test kept but renamed a LOCALISATION criterion; also records that distance preservation is rotation-frame-blind, which moves the inertial-frame commitment forward to the Newton-II step instead of leaking back into lumping, and that velocity spread times interval length bounds admissible interval length. (2) The force-pipeline objection is withdrawn on scope (forces are the next lesson) with two changes still required - declare Part VIII's procedures as unjustified worked examples, and reweight the checklist toward the record form. (3) The M_A = M_B objection is partially retracted - same additivity rule twice, but the co-reference of the fragment masses across the scatter interval is n persistence certificates plus material closure and must be stated. (4) The flake objection is resolved and PROMOTED into general procedure - suspected unrepresented material gets its own address and a negligibility determination yielding a BOUND, which makes negligibility a sixth determination family, and which exposes the load-bearing gap: coverage currently inherits a POSITION tolerance and has no mass scale, so a new eps_m budget is required to close the certificate. (5) Distinctiveness is retained but reclassified as experimental preparation rather than a fifth sampling knob, adds a distinctiveness-vs-fidelity trade-off (tracer slip / Stokes number, as in PIV practice), and flags a re-audit ordering bug (extent, density and balance are never re-audited on surviving tracks). Part II proposes replacing water as the lesson vehicle with the INEXTENSIBLE CHAIN OVER A PULLEY - 3D redundancy fails exactly, arc-length redundancy holds exactly, and the lesson ratifies a move every first-year already makes - keeping water as the contrast case that yields an ordered many rather than one bundle. Part III (presentation track) argues volume is not a Newtonian quantity, keeps the two gates separate, and sets up the Mach dispute. Part IV proposes renaming MDP. Part V carries eight open items forward. SEAM FLAG (user decision 2026-07-25): this doc is deliberately two-track - Parts I, II and V are lesson-facing, Part III is presentation-facing and its own open item 8 states the two tracks now want opposite things and will degrade if kept as one document set. Filed WHOLE in nml2.2 with the seam recorded rather than split, since the presentation track has no established home yet; splitting is deferred to a dedicated session. OPEN TERMINOLOGY ITEM (Part IV, recorded not acted on per user 2026-07-25): 'MDP' collides with Markov Decision Process; candidates are mass determination, mass-binding process, or mass valuation (the doc favours valuation, pairing with 'address'); the doc notes the cost of the rename rises monotonically and asks for it before the presentation. No file or in-document renames performed. UNRATIFIED ADDITIONS needing the ratification route rather than silent adoption: eps_m (Part I sec 4.4), negligibility as a sixth family, and the open item that the chain-as-success vs fluids-as-defeat ordering may reopen a ratified decision in nml2_split_ratification (that document was not retrievable during the review, so the conflict is unconfirmed). Largest gap the review found: no taxonomy slot for a bundle with a licensed common velocity and no licensed common position - the convoy case - which is exactly where the standard first-year chain treatment lives."
