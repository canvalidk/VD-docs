    note: "NML3 LOGICAL CONSEQUENCES: CONSOLIDATED STATEMENT (2026-08-08). Self-described status: active local consolidation that deliberately REPEATS material from the other NML3 notes so the consequences can be read in one place; it selects no final entry wording. Structure: 8 accepted premises, 22 direct consequences, 1 conditional architectural consequence, a compact evaluator summary, and a provenance section. The premises are the ones the other nml3 notes had already reached - one correct IFS per target under fixed conditions, membership warranted independently of whether the vector value helps reproduce the measured net force, one acting-object instance as each member key, the material object as owner/target rather than key, set (not list) semantics, net force as the sum of all and only complete-IFS members, a generator with successor structure R(N) = {W_N} + R(N+1), and a separate closer supplying a terminal R(K) = empty. Load-bearing consequences: the account-to-resultant map is MANY-TO-ONE (8), so repeated positive generation never establishes completeness (9) and generation and closure have different logical forms (10) - existential vs universal; a matching current sum does not establish closure (14) and residual testing is ASYMMETRIC (15), a nonzero residual refutes while a zero residual proves nothing; search failure is not proof of absence (17); vector cancellation does not erase membership (6) and zero net force does not determine an empty IFS (7); duplicate-freedom and completeness are independent (12); there is no intrinsic final force in a completed set (11). Consequence 23 is the flagged CONDITIONAL one: requiring every valid trace to reach a finite K with R(K) empty commits the architecture to FINITE force accounts, and permitting infinite accounts would need separately specified infinite summation, convergence, and enumeration-order independence - not yet chosen. COVERAGE GAP worth knowing: its provenance section lists six local source notes, an