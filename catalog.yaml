    note: "In-repo spec/management layer for the VD codebase: specs, design notes, requirements. Links VDfirst, which is responsible for the code; context copies of code may live here but VDfirst owns/maintains it. FIRST DECISION HISTORY HOMED 2026-09-02: Code/function_call_model/, a record carried over from VDfirst (branch codex/parameterized-headwords, checkpoint 6da2e21). Filename kept in VDfirst dated form so it resolves back to source; the spec it cites (specs/2026-09-01-vd-parameterized-headwords.md) is NOT held here. 2026-09-02: Code/scratchpad_proposal/ added on his ruling for the LLM scratchpad proposal from inbox - not VD material as such, tooling around trace production."
