    note: "O3: WHAT SUPPORTS THE FLAT WEIGHTING AND THE STACKED LENGTH, record written by Claude 2026-09-30 (late afternoon) after his Go ahead on O3, filed into noise_vs_signal/ under his standing rule. KIND STAMPED record. Offers a CLOSURE of O3 without the strong form of axis splitting. T6 (the flat-in-vector weighting, now ours29's whole per-reading factor e^(H/2)): L8's CONDITIONAL form (components independent given the reading's shared state - his ruling of 29 Sept) plus L9 (isotropy) force a Gaussian candidate weight by Herschel-Maxwell; L10 as restated 30 Sept (no signal size declared, fixed or lawful) sets the scale to infinity, i.e. flat; the improper members e^(+c|v|^2) that the 25 Sept record flagged are removed by L7/L13 (the coefficient 1/2 is the strong-signal Gaussian propagation); 1D via T25. So the lemma record's 'the conditional form forces nothing' is wrong: it forces the family, L10 picks the member. ADDITIVE STATE (the series' law depends on the readings only through the sum of their Gram matrices, T12's exactness) is then a THEOREM, not the morning's candidate premise, and the record proves the converse: the exponential is the ONLY kernel with that property (two 1D configurations with the same Gram sum; scaling makes f affine; checked - ours21's kernel differs by up to 0.52 nats). T9 (the stacked length): L12 (one joining rule) applied to components as atoms (L18) forces the Euclidean join, since a vector's length already joins its components that way; the plain sum would need a second joining rule; this does not reinstate strong L8 (the law may differ by declaration, the size may not). Sec 5 what the closure rests on (L8 conditional ruled, L9 strong, L10 ruled, L7 mild, T25, L12 MEDIUM - the weakest link: if L12 is doubted, T9 falls back to chosen and ours24's plain sum returns as a rival) and what it does not do (O12, O14 untouched; L8's conditional form itself is inherited, not forced). Sec 6 corrections to the lemma record OFFERED not placed (L8, T6, T9, T11, T12 rows; O3 to close on his ruling). Credits the 25 Sept record sec 5 for finding the route and its four limits, and says what is new (its premises, not the route). Math in $ form, normalize_math check no-op, KaTeX 87 segments clean. Binds nothing. SEC 4b ADDED the same afternoon after his question on per-axis covariance: O8 DISSOLVES under L10 and T7 - a flat weight is flat under any linear change of coordinates, so flat-in-noise-units and flat-in-physical differ only by the whitening Jacobian det G(m)^(-1/2), which depends on m and is a per-reading prior T7 forbids; checked by direct quadrature under a 2D covariance with SDs spanning a factor 20 and cross-channel correlation (log E_noise - H/2 constant to 1e-8; the difference equals -1/2 log det G(m) to six decimals from m = 0.1 to 100). O8 offered as closed alongside O3. KaTeX now 114 segments clean. RULED 2026-09-30 (16:01): 'Yes I like it. I agree.' O3 and O8 closed and the sec 6 corrections placed in the lemma record the same afternoon. PULLED UP 2026-10-22 from noise_vs_signal/ to the flat discussion: its subject is the argument he accepted as the closure of O3 on 30 Sept, so it stayed when the working folder around it left for Mass-estimator-testor. Citations of the old subfolder path are stale, recorded here, not rewritten."
