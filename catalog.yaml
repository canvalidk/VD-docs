    note: "HAZE AND THE LOGIC OF NEWTONIAN FORCE ACCOUNTS (350 lines, VD-Newton-side, 2026-09-10, user-requested argument draft from the 09-09..10 NML3 discussion) - THE ORIGIN ARGUMENT of the haze discussion, received 2026-09-23 from VD-Newton's pass to VD-docs/ staging folder (branch codex/nml2-entry-renumbering @c2a0872; the file is unchanged since 9f9e3f8, 2026-09-13), sha256-verified against the clone. Haze = his provisional name for Z_eps, an explicit place in a force account for the unresolved contribution. Keeps F_net = m a and proposes F_net = Z_eps + R_eps, R_eps the impressed forces of the interactions selected for explicit accounting at resolution eps (an explanatory elaboration, not an adopted entry signature); 'Remainder' renamed 'contributions' the same day (a non-random identifiable superposition of impressed forces). WHERE IT CAME FROM: the NML3 trace's remainder expansion (previous remainder = identified impressed force + next remainder) had no licence to stop, R = 0 + R holds for any R, and tolerance appeared at that boundary. The MAJOR LOGICAL FAILURE (sec 3): changing the tested proposition after seeing the result. The central turn (sec 7): what remaining information can haze NOT explain. Why 'only gravity acts' is revealing; why uncertainties of the included parts do not finish the job; the unresolved mathematics of haze's zero (sec 10). THESIS: haze would make the sufficiency condition of a finite Newtonian force account explicit, giving its unresolved contribution a place and limits; 'has always been there' defended as a logical reconstruction, not history (GUM 3.3.2/3.4.2 cited). Open list (sec 13): haze's type, the tolerance's observable, evidence constraints, the mean-like role of impressed forces, membership at a tolerance vs the interaction-set, the domain of finite sufficiency. Cites two 2026-09-09 sources (tolerance/special-zero discovery; remainder intermediate-expression algorithm) that are NOT in the pass and not on VD-Newton's remote - the discussion's origin documents are missing. Filed 2026-09-23 as a flat record in _dscn_haze on his ruling ('lets go with discussion haze'). Kind unstamped. NOT a Criticism History record: it leaves haze's entry placement explicitly open, so accepting it would change no entry list (the SORTING 2a test). The entry-placement proposal, when someone writes it, is the criticism and goes to criticism_history with criticises: force_sum. Name kept as received (VD-Newton and the other haze records cite it). Normalization NO-OP, KaTeX gate passed, nothing banked."
