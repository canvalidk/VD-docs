  outbox:
    note: "OUTBOUND COUNTERPART OF inbox, created 2026-09-08 on his instruction ('lets make a pass back to file system. Put the pass receipts somewhere nice. Although they could be addressed to any branch. So likely, we will need to write a readme above it') - name and per-addressee shape are Claude's, rename freely. The one place VD-docs writes documents ADDRESSED TO a branch that lives in its own repository: receipts answering a branch's pass, returned checklists, custody handovers, rarely an outbound bundle. One subfolder per addressee, so a branch AI finds what is for it in one place and nothing that is not. The documents here are RECORDS of this repo under the custody rule (history the moment issued) and stay permanently; this replaces the pre-09-08 practice of leaving the return in the dated inbox bundle folder and retiring its row when he deleted the folder (the 08-26 returned checklist survives only as a paragraph in the inbox folder note). The inbox folder note remains THE LEDGER of traffic in both directions; this folder holds the documents. README.md at its top is the reader-facing explanation and is catalogued (not a root meta file)."
