    note: "WHAT FORCES THE CHAIN TO THE ESTIMATOR (152 lines), Claude-authored 2026-09-02 in answer to his ask - check all the arguments are forcing-like, double check the type theory - and sorted in the same day on his ruling; companion to what_forces_the_ratio_of_means_readout, which audited the estimators form where this audits the logic that makes an estimator necessary. Source basis: every record in this discussion and all three argued drafts of why_mass_estimation, read in full. METHOD: the spine S1-S12 from Newton IIs three corners to mass-must-be-estimated, each step tagged theorem, framework premise or ruling. VERDICT: FORCING. Three premises (S1 addressed relation with m greater than 0, a house commitment never stated once plainly; S4 a measurement result is value, covariance, provenance, never a bare vector - this, not measure-zero, makes the branch exact-vs-empirical; S6 E8/E9 run as predictions), the audit axiom S9, the composition commitments S10, and one ruling S12 (estimator outside VD authority, 08-01, ratified); everything between is theorem. Derivation order: load forced (S3, S7, S9), location in E10 by ruling, length by consequence - the kind-not-length lesson restated as an order. WHERE THE CORPUS STATES THE WRONG MECHANISM: the type-theoretic asymmetry is a COUNTING asymmetry (scalar corner overdetermined by d-1) plus a POSITIVITY asymmetry, which unifies the exact consistency conditions, the residual dof and the gate dof as one d-1; d1 sec 4s three independent routes are one route seen twice plus a dimensional route that does not hold (a = F/m is also unlike/unlike); the subsidy is a unary refinement pushed to the producer for E8/E9 versus a binary one dischargeable only in E10, and on the empirical branch the certificate IS the estimators output; reconciliation horn two is inoperability only for PREDICTIVE traces and must say so or it collapses into the epistemic objection; why_the_estimator_is_the_definition Results 1-2 use the positive root, which is the profile MAXIMUM on half of all null trials (record table reproduced exactly with the wrong object; Result 3 survives only with the current estimator as B and rests on rho_Pi flat); its sec 8.3 exact-is-a-fast-path claim is WRONG and contradicts Result 4 and the disagreement rule at exact 0/0, so E10 needs a real two-branch structure keyed on input kind - RULING NEEDED. GENERALISATION the corpus should own (sec 8): the chain transfers verbatim to every scalar-parameter corner of every law-triplet (Hookes k, G, resistivity); d1 sec 1s Hookean-entries remark is the same unpaid load, not precedent for a short entry. SEVEN CORRECTIONS OWED (sec 9), none a corrects - all scoping, offered not placed. The one sentence to add: the d-1 conditions that make exact recovery a check are the d-1 residual dof that make empirical recovery an estimation, and the d-1 dof of the gate. Renamed at intake from the dated filename (companion cites the undated name). Normalization a NO-OP, nothing banked. PROMOTED 2026-10-22 to _note_mass_estimator_lemmas as d1, on his ruling that a document which expects changes is a draft of a note (his words: if we expect changes to arrive, those are drafts and this is a note). d1 because the 2 Sept chain audit is the earliest statement of what the estimator rests on, and a re-audit would replace it rather than sit beside it. Filename unchanged; promotion is catalog-only."
