    note: "STEEL-MAN READING of NML3_WARRANTED_FORCE_ACCOUNT_FOUNDATIONAL_EXPLICATION_2026-08-05.md. AUTHORED LOCALLY IN VD-DOCS 2026-08-08 — this is NOT a VD-Newton transfer and has no counterpart at source, unlike the other two files in nml3/. Proposes no entry wording. Written at user instruction after an initial critical reading was redirected: the user established that epistemic-vs-ontic is NOT a live axis for the project, the operative motto being 'if an epistemic idea is computationally irreducible, that is what we call ontic'. That principle is recorded in section 0 and does real work — it means the explication's section 2 (many-to-one sum map, no shortcut from resultant to members) IS the proof that licenses its section 5 (the IFS is determinate), so the two are one argument in two movements rather than an empirical claim plus a metaphysical leap. Section 3 records three objections that are answerable from the explication's own text, so they need not be re-litigated: (3.1) the constitutive identity ranges over CLOSED accounts, closure being a status the procedure confers, so an incomplete account is an unfinished run and not a counterexample — no second symbol needed; (3.2) the closer is not circular because section 6 bans ADJUSTING members until the sum agrees, not COMPARING an independently generated account against the measured value — a residual check the account can fail is evidence, so the closer is constrained to be falsifiable rather than unwritable; (3.3) section 2's scope is what algebra ALONE delivers, and stage 3 of section 10 restores functional form as evidence-in-part. Section 4 defends the triplet as substantive: IFS alone is word magic, member-kind alone has no resultant role, and two DIFFERENT failure modes means the co-admission does work. Section 5 flags open item 6 (can one interaction yield several force-instances?) as higher-leverage than its list position — if one interaction gives one instance, force-instance identity is carried by the relatum and duplicate-prevention becomes near-free, which changes the generator wall; settling it late means rewriting that wall. Also notes the closer inherits its candidate-inventory restriction from the later action-reaction and force-law blocks (open item 10), a correct deferral worth stating explicitly. Section 6 observes that the explication's own 'physical attachment' constraint argues for the predecessor term `attached-force` over `contributing-force`, which names the banned sum-role direction — observation only, the terminology decision is live at source and was deliberately not ingested. Section 7 is a necessity table mapping each load-bearing move to what breaks without it, and every row corresponds to a case the explication's section 12 already tests. NOT an excavated note — no dN model applied. Normalization no-op: authored directly in $/$$ form, all gates pass, nothing banked. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/conceptual/ (path field updated; filename untouched, no dN implied by the move). This note is ENTRY-CUT-INDEPENDENT and is NOT retired by the reset - its content does not depend on which entries exist or which wall each carries, so a re-cut of the NML3 entry structure leaves it standing as live authority and as input to the new cut. Boundary record: Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md. The layer subfolder is NOT a note folder - note_name stays null."
