    note: "NML3 PRIMITIVE EXERCISE BANK - FORCE-ACCOUNT MEMBERSHIP, CLOSURE, AND SUMMATION. Self-described status: working exercise-bank note; audience introductory university mechanics, many exercises adaptable downward. Sec 0 states the teaching boundary the whole bank is built around: NML3 does not yet teach the concrete physical conditions under which springs, gravity, contacts, strings, or fluids produce force contributions - it prepares the machinery that will CONSUME those conditions once later entries supply them. Works over IFS(M|C), the interacting-forces-set for a target material object M in an accounting context C, with contributing-force records A, B, C carrying vector values vec(A), vec(B), .... 27 primitive exercises in five parts. Part I (1-11) consumes a supplied closed IFS: forward sum, recovering one known member, membership filter before arithmetic, net force alone failing to recover the IFS, membership-known versus value-known, duplicate-key rejection, distinct equal-valued members staying distinct, discovery order not ordering the set, cancellation not deleting membership, the closed empty IFS, and same resultant from different accounts. Part II (12-18) covers residuals, inverse calculations, and correct halts: an open-account residual is not a force, a matching partial sum cannot close an account, several unknown-valued members, recovering only a component, components not being additional members, closed-account mismatch meaning AUDIT DO NOT INVENT, and closed vs open form of the same algebra. Part III (19-24) prepares for future existence/admission rules: routing supplied existence-condition results, exhaustive-domain closure audit, closed-empty-by-exclusion versus no-successful-discovery, one acting object contributing once to each of several target accounts, target-and-context filter, and a new member after purported closure. Part IV (25-27) is control symbols, cardinality, and trace hygiene: the zero accumulator and closer signal are NONMEMBERS, count forces from keys rather than written terms or distinct values, and sorting the four non-collapsible item types. Part V gives suggested worksheet sequences (a minimal first sequence and paired contrast sheets), evaluator codes, criteria of instillment, and sec 7's explicit list of what these exercises deliberately do NOT teach. Also carries a standard sheet anatomy (sec 2) and an answer vocabulary to install (sec 3). Sorted from inbox 2026-08-11. NOT an excavated note - no dN model applied, filed flat beside the other NML3 documents. Normalization no-op: no math delimiters to convert, nothing banked. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/entry-cut-dependent/ (path field updated; filename untouched, no dN implied by the move). RETIRED AS AUTHORITY, KEPT AS REASONING RECORD - this note was written against the NML3 entry cut that is now being withdrawn (E13-E17 with E16 as the force-member/admission wall and E17 as the IFS/closure wall), so it must not be read as a current target. Retirement follows the E10 packet precedent: superseded as the working account, deliberately kept, and NOT EDITED IN PLACE - no banner was added to the file, the boundary lives in the folder, this catalog note, and the reset record at Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md. Never-archive rule honoured: nothing deleted. OPEN AT SOURCE: whether the new cut reuses E13-E17 or advances to fresh numbers is a VD-Newton decision; until it is settled, bare E13-E17 references in this file name the RETIRED cut. The layer subfolder is NOT a note folder - note_name stays null."
