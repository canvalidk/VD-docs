  Newton/structure_justifications:
    note: "STRUCTURE JUSTIFICATIONS, created 2026-09-11 on user instruction as the second of the two entry-structure spaces (the first is the Criticism History, Newton-analysis/criticism_history/, still _dscn_entry_structure/ on disk). NAME HIS (structure justifications), over two Claude candidates (entry_structure, structure_decisions). A sibling of nml/, deliberately: he placed it in VD-docs/Newton because this repo is the one that understands the structure of informing copies and can manage them, and because it is fundamentally an organisation task. SHAPE: one subfolder per law-house or seam of the CURRENT entry structure, ruled per house with decisions inside; each house holds Newton decision records plus -informing copies of the Criticism History records that justify its current cut, optionally compiled into a house justification redrafted at every ruling. A RECORDED EXCEPTION: a workbench holding copies and records together, neither note nor discussion. Guide: STRUCTURE_JUSTIFICATIONS.md here (provisional). STATE AT CREATION: seven house folders, all EMPTY (.gitkeep only); no copies stocked, no justification written, no decision record ingested. The first restock is owed and needs the current entry list from VD-Newton first so at_commit on the mirror is real. The house folder names are the vocabulary of the criticises field on Criticism History rows; renaming a house is a catalog edit too."
