    note: "THE MASS ESTIMATOR EQUATION: WHAT IT IS, AND WHY EACH PART IS THERE - d2 and CURRENT draft of _note_mass_estimator_equation, written by Claude 2026-09-26 at the user's request after the 25-26 Sept conversations ('Q1 yes. Q2 just point to there. Ok go ahead'), from a chain he corrected step by step on 25 Sept (he: 'we are cleaning up our progress'). A NEW DRAFT BESIDE d1, NOT A REWRITE: d1 told the story to the 21 Sept equation; d2 features OURS25B (ours24's law + the stacked-length readout) and justifies it as a chain of tagged moves (assumed / proved / ruled / open), his method 'put your hand on the left wall and walk'. STRUCTURE: relation to d1 (claims not carried: d1 secs 5, 6, 7 incl. its 'weighting is not forced' verdict, sec 9 row, sec 10 open items; per the changes record sec 7); sec 0 pointer to _note_why_mass_estimation (why an equation at all - kept short by his instruction); sec 1 TYPES in one place (N readings, d in 1..3, sigma_F, sigma_a > 0 as part of the type, declared Gaussian noise, no built-in scale; output a point and a law, never undefined; exact inputs a separate check); sec 2 the equation (three sums P, Q, D, M; law in m and in theta; boxed readout with mu_M(H)); sec 3 premises P1-P8 (Newton II; input type; law assumed not tested, ruled 7 Sept; force/acceleration swap; lumping; axis splitting, strong form for step 11; no preferred direction or push size; one joining rule) and STEPS 1-11: 1 exact vs measured (a mass at measured zero-zero rests on P2, not on the disagreement rule); 2 zero readings give s for ANY estimator of the type (dimensions + swap, NEW, first written out here); 3 candidates; 4 average not best (best fit not total even with sigma > 0); 5 ratio of means from any two of lumping, common force and swap (third follows; C3 and the domain flagged as real premises); 6 push part x mass part; 7 flat push weighting from axis splitting (ours21 -> ours24); 8 starting belief - centre s, symmetric, dimension-free, counted once proved, SHAPE OPEN (his ruling 25 Sept: leave it open); 9 combination rule - nothing per reading may depend on mass (rejects eq. 18, eq. 20, (f alpha)^k, lambda in the equation); 10 a lambda tilt is exactly one reading never taken (P = Q, D = 2 lambda; lambda* = 0.35 at weakest one aligned reading at SNR 0.84), NEW, first written out here; 11 stacked-length readout (ours24 -> ours25b); order 9 before 10 is his narrative reordering. sec 4 what follows (one reading = ours24; zero readings and equal energies give exactly s; swap and units; grouping-free, depends only on P, Q, D, M; four-number state C, T, M; TLS peak; convergence while pushes grow; conditional intervals, variance factor 1 + M/R*^2; padding caveat); sec 5 POINTS to the credit record rather than repeating it (his ruling); sec 6 open. CHECKS: an independent reviewer read the draft against the records and recomputed every formula and number (17 findings: Gaussian premise missing, step 1 attribution, sources wording, C3/domain, strong form of P6, sqrt of the variance factor, lambda reading non-unique, and minor ones - all applied before filing); Claude's own independent implementation of ours25b reproduced zero readings -> s, equal energies -> s, swap, the 21 Sept example 4.9937539062, the 25 Sept reading 3.8855 as vector and axes, and a Monte Carlo draw. Written directly into the note folder, as d1 was (not via inbox). normalize_math check: no delimiters to convert (no-op, nothing banked); KaTeX parse of all 196 math spans passes. DIRECTION: still not ruled by the user (null)."
