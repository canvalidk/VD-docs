re a valid mass value enters the prediction chain) is NOT retracted - the coming split is what preserves it. MOVED 2026-08-25 into Newton-analysis/_dscn_mass_estimator/, its intended home since the discussion was created empty on 2026-08-21. It reached it by the long route: filed into the holding discussion _dscn_trackability_and_mass earlier today, then split out when the user promoted the entry-writing argument to a note. STAYS A RECORD, DOES NOT FOLLOW THE NOTE: it is not a draft of it. The two companions say so in their own opening lines ('Not a draft of this note... this is a companion'), and the vector-division article and the type-theoretic analysis say different things rather than the same thing better. This is the promotion-out rule working as ruled 2026-08-25 - drafts leave, feeders stay, and -informing copies of the feeders go to the note. RECORDED SHORTFALL, unchanged by this move: the draft/current fields below are pre-2026-08-20 residue that the kind model retires for records, and note_name still reads vector_division_mass_estimation, an object name that now labels four separate records grouped in a discussion rather than one thing. Both are on the standing open-items list; neither is a sorting act to fix. KIND RULED record, 2026-09-05, by GRANDFATHERING (housekeeping sweep under the user's standing mandate): the dN was ASSIGNED AT INTAKE (orig_name carries no dN) and no one ever argued this was a note, so the ratified rule reverts it to record; draft and current cleared. The filename keeps its dN as an identity. Reversible in the catalog if the user recognises a direction later. REVIEWED 2026-10-22 in the mass-estimator sweep: stays as a founding record. FILENAME KEPT: the dN suffix is legacy and makes no draft claim. ORGANIZATION.md keeps legacy dN filenames and treats renaming as the one breaking act, so Claude kept the name although dropping the suffix had been agreed in conversation."
