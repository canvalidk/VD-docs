    note: "O12: THE MIDDLE OF THE MISFIT WEIGHT, record written by Claude 2026-09-30 (late afternoon) after his 'Ok do that too', filed into noise_vs_signal/ under his standing rule. KIND STAMPED record. Offers a CLOSURE of O12: T30 fixed kappa = nu BY MEANING (nu/Q = the share of a reading's self-contradiction the declared noise accounts for); a quantity cannot mean that only asymptotically, so read at every Q and capped at 1 it forces g = min(1, nu/Q), the kink; other middles (smooth, quantile threshold, shifted kink) keep the meaning only in the tail and the parametric ones add an unsupplied parameter (F2 rivals). Same rule as eta one level down (expected over observed disagreement, capped at 1) and the PDG scale-factor convention (applied when chi2/dof > 1). COST measured: efficiency E[g]^2/E[g^2] = 0.915 (2D) / 0.929 (3D), 32% / 37% of ordinary readings weighted below 1; in the tester ours29's raw law is 5-9% wider than ours27 at strong signal in 2D/3D, covers 94-96%, points as accurate - slightly conservative, never overconfident. RETRACTS Claude's reading earlier the same day ('the threshold is set too low'), which measured against ours27 rather than coverage. Notes the cost could be recovered by an uncapped eta (per-reading Bartlett ratio ~1.09 in 3D; arithmetic, not tested), which is O14's business. Sec 4 closure OFFERED not placed (T30 middle forced by meaning; O12 closed; the declared-shapes table left with only pi). KaTeX 71 segments clean. Binds nothing. RULED 2026-09-30 (16:26): 'O12 is good also.' Closed and placed in the lemma record. PULLED UP 2026-10-22 from noise_vs_signal/ to the flat discussion: its subject is the argument he accepted as the closure of O12 on 30 Sept, so it stayed when the working folder around it left for Mass-estimator-testor. Citations of the old subfolder path are stale, recorded here, not rewritten."
