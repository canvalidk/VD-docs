    note: "PRIMITIVE MAGNETIC CURRENT, OHMIC CURRENT AND CHARGE TRANSPORT - working analysis note dated 2026-08-19, authored outside this repo, no dN declared by the file (the _d1 suffix was ADDED, lossless, orig_name recorded; the lowercase filename was kept). METHOD (sec 2): preserve commitment history - refuse to identify quantities merely because mature EM gives them one name and one symbol J. Four genealogies get four symbols: rho_E the electric-field source density, K_B the magnetic-field source, K_O the Ohmic response, K_T literal charge transport. Sec 1 first establishes that 'the Galilean limit of electromagnetism' is not unique - Heras extracts at least three (electric, magnetic, and an instantaneous c to infinity limit) - so an unqualified appeal to Galilean EM hides a branch choice, the complex-logarithm analogy the note uses throughout. Sec 1.4 defines the STRICT NEWTONIAN-STATIC SHEET being tested: at an instant a primitive source determines its field from the instantaneous source configuration, and a uniform boost of the whole configuration does not alter the source variable - modelled on Newtonian gravity, and explicitly NOT derived from relativistic EM (sec 12 guards this: Heras's limit-taking already places rho and J in one inherited source structure, so those transformation laws cannot be used to prove the identification they assume). Secs 3-5 introduce the three currents separately; sec 4.1 shows the Ohmic bridge K_B = K_O does NOT immediately contradict statics but does force rho_E = 0 in the homogeneous bulk. Sec 6 derives K_T' = K_T - rho V from transport plus Galilean velocity addition alone. Sec 7 states the sheet's commitment K_B' = K_B. SEC 8 IS THE NO-GO: demanding K_B = K_T in every Galilean frame yields rho V = 0 for arbitrary V, hence rho = 0 - so a boost-invariant primitive magnetic source cannot be identified Galilean-covariantly with literal charge transport for a source carrying net charge density, and at least one of three commitments must go (primitive instantaneous magnetic source / current as literal transport / Galilean relativity). Sec 9 gives the single charged particle as the cleanest witness; sec 10 explains why the neutral wire hid the conflict (rho_total = 0 kills the boost term); sec 11 finds Ohm's law SURVIVES if its current is the primitive magnetic-source/Ohmic-response quantity rather than moving charge - the dangerous bridge is K_B = K_T specifically; sec 13 draws the two-sheet branch-cut picture; sec 15 separates shown from not-shown; sec 16 poses the open problem (what first licenses the identification, and which genealogy a current meter actually measures). PLACEMENT, USER DECISION 2026-08-20: own note folder in Newton-analysis rather than Theory, and kept a SEPARATE note from Newton-analysis/static_electric_acting_object/ though it arose from the same 2026-08-19 discussion - it declares no draft relation to that file, per the 2026-08-14 note-identity ruling. BEARS DIRECTLY ON: static_electric_acting_object sec 9, whose typing of current as a carrier-attached construct (path, orientation, profile) rather than charge with coordinate velocity this note shows to be FORCED rather than stylistic - any boost-invariant vector source must be built from relational data only. Also on Newton-analysis/participant_symmetric_forces/ Part VI, which scopes its Biot-Savart claim to complete closed steady-current systems. No informs-links recorded - no receiving note exists. OPEN CRITIQUE from the 2026-08-20 reading session, recorded not folded in: (1) The four results are ONE result - the strict sheet is consistent only as a theory of charge-neutral matter, which sec 4.1, sec 8, sec 10 and sec 11 each reach from a different direction. Stating it once would give the sheet a declared domain instead of a recurring neutrality constraint. (2) The two transformation rules are not new: K_B' = K_B is the Le Bellac-Levy-Leblond MAGNETIC limit's current rule and K_T' = K_T - rho V is the ELECTRIC limit's, so sec 8 is in substance the known incompatibility of the two limits that the note's own reference 2 (de Montigny and Rousseaux) warns about. That is GOOD NEWS stated correctly - the commitment-history method rederives a known structural result without taking limits of relativistic electrodynamics, which validates the method and is more defensible than a fresh no-go; sec 14 should claim that instead. Sharper form: each standard limit pays with a residual 1/c^2 term (magnetic buys J' = J at the cost of rho' = rho - V.J/c^2; electric keeps rho' = rho at the cost of J' = J - rho V), the strict sheet has no c and so can pay neither, meaning it demands the INTERSECTION of the two limits - which is the neutral sector. The 1/c^2 terms are precisely the price of avoiding this no-go. Verify the two rule-sets directly against Le Bellac-Levy-Leblond rather than through Heras, since they are now load-bearing. (3) Sec 9 stops one step early: K_B is boost-invariant and a charge at rest is boost-related to a charge in motion, so the sheet predicts an isolated charge is NEVER a magnetic source in any state of motion - a falsifiable claim tested by Rowland in 1876 (rotating charged disc deflects a magnetometer). So the sheet has an empirical boundary sitting exactly at the neutrality line, and convection current is outside its domain; declared honestly it still covers magnetostatics of neutral matter. (4) Consequence for the 2026-08-20 source-witness criterion proposed on the static_electric entry: 'current has independent witnesses' must be run PER GENEALOGY, since electrode chemistry and charge conservation witness K_T, Joule heating witnesses K_O, and the force-on-a-wire witness is K_B measuring itself - a weaker verdict than the criterion first suggested. Math-normalized on intake 2026-08-20: 159 edits [display-delim-block, inline-delim], no soft flags, all four hard gates passed; original banked at _math_originals/2026-08-20/inbox/. FILED 2026-08-25 into Newton-analysis/