    note: "PARTICIPANT-SYMMETRIC CANONICAL ORIENTATION - MESHING NOTE, d2, 2026-08-15, CLAUDE-AUTHORED, SUPERSEDES d1 THE SAME DAY after the user identified d1's central overclaim. d1 claimed the convention note's open q4 was DISCHARGED STRUCTURALLY for the participant-symmetric branch, leaving only presentation. THE CORRECTION (user argument, recorded in Part VIII): the opposite declaration - quote F = +kx, understand the quoted force as the reaction-side member, negate for the action - is fully admissible, and that admissibility is itself the proof of a surviving human input; d1 had conflated VALUE-invariance with INPUT-absence. Since the two declarations produce different TRACES (different quoted formula, different placement of the negation step) and the VD's ontology is trace-behavioural, the quoting orientation is a genuine runtime input and KEEPS ITS WALL in BOTH acting-object branches. The result is now split in two (sec 0): DISCHARGED BY OWNERSHIP - which representations exist (both, closure theorem), what anchors each (its owner), the pairing of members within each instance, and the weight (1/2, design-time constant); no pair-ledger and no arbitrary existence choice. NOT DISCHARGED - the per-instance quoting declaration. SIGMA(F) REHABILITATED (sec 6) in a scope-preserving way: the convention note's rejection of a FIXED sigma(f) stands, but once the convention is a declared runtime input, sigma(f) = +1 (quoted member) / -1 (negated member) is the declaration's per-occurrence SHADOW IN THE TRACE and must appear there - which ANSWERS the convention note's open q8 (convention provenance display: tag each member with sigma, cite the declaration; opposite-declaration traces become mechanically comparable). THE SIGNS (sec 8), retained from d1 but relabelled as the content of a DECLARED STANDARD CONVENTION (action-quoted, r-hat owner -> non-owner), not a structural necessity: A_gravity = -(G m_o m_n / 2r^2) r-hat, sigma +1, quoted, on the non-owner; R_gravity = +(G m_o m_n / 2r^2) r-hat, sigma -1, negated, on the owner. Declaration recommended on three grounds (template fit, textbook continuity, cross-branch uniformity with the spring's F = -kx); the flip is admissible and merely nonstandard - the admissibility IS the wall. Coulomb same with sign in the coupling product. VERIFICATION (Part IV): four-occurrence table now carries a sigma column - each target receives one +1 and one -1 member of EQUAL vector value, so sigma is invisible in the sums and indispensable in the trace; d1's convention-free local form survives as a VALUE-level statement (every gravity member on target p = (Gmm/2r^2) r-hat_{p->other}, exactly two); 'evaluation-invisible' is RETIRED for 'value-invisible, trace-visible'; the underdetermination test now passes WITH FULL FORCE (evaluator must refuse to orient until a declaration is supplied) rather than being trivialized. NEW RULE OF THUMB (sec 16): ARBITRARINESS DIAGNOSES THE WALL - two admissible assignments with differing traces = human input = wall (the declaration); theorem-fixed datum = no input = no wall (the 1/2 weight, which is a classification datum needing local decidability, half-weighting q3, but no wall). Sec 18 sorts algorithm (b)'s two choice-like elements: the side-choice-plus-ledger was a NON-FACT posing as an input (eliminated by firing both sides halved); the quoting choice is a REAL input (necessarily retained and declared); the VD's contribution is telling them apart. Secs 13, 19 unchanged in substance from d1: NML3 test E generic in every gravitational pair, pressure on open item 6 toward instance-carried identity; no collision with the banned half-F_net decomposition (membership first, values second; the declaration touches only the value/trace layer, membership never depends on which member is quoted). PART VII reading guide updated: dependency chain now shows q4 SPLIT (discharged existence/anchoring/pairing/weight vs surviving declaration) and q8 answered; three-sentence summary now says the symmetric branch's distinction is not ESCAPE from the convention wall but VALUE-LEVEL INVARIANCE under it. PART VIII itemizes the retractions (d1 secs 4, 10, 12, 13, 14 and q1 - withdrawn, retired, corrected, corrected, dissolved respectively). PART IX ADDENDUM, added later the same day on user decision: MEMBER-NAMED FORCE LAWS. The user's presentation, recorded verbatim in sec 24: every time you learnt about a force it was underspecified - you should have been told action-force_spring = -kx, action-force_gravity = ..., reaction-force_pressure = ... The fully specified form names the MEMBER in the headword, so the name says which member the formula evaluates and who receives it; for gravity, action-force_gravity = -(Gmm/2r^2) r-hat and reaction-force_gravity = +(Gmm/2r^2) r-hat, instantiated twice per pair. This RESOLVES IN DIRECTION former open qq 1 and 3 (sec 25): the declaration is supplied BY THE ENTRY AUTHORITY, per force kind, baked into member-designating headwords (a supply point the convention note sec 5 anticipated), and sigma display is BY CITATION - the member name IS the tag, no sigma column. Convergence noted: the acting-object inventory's two slots (action-force / reaction-force) get their justification read forward - each slot has its own quoted formula, and the taught formulas were one slot's content masquerading as the pair. Generalization stated: the pair relation does not assign targets, A = -R does not orient, F = -kx does not name its recipient - standard force notation SYSTEMATICALLY UNDERSPECIFIES THE MEMBER. Teaching order stays free, now harmlessly. Scope: the addendum records the SHAPE (member-designating names), not the words - whether action/reaction survive the vocabulary reservoir's probe remains entry-design territory at source. OPEN (sec 26, renumbered): local decidability of branch membership for the 1/2 vs 1 weight (q2 annotated 2026-08-15 with partial progress - the branches have an EMPIRICAL signature via the residual taxonomy of Newton-analysis/typed_closure_deduction/, single-member vs paired-sum residual forms, measurable from outside an open system; the entry-side mark remains open); bearing of value-invisibility on convention q6; interaction with the open problem's identity-representation candidates; n-participant generalization; qq 1 and 3 struck through as resolved in direction. d1 RETAINED in the folder per the dN convention (current: false); read d2 only, or d1 for the record of the overclaim. Normalization check 2026-08-15: no-op, authored in $/$$ form, nothing banked; addendum same day, also $/$$ clean."
