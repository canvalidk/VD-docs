    note: "HOW WE REACHED THE MASS ESTIMATOR EQUATION - d1 and CURRENT draft of _note_mass_estimator_equation, written by Claude 2026-09-23 (night) at the user's request: 'the literature resting story we laid out done with a bit more checks and slightly better citations with a more accurate account of what we are taking from the papers... The goal is still to reexplain the story in one place on how we arrive at our equation.' (He rejected an academic-calibre literature story first.) CONTENT: the story in order - m=F/a is not an operation; first answer, nearest compatible pair (TLS/Deming; Golub-Van Loan, Bartel et al.) and why it failed (root choice, measured zeros); second answer, integrate (median record; Lindley-El-Sayyad, Gull) and the disagreement rule; third answer, average-then-divide forced by composition (2 and 6 Sept records; Arratia et al. size-bias identity, Katz known-direction case) with its VD premises; the 21 Sept equation; in 1D it is Fieller's problem (Fieller 1954, Koschat 1987, Franz, von Luxburg-Franz) and the law is Liseo's eq. (12) restricted to positive mass; the weighting is not forced (lab contributions 2, 3, 6, 7; Sun-Berger, Berger-Liseo-Wolpert; Jeffreys = tube); the coverage limit (lab contribution 3 = special case of Gleser-Hwang Theorem 1; Koschat Prop. 1; method table incl. penalized Fieller, Wang et al.); a status table; what is left out. EXCLUDES the 09-23 parameter findings by his instruction. CHECKS: every paper claim read against the PDF that night by five checking agents; an independent reviewer then checked the draft against papers, records and its own maths (22 findings, all applied before filing). Dufour cited from abstract only; York et al. and Boggs-Rogers cited via vector_division d1, not re-read. KaTeX render check passed (121 math spans); normalize_math check: nothing to convert. DIRECTION: not yet ruled by the user - left null deliberately; he was offered a candidate and declined its academic framing; ask him. 2026-09-26: no longer current - d2 (the_mass_estimator_equation_d2.md) is, written at his request as the next draft; d1 is kept untouched as the story to 21 Sept, and d2 lists which d1 claims it does not carry (secs 5, 6, 7 and the sec 10 open item)."
