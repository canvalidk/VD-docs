    note: "Supplement to the α note: admission events into the catalogue are irreducible 3-cycles (triplets). PARTIALLY SUPERSEDED by d2 (2026-08-01): d2 supersedes secs 5-6 specifically — this note derived a META-LEVEL history triplet (residual-before, admitted-item, residual-after) and itself admitted the mapping onto (anchor, winter, winter) was not tight. d2 keeps the central insight (the unit of admission is not an isolated new word) and gives the three law-headwords their own semantic derivation instead. The before/item/after description remains live as a record of catalogue change — do not treat d1 as dead."
  - path: "Theory/triplet_as_admission_event/why_the_triplet_rule_is_needed_d2.md"
    type: md
    role: primary
    tags: []
    project: null
    status: draft
    dup_group: null
    math_normalized: 2026-08-01
    math_flags: null
    note_name: triplet_as_admission_event
    draft: d2
    current: true
    variant: null
    orig_name: null
    informs: "triplet_as_admission_event (d2, Theory home) -> Core (vd_six_entry_structure, inward triplet justification) and Newton (E10 entry writing) — LINK ONLY, no copies materialized"
    note: "WHY THE TRIPLET RULE? (~660 lines) — a semantic justification for the one-November/two-winter law form, authored 2026-08-01 against VD-docs commit 8e09dbf. Thesis: a theory cannot enlarge its ontology by inventing a word; the minimum honest record of an admission has three roles — (A) a previously available candidate/phenomenon/state, (B) a newly admitted result/kind/quantity, (C) a newly articulated differentiator/solution/coefficient — with content T(A,B,C), often orientable as B = R(A,C). (A) is the November word; (B) and (C) are the co-born winter words. Explicitly demotes the dependency-graph triangle: the triangle is what APPEARS when the admission relation is written without hiding a participant, not the rule's justification. Traces three converging routes to the result (alpha: admission is an event; E10: hidden commitments make the measurement channels mutually dependent and let the law confirm itself; iron: iron = R(suspected iron, melting-point-of-iron) makes the internal anatomy visible), then runs the three two-out-of-three ablations (sec 3) to show each role is load-bearing. Sec 5 separates the constitutive commitment from the revisable measured value; sec 6 allows a differentiator to be a DOSSIER rather than one property; sec 9 lists the six failure modes the rule prevents (word magic, hidden primitives, circular identification, theory-measurement collapse, self-confirming measurement, idle ontology). Sec 10 is the honest split: the LOCAL principle is justified; the STRONGER VD hypothesis (every irreducible law-bearing enlargement normalizes to exactly one prior + two co-admitted headwords) is left as a falsifiable research programme with a six-question counterexample test, and the global unique-November constraint is explicitly NOT derived. Sorted from inbox 2026-08-01; dN honoured as the file states it, and its own supersession declaration drove the d1 update above. Does NOT supersede alpha_and_the_one_draft_d1 (alpha governs the warrant, this governs the content of the admission) or Core/vd_six_entry_structure (chimney and walls still needed). Normalization was a no-op: already in $/$$ form at source, so nothing banked to _math_originals/."
