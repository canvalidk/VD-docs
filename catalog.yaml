    note: "NML3 OPEN PROBLEM - IMPRESSED-FORCE IDENTITY AND ACTION/REACTION EXCLUSIVITY. Self-described status: open conceptual and representation problem, dated 2026-08-12. Sec 0 states the blocker: NML3 has converged on net force as the sum of the vector values of the impressed-force members of a target's interacting-forces-set, but a structural problem must be solved before the force-sum and action/reaction blocks can be called stable. Sec 23 gives the compact statement - NML3 needs a representation in which ONE ACTING-OBJECT CONTRIBUTES AT MOST ONE target-side force member to ONE fixed force account, that member being EXCLUSIVELY action or reaction, while the same acting-object may still participate in other target accounts. Acting-object identity therefore looks necessary for local IFS member identity, but making impressed-force a simple acting-object ATTRIBUTE looks too strong (sec 6: it encodes the wrong ownership claim). The unresolved task is the correct relational identity structure and naming convention, WITHOUT turning an implementation choice into physics (sec 11: storage architecture is not yet physics). Structure: secs 1-2 restate the accepted force-sum commitments and the central action/reaction requirement; sec 3 argues acting-object identity is needed; sec 4 is 'the Alice problem'; secs 5-6 give the case for and against impressed-force_acting-object; sec 7 separates local from global identity; secs 8-10 lay out three candidate representations (A relationally keyed impressed-force, B IFS identity plus acting-object identity, C a relational instance as primary); secs 12-14 cover set identity, the exclusivity condition, and cross-target action/reaction pairing; sec 15 specifies the required behavior of a successful solution and sec 16 gives stress tests; secs 17-18 flag two subtle unresolved issues (whether context belongs to identity, and whether acting-object identity itself needs refinement); sec 19 is the naming question. Sec 20 states the target: the one-acting-object-to-at-most-one-member constraint should follow FROM THE OBJECT MODEL RATHER THAN FROM AN EVALUATOR PATCH. Sec 21 lists 15 open questions, including which commitments are physics versus implementation choices, and whether the key structure can be derived from the six-entry law architecture rather than stipulated. Sec 22's provisional decision rule: do NOT rename the formal member headword just because 'impressed-force' is residually attractive - first settle what one impressed-force instance IS, what information identifies it, and where action/reaction status lives; only then pick the headword form. That deliberately holds the naming decision open, matching the no-decision-implied stance of NML3_FORCE_SUM_VOCABULARY_RESERVOIR.md. Sorted from inbox 2026-08-12. NOT an excavated note - no dN model applied, filed flat beside the other NML3 documents. Math-normalized on intake: 54 edits (display-delim-block), all gates passed, no soft flags; original banked at _math_originals/2026-08-12/. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/conceptual/ (path field updated; filename untouched, no dN implied by the move). This note is ENTRY-CUT-INDEPENDENT and is NOT retired by the reset - its content does not depend on which entries exist or which wall each carries, so a re-cut of the NML3 entry structure leaves it standing as live authority and as input to the new cut. Boundary record: Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md. The layer subfolder is NOT a note folder - note_name stays null."
