    note: "THE MASS ESTIMATOR PROPERTIES AND LEMMAS, 29 SEPTEMBER, record written by Claude 2026-09-29 at the user request ('Produce me the superseding properties list'), reviewed by him ('I looked at it. It's good enough. You can just turn this into a superseding record.'), filed via inbox/ under his standing rule. SUPERSEDES mass_estimator_lemmas_2026-09-27.md - the first supersedes asserted in this discussion, made because the 27 Sept record named supersession as how its changed versions arrive. Framed by the project goal (the estimator function that can act as the definition of mass): the list IS the definition, the equation is what it produces. Sec 0 frame F1-F4 (estimator is the definition; uniqueness is the stake, open choices are alternative NMs; inherited premises named; commitment order suspended). Sec 1 the type (y_i, Sigma_i, N_i, reading structure; declared pi and size law G; output law + point + kept misfit). Sec 2 premises L1-L20 with statuses: L6 C3 and L10 no-push-scale STRUCK; L3' knowledge-free default and L4' push-noise symmetry PROPOSED; L8 axis splitting RESTATED (split carrying the reading's shared state; needs his yes; O3 asks whether it still forces push size and stacked length); L10' per-reading nuisance scale; L13 Gaussian model now forced; new L15 betweenness (provisional), L16 frame independence, L17 same law same mass, L18 declared inputs correct (N_i extension proposed), L19 no borrowing, L20 Z. Sec 3 theorems T1-T29 with status after 29 Sept: T8 the ours28 law; T10 readout FAILS Z (T29, new 29 Sept: null readings move the point, 2.2524 to 2.2406 with 50 in 3D, law unchanged; best-guess conditional-mean size passes Z, swap, exact limit, leaves all-zero experiment with no readout, in tension with L2 as d2 reads it); T21 C3 derived; T22 full covariance; T23 Gaussian forced; T24 Z for the law; T25 zero components carry nothing, only k does (new 29 Sept); T26-T28 from the 28 Sept records. Sec 4 declared shapes (pi, G, N_i ladder). Sec 5 open O1-O11 in the order the definition needs them, O1 the readout under Z first. Sec 6 three test tiers (properties, own world, other worlds). Carries the proposed corrections of the ours26 sweep, the perturbation matrix, the ours28, Jeffreys, betweenness, full-covariance, no-borrowing, reference and C3-narrow records without correcting those records. Math in $ form, normalize check no-op, KaTeX 125 segments clean. REVISED IN PLACE 2026-09-29 (night, 21:25) on his Go ahead: L8 rewritten as ONE READING IS ONE COMPLETENESS CLAIM (strong axis splitting false by ruling; conditional form forces nothing), L21 added (readings are evidence, just less - tempering by the off-line misfit, ruled 20:46), T30 added (the tempered law: g(0) = 1 by Z, kappa/Q tail, kappa = k_i - 1 by meaning), O3 reopened (flat weighting T6 and stacked length T9 need their own support; the 25 Sept axis-splitting premise withdrawn as forcing), O12 (kappa and middle shape) and O13 (contradiction between readings) added; T6/T9 status notes and sources updated. Source: noise_vs_signal/readings_are_evidence_just_less_2026-09-29.md secs 2, 10. A revision note sits under the Supersedes paragraph. REVISED IN PLACE 2026-09-30 (afternoon) on his 'Ok. Lets start with First', carrying the changes offered in noise_vs_signal/ours29_misfit_weight_and_bartlett_power_2026-09-30.md sec 11 after his three rulings of 11:57: T8 is now OURS29's law (flat factor per reading weighted by its own misfit, product raised to the Bartlett power eta); L10 RESTATED as 'no size law is declared' (the flat factor is a working likelihood, eta measures its overstatement); L10' STRUCK and L4' WITHDRAWN with the size law G (ruling 2: a declared population of setups is what L19's reason forbids); L19 gains its REASON (his words: it can't rely on a repeated experimental setup) and its SCOPE (the width may be computed from each reading's own residual); NEW T31 the Bartlett power (raw J forced by Z, whole projective line, evaluation at the best line, cap and finite-N form natural); T6 back to the flat weight in use, T11/T12 restated for ours29's state, T13 totality under ours29, T18 measured per series by 1/eta, T20/T28 size-law mentions retired, T26 as why eta is series-level, T27 no declared world left (the standard is ruling 3); sec 1 loses G and gains eta and the raw interval in the output; sec 4 replaces the G row with g's middle and 'one rule, two uses' becomes one use; O1 untouched by ours29, O3 now carries the equation (with the additive-state candidate), O6 shrinks to pi's shape, O12 gains the kink-threshold evidence, O13 partly answered, NEW O14 (eta at finite N, per-noise-pair eta) and O15 (the null floor). A second revision note sits under the first. Sources extended. KaTeX 223 segments clean. REVISED IN PLACE AGAIN 2026-09-30 (late afternoon) on his 'Yes I like it. I agree.', carrying noise_vs_signal/o3_what_supports_the_flat_weighting_and_the_stacked_length_2026-09-30.md sec 6: O3 CLOSED (T6 from L8 conditional + L9 by Herschel-Maxwell, L10 selects the flat endpoint, L7 removes improper members; T9 from L12 + L18; dependencies kept in view: L8's conditional form and L12 at medium); O8 CLOSED (under L10 the weight is flat and T7 fixes noise units for any covariance); L8 row's 'the conditional form forces nothing' corrected; T6, T9, T11, T12 given their new sources (additive state a corollary of T6 and characterising it). Third revision note. KaTeX 227 segments clean. REVISED IN PLACE 2026-09-30 (16:26) on his 'Yes persistence is a perfectly fine lemma. Doesn't need proving. And O12 is good also.': O10 CLOSED by ruling (persistence a premise of L1); O12 CLOSED carrying noise_vs_signal/o12_the_middle_of_the_misfit_weight_2026-09-30.md sec 4 (T30's middle forced by the meaning that fixed kappa, cost noted, remedy under O14); g's row leaves the declared-shapes table, which now holds PI ALONE. Fourth revision note. KaTeX 226 clean. PROMOTED 2026-10-22 to _note_mass_estimator_lemmas as d3, on his