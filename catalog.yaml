    note: "WHY INERTIAL MASS MUST BE ESTIMATED - d3 and the note's new CURRENT draft, authored by the user 2026-08-25 and dropped straight into inbox/ the same afternoon the note was created. THE NOTE EARNED ITS NEXT DRAFT WITHIN HOURS OF EXISTING, which is the strongest evidence so far that the promotion was read correctly: an object that takes drafts took one. SUCCESSOR TEST: a draft, not a supersession. Its thesis is the standing finding of d1 and d2 - that an empirical determination of inertial mass from net-force and inertial-acceleration must be estimated by a declared joint estimation policy, with reconciliation part of the determination rather than a preprocessing step - stated more sharply and with the scope limit made explicit up front (it does NOT deny that explicitly exact, compatible textbook inputs permit exact checked recovery). Same claim, better expression. ITS OWN SOURCE BASIS LIST CONFIRMS THE FILING INDEPENDENTLY: it names both existing drafts of this note AND all four records now in the mass_estimator discussion, plus NML2_1_CONTENT_d2. It also singles out why_the_estimator_is_the_definition as 'a stronger downstream proposal rather than as a premise of the core argument' - so the two -informing copies placed in this folder at promotion did the job the device exists for, and the workbench was stocked correctly. Sec 1 recasts Newton II as a six-entry law-house with local numbering, which is the hinge to inbox/VD_LAW_HOUSE_FOUNDATION.md, written the same day and still unsorted. RENAMED AT INTAKE, the one cheap rename moment: 'Why Inertial Mass Must Be Estimated.md' -> why_inertial_mass_must_be_estimated.md, orig_name recorded, to match the repo's snake_case and the sibling drafts. NO dN IN THE FILENAME, deliberately: the sibling file why_the_mass_entry_must_be_long_joint_measurement_d3.md carries a LEGACY _d3 from the vector_division_mass_estimation line while being catalog d2 here, so adding a _d3 suffix to this file would have put two different d3s in one folder. The dN is a catalog fact; this is exactly the case that rule anticipates. MATH NORMALIZED 2026-08-25 on intake: 115 edits, display-delim-block and inline-delim, original banked at _math_originals/2026-08-25/inbox/. All four hard gates passed - note that gate2 (KaTeX parse) needed katex installed under the session home on the user's device first; the tool fails closed without it and the earlier run was BLOCKED, nothing written. 2026-09-05: direction field ADDED, copied verbatim from the note's other three draft rows - the CURRENT draft was the one row of this note without it (housekeeping sweep). Its wording is still the provisional one Claude wrote at promotion; the user has not stated the line."
