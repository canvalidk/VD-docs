    note: "ACTING-OBJECT INVENTORY FOR VD NEWTON DESIGN 3 (2026-08-08). Self-described status: working inventory; a broad PRELIMINARY catalogue of concrete acting-object candidates for later entry design. Sec 1 is an explicit provenance caveat the note makes about itself: this is NOT a literature-derived census of force mechanisms - the list was generated from general mechanics, engineering, fluids, and electromagnetism knowledge rather than a source survey, so it should be treated as a structured BRAINSTORMING MAP to be researched, consolidated, split, or rejected before entry-writing. Its structure is constrained by the current Design 3 acting-object architecture, in which a concrete acting object exposes a concrete type, activation condition, action-force, reaction-force, participant slots, parameters, modelling assumptions, and force-accounting targets. Working criterion (sec 2): a concrete acting object should represent a force-PRODUCING or force-CONTRIBUTING physical mechanism, not merely a name for a force component. Sec 3 inventories ten families - gravity, elasticity, ideal connectors and constraints, ordinary solid contact, damping, fluid contact, interfaces and membranes, propulsion and imposed actuators, electrostatic and electromagnetic extensions, radiation and field-momentum extensions. The sharp section is 5, THINGS THAT SHOULD PROBABLY NOT BE ACTING OBJECTS: tension, normal force, friction force, centripetal force, weight, and push/pull are argued to be force ROLES, resultants, or descriptions rather than mechanisms - which is the same all-and-only discipline the NML3 notes apply to account membership, arriving here from the mechanism side. Secs 6-8 handle composite vs primitive acting objects, the granularity problem, and a suggested taxonomy; sec 9 draws the design implication; sec 10 lists ten research questions to settle before concrete entries are written, including which mechanisms standard literature treats as independent force laws, which are derived resultants, which distinctions are merely approximation-regime, whether one acting object may return several force components or independently parameterised components must always split, and how distributed, globally-determined constraint, history-dependent, and continuum/field cases are represented. Working conclusion: the target is not an exhaustive list of force NAMES but an exhaustive-enough inventory of recurring physical mechanisms, and the next major question is what makes one force-producing mechanism ONE acting object. Home per the file's own header (Project: VD Newton / Design 3) - it names the design layer the NML3 lesson and entry work defers its concrete warranting to, so it sits with the other Design 3 architecture notes rather than in nml3/. Sorted from inbox 2026-08-09. NOT an excavated note - no dN model applied. NORMALIZED on intake: 26 inline-delim edits, all four hard gates passed, original banked at _math_originals/2026-08-09/. No soft flags."
