    note: "THE NO-LOOKUP RULE, d1, 2026-08-17, CLAUDE-AUTHORED, SUPERSEDED THE SAME DAY BY d2. The rule is the user's, stated in rejection of a lookup-based proposal Claude had made in the same discussion: a reader executing a residual may use the local text of that residual and their own external competence, but may NOT consult the log; the log is reachable only by expansion, at a tracked position, from the mechanical layer. d1's structure: a three-way failure decomposition (locality, append-monotonicity, licensing) treated as CO-EQUAL criteria; lookup read as delta done wrongly (same information, no position, no record, no reversibility, uncheckable licensing); the two-way wall framing (mechanical layer never consults reader judgment; reader never consults the log); and the identification of the implemented headword scan and order-0-by-fiat guards as instances of the same rule. RETAINED FOR THE RECORD, NOT FOR USE - d2 itemizes in its Part V exactly what it withdraws, and the withdrawals are substantive rather than editorial: d1 stated the rule with the WRONG DISCRIMINANT (log-vs-trace rather than positional), so it mislocated both the failure mode and the boundary. Specifically superseded: the three co-equal failures (demoted to symptoms of a single disease, the second argument to raw_meaning); the permitted-use list of sec 7, which silently OMITTED trace memory and so neither permitted nor excluded it; the frame/lookup discrimination by append-monotonicity (withdrawn - trace memory passes that test); depth-1 positional access as a cheap starting mechanism (withdrawn - bounded memory is memory); and the treatment of target as a trace-level constant needing no delivery. Read d2 only, or d1 for the record of the misdiagnosis. Normalization check 2026-08-17: no-op, authored in $/$$ form, nothing banked. RECORDED DEFECT (shared with d2 and with the argument-layer note, NOT fixed on filing per user hold): the 'Bears on' list cites 'specs/2026-06-10-vd-reduction.md' and 'specs/2026-06-10-vd-residual-cleanup.md', which are not real paths - the files are Code/specs/vd_reduction_spec.md and Code/specs/vd_residual_cleanup_spec.md. The section numbers cited against them do resolve."
  - path: "Code/no_lookup_positional_locality/VD_NO_LOOKUP_RULE_RESIDUAL_LAYER_CLOSURE_d2.md"
    type: md
    role: primary
    tags: [no-lookup, positional-locality, residual-layer, raw-meaning, handle, pull-vs-push, argument-delivery, monomorphisation, impressed-force, parameter-sigil, licensing, probability-programme]
    project: no_lookup_positional_locality
    status: draft
    dup_group: null
    math_normalized: null
    math_flags: null
    note_name: no_lookup_positional_locality
    draft: d2
    current: true
    variant: null
    orig_name: null
    informs: "Code -> Theory (the handle argument of sec 2 - a residue is a handle for its own raw_meaning, therefore raw_meaning(R) is a function of R alone, therefore residues are countable, comparable and licensable - is a justification of a core VD commitment and is Theory material; Theory to develop it as a SEPARATE note if wanted, per the one-note-one-branch rule). Code -> Newton (sec 16 finding: any existing Newton trace that passes a member down the pipeline by reader memory is in violation, and sec 17.3 proposes the audit that would find them; also lands on the queued Newton rewrite via the argument-layer note's sec 19.1, every object-dependent headword gaining an arity). NO INFORMING COPIES MATERIALIZED - links recorded only, since neither receiver has a note in progress that consumes this yet."
    note: "THE NO-LOOKUP RULE, d2, 2026-08-17, CLAUDE-AUTHORED, CURRENT. Supersedes d1 the same day. BOTH the rule and its correction are the user's, each stated in rejection of a successive Claude proposal - first lookup, then bounded trace access. THE CORRECTED RULE IS POSITIONAL LOCALITY: a residue is a handle for its own raw_meaning, so raw_meaning(R) is a function of R alone; a reader executing R may use the local text of R and their own external competence, and their behaviour may NOT depend on text at any other position - not elsewhere in the log, and NOT ELSEWHERE IN THE SAME TRACE. The criterion is BEHAVIOURAL DEPENDENCE, not access: a reader with lookup enabled who reads nothing corrupts no residue. THE RESTRUCTURE (Part V lists it): d1's three co-equal failures become SYMPTOMS of one disease, the second argument to raw_meaning; they differ in visibility, not in kind. Sec 3 log scope is the flagrant symptom (the '+ interpreted as *' append silently revises every residual containing +, retroactively editing residuals already authored, executed and graded, with no diff - and its visibility is what misled d1). Sec 4 trace scope is the quiet one and is WORSE: a reader who admits an acting object at the IFS wall and six steps later uses their memory of it to select the impressed-force operation triggers no append, passes every test d1 proposed, and commits the same violation - and this is the STATUS QUO OF EVERY NEWTON TRACE that passes a member down the pipeline. Bounded memory is still memory. CONSEQUENCES OF THE SECOND ARGUMENT (sec 5): entries stop being gradeable in isolation, which adversarial review presupposes; residues stop being comparable, since a distribution becomes a property of a (residue, context) pair and two readers under different histories are not running the same experiment; levels stop being closable, since the dependence set is the whole dictionary or the whole trace prefix, neither checkable. PART II PLACEMENT: sec 7 states the wall as TWO-WAY - the mechanical layer must not import judgment or its audits stop being audits, and the residual layer must not import non-local text or its residues stop being handles - with contact at exactly three designed interfaces (walls, expansion, argument delivery). Sec 8 gives the corrected positive list: local text including latents, external competence, and arguments delivered to that position; NOT the log, NOT earlier trace positions, NOT the reader's memory of either. Sec 9 argues the rule is not new: the headword scan on reduced and cleaned text (reduction spec sec 5, cleanup spec sec 3) and order-0-by-fiat (reduction spec sec 2) are the same rule applied to the two surfaces where human text enters, each justified locally at the time. PART III THE BOUNDARY: impressed-force / V(f), the third corner of the candidate Force-Sum triplet, is the FIRST VD headword whose unfolding depends on an argument's VALUE - net-force(t) treats its parameter as decoration, inertial-acceleration_point-particle monomorphises into the name, and V(f) can do neither because instances are trace-generated and per the meshing note sec 13 instance identity is exactly what distinguishes two equal-valued gravity members on one target. Sec 11 supplies the discriminant, PULL VERSUS PUSH: consulting the log, recalling an earlier position, and reading one position up are all pull and all forbidden; monomorphisation is push at authoring time and cannot hold instances; ARGUMENT DELIVERY is push at trace time and is the only survivor. The key claim is that a delivered argument BECOMES PART OF THE HANDLE - nothing is remembered because nothing is absent - so arguments RESTORE locality rather than shrinking the breach. Sec 12: monomorphisation and argument delivery are ONE partition operation over the residue space (name it when the domain is finite and known at authoring time, deliver it when the domain is trace-generated), so the probability object is never P(residue of V) but P(residue of V at a). Sec 13 rejects re-supply at a second wall - the same datum entering twice with nothing checking agreement, an unauditable coreference error, and not a wall at all since passing an instance is bookkeeping rather than judgment. Sec 14 separates delivery semantics from storage (bind on the Demand node, let the render compose it; Definiens stays immutable, preserving the Phase-3 commitment; serialisation is the address-keyed (path, param, value) shape of reduction spec sec 8). Sec 15 states the condition without which lookup returns by the back door: THE PARAMETER SIGIL MUST BE A TOKENISER PRIMITIVE, NEVER A HEADWORD, and must stay distinct from the hyphen-as-reference convention, which points the opposite way. OPEN (sec 17): sigil form; the parameter list for impressed-force, taken as {instance, target} pending a hand-run gravity trace, with d1's trace-level-constant treatment of target explicitly withdrawn; which existing entries already require delivery; whether the argument list is itself level-licensed (an NML2 entry needing an NML3 argument would be a licensing violation expressed through arity, a failure mode with no detector); and whether external competence is bounded - positional locality closes the log and the trace and leaves the reader's head open. FILED TO CODE 2026-08-17 (user decision, after asking whether VDfirst was the better home): the note extends and generalizes the two simulator specs, imposes a tokeniser requirement, and specifies storage - spec-layer material, and Code/specs is where the VDfirst simulator's specs already live. VDfirst holds the code, not the derivation; the artifact that would travel there is the spec amendment this note implies, which DOES NOT EXIST YET. Normalization check 2026-08-17: no-op, authored in $/$$ form, nothing banked. Broken spec citation paths recorded on the d1 entry, not fixed (user hold)."
