    note: "WHY MASS CAN'T BE UNDEFINED, record written by Claude 2026-09-29 at the user request ('take this argument. Think about it thoroughly and make a record on it'), filed via inbox/ under his standing rule. KIND STAMPED record: he asked for a record. The argument is his, quoted verbatim in sec 7: if the estimator is the definition and returns undefined where a density route gives 5 +- 0.5 kg, the two disagree; contradiction is judged by a compatibility relation ==^, not ==, and making undefined pass it would force every equation to accept m = undefined for no purpose. It is the argument behind his 29 Sept ruling on O1 of mass_estimator_lemmas_2026-09-29 (the readout at the all-zero experiment stands). Claude's sharpening: sec 2.1 there is no per-moment mass (F1; L1 pools a null moment; T24), so undefined could live only at the all-zero experiment; sec 2.2 both answers to 'what did we just calculate' give a number (density = lumping L5 + homogeneity + persistence O10, or a bridge m = g(Q)); sec 2.3 under the definition's own combination (T12, the prior slot) a null series is the identity, so an undefined output is absorbing (contradicts 2.2), the identity renamed, or neither (arbitrary); sec 2.4 at the all-zero experiment the law is pi, already stated; sec 2.5 mass is not idle at 0/0 (a coasting body, a body on a table). Sec 3, the trap on the other side: comparing the starting law's intervals (95% in [0.039c, 25.45c]) would recreate the contradiction, so the relation to other routes must be combination or data-based exclusion. Sec 4, OFFERED not placed: Z at the point + units + swap force the all-zero point to be c, the centre of the declared starting law; the T29 best-guess repair cannot be patched to reach it, since as readings shrink to zero its limit depends on direction (1D, unit noise, c=1: force only pi/2, acceleration only 2/pi, every value from 0.546 to 1.830; same under ours27 and ours28). Computed with scipy in Claude's sandbox; scripts not kept, models stated in sec 8. Scopes mass_estimation_zero_zero_two_cases (answers Case I, reaches Case II's conclusion by another route), the lemma record, and on measured inputs the disagreement rule sec 5 and spec d1 'mass undefined from this trial'; T1 (exact branch) untouched. No informing copy placed - offered. Math: already in $ form, normalize_math check no-op, KaTeX parse of all 77 segments clean; nothing banked. Binds nothing. REVIEWED 2026-10-22 in the mass-estimator sweep: stays, its subject is his 29 Sept ruling."
