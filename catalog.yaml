    informs: "lumping_horizon_and_thermodynamic_boundary (lumping_consequences discussion, home; moved 2026-09-05 from particle_and_mass_origins) -> lumping (the note named lumping_conditions until 2026-09-05; copy placed 2026-09-03 under the name mass_address_lumping; folder renamed the same day); -> lumping_consequences (copy placed 2026-09-05; that note was dissolved into the _dscn_lumping_consequences discussion the same day and the copy is a staged fossil in _to_delete)"
    note: "Authored 2026-08-26. THE USERS RESULT: individually tracked fluid points execute random walks, which places an upper limit on lumping them, so thermodynamic motion cannot be lumped and the NM/thermodynamics separation falls out of the lumping criterion rather than being imposed on it. Made quantitative here: the difference of two random walks is a random walk, so redundancy expires at t_max ~ e^2/D, and via Stokes-Einstein D is proportional to T - the parameter that defeats lumping IS the temperature. Three-failure-mode taxonomy: shear (the tap, C1) and rotation (the wheel) each defeat A lumping and were both repaired by re-choosing; diffusion defeats LUMPING AS SUCH, since the dispersion is a property of the material and no partition escapes it. LOAD-BEARING REFINEMENT in sec 3: the claim is false stated as thermal and true stated as UNBOUNDED - a steel blocks vibration saturates at kT/(m w^2) so it lumps and is thermal at once, which is why the divide never looked like a partition of objects. The two regimes use the criterions two indices, one each: solids fail on TOLERANCE, fluids on INTERVAL. Sec 4 RELOCATES THE DIVIDE BY ONE STAGE - fluid points pass trackability (Lagrangian parcel-following is not a mistake) and fail at lumping, so the boundary falls exactly BETWEEN the two planned notes and neither owns this document. FILED FLAT under the depth rule; terminal, no direction, no dN. Stands ALONGSIDE identifiability_and_fluid_representation_discovery.md and speaks to its sec 4.2 WITHOUT correcting it: 4.2 says fluids are trackable, which is true and stays true - this record agrees and moves the failure downstream, so no corrects relation is asserted (the users ruling, 2026-08-26). Provenance split in sec 6: observation his; the bound, the taxonomy, the bounded/unbounded refinement, the index mapping and the Lindemann lead are Claude-developed and UNCHECKED. MOVED 2026-09-05 from _dscn_particle_and_mass_origins to _dscn_lumping_consequences, FLAT, on user instruction - the first two members of the new discussion. Path row only; filename, relations and content untouched; every citation by filename still resolves. Why this one: by its own secs 4-5 it leaves mass origins for thermodynamics, which is exactly the freedom the new discussion exists to give."
