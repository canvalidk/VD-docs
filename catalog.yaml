  Newton-analysis/_dscn_acting_object_primitives:
    note: "DISCUSSION FOLDER, created EMPTY 2026-08-21 on user instruction ('don't put anything in em first'). A DISCUSSION is a THIRD object kind, adopted in principle by the user this date alongside record and note: a folder that groups multiple RECORDS WHICH ADDRESS ONE ANOTHER. It asserts that the documents talk to each other, not merely that they share a topic - the distinction that keeps it from degrading into a topic folder, since everything is about several topics and topic membership becomes arbitrary and then contested. NOTES ARE NEVER NESTED IN ONE: they stay at branch level, because a note is directional and aimed outward at a reader who is not in the discussion, while a record is terminal and its meaning is partly given by the argument it arose in. NO -INFORMING COPIES INSIDE A DISCUSSION (user correction, 2026-08-21), which RETRACTS the promotion-out mechanism first recorded here the same day. See the Newton-analysis folder note above for the rule, exactly what it retracts, the proposed replacement and the measured cost. The .gitkeep is there only because git does not track empty directories (the retracted vd_analysis/ folder of 2026-08-20 is the precedent for how such a folder silently fails to reach the remote). SCOPE OF THIS ONE: whether the primitive acting-object set is complete, and what makes a kind primitive rather than interface-reduced. MEMBERS FILED 2026-08-25 - the FIRST members placed in any _dscn_ folder, four days after the three were created empty. The candidate set proposed 2026-08-21 was adopted UNCHANGED: hookean_response_type_chain_d1.md, primitive_current_commitment_history_no_go_d1.md, STATIC_ELECTRIC_ACTING_OBJECT_RESULT_2026-08-19_d1.md. All three sit FLAT: each was a lone record in its own folder with no correction, superseded version or rendition, so the folder bound nothing and the depth amendment applies - this is its first live use. The three now-empty source directories (hookean_response_type_chain/, primitive_current_no_go/, static_electric_acting_object/) REMAIN in the working tree because the mount refuses rmdir, and will not reach the remote since git does not track empty directories; deleting them is a working-tree tidy for the user, not a content change. No file was renamed; note_name and project keep the object names, which is what folders-are-cosmetic means, and every citation by filename still resolves. The .gitkeep is now redundant. AUDITS AT FILING: no -informing copy entered the discussion and none of the three carried one, so the development-principle assertion holds; the catalog<->disk bijection holds at 253 files; the _note_ / kind: note bijection is untouched by this pass. THE WEAK EVIDENCE GRADE STANDS AND IS NOW TESTABLE: none of the three cites another by path, and the discussion rests on a shared question plus a shared target - Newton/Design 3/vd_acting_object_architecture_consolidation.md, which both EM notes point at. Watch for drift toward topic-folder behaviour, the failure mode the citation test was meant to prevent. Evidence grade WEAK, AND THIS MATTERS AS A PRECEDENT: none of the three cites another by path. They share a question (Hooke says the classroom spring is not primitive but an interface-reduced response object hiding four slots; static_electric says a Galilean Newtonian EM statics holding only Coulomb, Ampere and Biot-Savart is not acting-object complete; primitive_current says do not identify quantities across Galilean branches merely because mature EM gives them one symbol), the two EM notes are the same 2026-08-19 session, and both EM notes point at Newton/Design 3/vd_acting_object_architecture_consolidation.md. BY ADOPTING THIS DISCUSSION THE USER SET THE EVIDENCE LINE: mutual citation is SUFFICIENT but NOT NECESSARY - a shared question plus a shared target can constitute a discussion. Watch this one for drift toward topic-folder behaviour, since that is the failure mode the citation test was meant to prevent. RECORDED CROSS-PULL: the entry-structure members repeatedly invoke Hookean's fourth slot, the direction/interface rule, which it named first from the elasticity side (see the under-citation shortfall recorded on the action_reaction_asymmetry entry). Hookean is placed here rather than there on its own declaration - its header gives its purpose as the chain from Hooke's coil to the classroom spring, which is anatomy of a kind rather than orientation - per the standing rule that identity follows the file's own declaration. FOURTH MEMBER 2026-11-02: what_starts_the_snowball_to_relativity_2026-11-02.md, flat (Claude, at his request; kind record): the Galilean/relativistic divide as a condition on state, his static-forces-are-paradox-free claim sharpened (the snowball starts with finite propagation), Weber as counterexample, input to the Ampere-vs-Grassmann ruling, and an explicit address to both 2026-08-19 EM records - the first member to cite the others by name, which strengthens the WEAK evidence grade recorded above."
  Newton-analysis/_dscn_mass_estimator:
    note: "DISCUSSION FOLDER, created EMPTY 2026-08-21 on user instruction ('don't put anything in em first'). A DISCUSSION is a THIRD object kind, adopted in principle by the user this date alongside record and note: a folder that groups multiple RECORDS WHICH ADDRESS ONE ANOTHER. It asserts that the documents talk to each other, not merely that they share a topic - the distinction that keeps it from degrading into a topic folder, since everything is about several topics and topic membership becomes arbitrary and then contested. NOTES ARE NEVER NESTED IN ONE: they stay at branch level, because a note is directional and aimed outward at a reader who is not in the discussion, while a record is terminal and its meaning is partly given by the argument it arose in. NO -INFORMING COPIES INSIDE A DISCUSSION (user correction, 2026-08-21), which RETRACTS the promotion-out mechanism first recorded here the same day. See the Newton-analysis folder note above for the rule, exactly what it retracts, the proposed replacement and the measured cost. The .gitkeep is there only because git does not track empty directories (the retracted vd_analysis/ folder of 2026-08-20 is the precedent for how such a folder silently fails to reach the remote). SCOPE OF THIS ONE: what estimator recovers inertial mass from measured, generically non-conforming force and acceleration vectors. NO MEMBERS YET. Candidate set proposed 2026-08-21 and deliberately NOT acted on: the six files currently inside Newton-analysis/vector_division_mass_estimation/. Evidence grade STRONG and internal - why_the_estimator_is_the_definition checks three informally-reasoned claims against the d1 sec 4 estimator equation, and why_reconciliation_cannot_be_upstream_of_E10 targets the deferral picture that d3 leaves standing. THE PAYOFF THAT MOTIVATES THIS DISCUSSION: that object is ALREADY a discussion mislabelled as a note. Its catalog entries are almost entirely partial-supersession apology - d3 supersedes sec 7 and the measured conclusion only while secs 1-6 stay live, d2 does not supersede d1 in content, current flipped with a note saying flip it back if the highest-dN reading proves misleading, and three files deliberately held outside the draft line. Read as six records addressing each other, every one of those recorded exceptions dissolves and nothing has to be defended as current. KEPT SEPARATE from the trackability material per the user ruling of 2026-07-27: mass_identification_pipeline asks where a valid mass VALUE comes from in the prediction chain, this asks what estimator recovers m from noisy measurement, and they are distinct questions. STATUS UPDATE 2026-08-25: STILL EMPTY, and its candidate set is now PARKED ELSEWHERE. The six vector_division_mass_estimation files were filed FLAT into Newton-analysis/_dscn_trackability_and_mass/ on the user's ruling that they enter that holding discussion first and be split out to here afterwards - 'then we can sort them into either mass estimation or trackability'. So this folder's intended members exist, are grouped, and are one move away; what is deferred is only the split. The 2026-07-27 ruling that keeps this question distinct from the trackability chain is what that split will preserve, and is not retracted by the temporary grouping. POPULATED 2026-08-25, later the same day, with FOUR records rather than the six proposed on 2026-08-21: the vector-division article, the type-theoretic analysis, and the two standalone companions. The other two were promoted to the note _note_why_mass_estimation instead, so the discussion and the note now sit side by side at branch level - the shape the user asked for ('mass estimation discussion, mass estimation note'), and exactly what the promotion-out ruling produces. THE PAYOFF PREDICTED ON 2026-08-21 IS REALISED: this material no longer has to be defended as one note with a chosen current draft. The partial-supersession apology in these four entries can be read as four records addressing each other, and the one real draft line in the set has been lifted out to where drafting belongs. Still carried, not fixed: draft/current residue and a note_name that names an object which is now a discussion. FIFTH MEMBER 2026-08-27: median_based_estimator_inertial_mass.md, filed flat. It is the first member that proposes a DIFFERENT estimator rather than analysing the obstruction - integrate the support over every plausible latent pair and report the median of the resulting mass distribution, instead of scoring the single best corrected pair. It addresses vector_division_inertial_mass_measurement_d1 directly (its sec 20 is a feature-by-feature comparison table) without superseding it, which is exactly the records-addressing-each-other picture this folder was made for. SIXTH MEMBER 2026-08-29: disagreement_rule_mass_estimator_trace.md, flat. It arrived three days after the fifth and speaks directly to it - granting the median estimators zero-zero result and then scoping it as optional downstream machinery, while ruling that F/0 must not end an empirical trace at m = undefined and exact 0/0 should. THE FOLDER IS NOW DOING ITS JOB VISIBLY: six records, two of them written days apart and addressing each other without either superseding or correcting the other, which is the picture that justified making this a discussion rather than a note in the first place. SEVENTH MEMBER 2026-08-30: inertial_mass_estimator_full_working_spec_d1.md, flat. It is the synthesis of the whole family - its Source basis names all four drafts of the note next door and four of the six records here - and it arrives one day after the sixth. THREE OF HIS DOCUMENTS IN FOUR DAYS, each citing the one before. The folder is now carrying an argument that is visibly moving, which is the case for a discussion rather than a topic folder. TWO RULINGS OWED ON IT, offered and not taken: whether it should become a NOTE created-to-write-into (it calls itself a working synthesis and separates what is settled from what remains policy), and whether Part VI and sec 7 put it in a corrects or supersedes relation with the median estimator and why_the_estimator_is_the_definition, or whether both are scoping in the sense the user ruled on 2026-08-26. Filed as scoping in the meantime; nothing bound. TWO RECORDS ADDED 2026-09-02, both Claude-authored reviews written the same day and sorted in on the users ruling, renamed at intake to drop their date prefixes (orig_name recorded) because each cites the other by the undated name. what_forces_the_ratio_of_means_readout: the spec sec 11 reciprocal-invariance requirement selects nothing - every candidate passes it - and what forces m_hat = fbar/alphabar is that the estimator must compose as Newtonian mass composes (mass adds under lumping at common acceleration; inverse mass adds under common force); plus the Level-3 measure asymmetry m^(2N-2) and the gate calibration Q_min ~ chi2_(d-1). what_forces_the_chain_to_the_estimator: every step from the three corners to mass-must-be-estimated classified as premise, theorem or ruling - verdict forcing - and the places where the corpus states a different mechanism from the operative one (counting asymmetry not type-level; one route not three; horn two needs the word predictive; why_the_estimator_is_the_definition Results 1-2 computed on the profile MAXIMUM; its sec 8.3 fast-path claim wrong). Both list corrections owed to records in this discussion and to the spec; NONE is bound as corrects - all are scoping under the 08-26 rule, offered not placed, awaiting his ruling. The discussion now holds NINE records, all flat. THREE RECORDS ADDED 2026-09-05, all received the same day from VD-Newton's new pass to VD-docs/ staging folder (their AGENTS.md policy of that date) and filed flat on his instruction with NO informing copies into the note next door: mass_estimation_zero_zero_two_cases (the measured-0/0 question argued as two committed cases, exposing suppress-vs-qualify as the decision owed), mass_estimator_originality_research_2026-09-05 (a Deep Research assessment: the components have antecedents - Katz, Liseo, Fieller, size biasing - and divergent ratio moments occur at EVERY finite input under the default measure, so the composition characterisation is what remains to establish) and mass_estimator_additional_derivations_2026-09-05 (the square-root loss whose minimiser is exactly fbar/alphabar, null scaling, conditional aggregation, a Hellinger diagnostic, log-scale uncertainty). TWELVE records, all flat. The corrections the research owes to the audit, the spec and the two-cases record are scoping under the 08-26 rule, unbound, as before. The two-cases record calls itself competing argument drafts and is filed as a record by default; a note ruling is his if he wants one. PASS OF 2026-09-08 (VD-Newton's pass to VD-docs/, 34 new files, all mass-estimator work of 09-06 to 09-08): NINE records added flat here - vd_shared_quantity_argument (the dependency argument written for the introduction; informing copy in the note next door), mass_readout_composition_uniqueness (C1-C5 force E[f]/E[alpha]; the two-order separation identity; the direction-tilted counterexample that makes magnitude-law dependence load-bearing), the three laboratory reports (behavior_test_report 09-06, uncertainty_and_reuse_walkthrough 09-07, practical_limits_and_uncertainty 09-07 - the code, suites and results stay on VD-Newton's live surface), the 09-07 STEERING RECORD of his ruling that Newton II is a premise for this investigation and the rejection gate is not (ingested as a record; their copy stays while it steers their lab; it scopes the spec d1 Part IV, unbound), and three real-data records (air_track trial, robot_cart trials, arrow data audit). Plus a SUBFOLDER literature_review/ holding 22 records of the priority thread - see its own folder entry. The discussion now holds TWENTY-ONE flat records plus the subfolder. Everything scopes, nothing is bound, as before; the one new correction of substance is the steering, which retires the gate for the conditional investigation without saying the spec was wrong. The 09-05 originality research is the seed of the literature thread and stays flat here because VD-Newton cites its path. 2026-09-15 RULING (his): the 09-06..09-08 Codex session made records on its own; records are his to decide; keep them, do NOT formalise them (no log kind, no statement-record), keep them OUT OF THE FLAT VIEW as a recorded exception. Executed: seven flat files moved into a new subfolder unsanctioned/ (three lab reports, three real-data trials, the shared_quantity exposition); literature_review/ already held the other 22 and has the same standing; TWO kept flat - the steering record (his ruling verbatim) and composition_uniqueness (a theorem the flat records call for; Claude's call, reversible). The 09-05 three predate the session, were filed on his instruction, and stay flat. FLAT NOW: FOURTEEN records + README.md. READMEs written at this level and in both subfolders so a fresh AI does not read the subfolders as members or 'fix' them; catalogued as meta rows (recorded exception to only-records-in-a-discussion). 2026-09-23: TWO ADDITIONS. (1) mass_estimator_equation/ - a record folder at flat level holding the 2026-09-21 specification of the current estimator with its PDF rendition, equation images and standalone implementation, received from VD-Newton (c2a0872); unbound to the spec d1 (his call). (2) SIM-38-2074.pdf (Morris, White and Crowther 2019, simulation-study methodology), which he placed flat here 2026-09-19 - catalogued in place as role: reference, not moved into literature_review/. FLAT NOW: FOURTEEN records + one record folder + one reference PDF + README.md. README amended the same day with a short section naming both. 2026-09-23 (evening): + mass_estimator_regimes_priors_and_updating_2026-09-23.md, flat, kind record (stamped on his explicit request), received from VD-Newton @ecd1a1c - working contribution 12 (readout regimes, lambda as a fitted prior factor on mass, switch rules, sequential update rules); scopes, binds nothing. FLAT NOW: FIFTEEN records + one record folder + one reference PDF + README.md; README amended with a short section. 2026-09-23 (night): papers/ subfolder created on his instruction for published reference papers (not members); SIM-38-2074.pdf moved into it from flat level; see the papers/ folder entry. 2026-09-24: one flat record added, old_information_in_the_prior_slot_2026-09-24 (Claude, at the user's request): the old x new factorisation of the exact combination, the tilt parameters read as carried state (m0, sigma_ln m), and a reproducible test in the separate tester repo canvalidk/Mass-estimator-testor, which is now where the reproducible mass-estimator studies live (as VDfirst is for the Code branch). README section added. Later 2026-09-24: second flat record vonmises_state_2026-09-24 (old readings as one doubled-angle vector; exact in 2D; reading list). Night of 2026-09-24: third flat record excitation_weighting_premise_2026-09-24 (his premise - f/alpha symmetry, any value possible - forces the flat-in-vector excitation weighting alpha^(d-2) df dalpha dOmega; no change in 2D; proposes a change to the 21 Sept equation in 1D and 3D; Maxwell-Boltzmann parallel, the accelerating-frame weak spot and a Herschel-Maxwell second route). 2026-09-25 (just after midnight): fourth flat record axis_splitting_and_the_24_september_change_2026-09-25 (the 24 Sept change isolated as one weight r^(d-2); axis splitting, judged by him too elementary to be wrong, forces both the flat-in-vector weighting and its completion; consistency of the symmetric rule and the exact 1 + d/r*^2 width factor; tested in the tester repo). 2026-09-27 (afternoon): mass_estimator_lemmas_2026-09-27.md filed FLAT (kind record on his instruction; an ordinary record - changes by correction or supersession); new working subfolder ours26/ created on his instruction, ours26_per_axis_noise_2026-09-26.md moved into it, README.md written there. Flat view: 25 records + README. 2026-09-27 (evening/night): README section added naming the sweep record (in ours26/) and ours27; then a new working subfolder ours27/ created on his instruction, the ours27 record moved into it, the perturbation-matrix record filed there; README sections added; flat view unchanged. 2026-09-28 (night): new working subfolder ours28b/ created on his instruction (the ours28b candidate: one scale per noise pair, shared over the series), its derivation record moved in from ours27/; README section added; flat view unchanged. 2026-09-29: mass_estimator_lemmas_2026-09-29.md filed FLAT, superseding mass_estimator_lemmas_2026-09-27.md (his instruction; the first supersedes asserted in this folder, as the 27 Sept record provided); README section added. Flat view: 26 records + README, one of them superseded. 2026-09-29 (later): why_mass_cannot_be_undefined_2026-09-29.md filed FLAT (Claude, at his request; kind record): his argument that mass is never undefined on measured inputs, sharpened, with the forced all-zero value c and the best-guess repair's direction-dependent limit offered for O2; binds nothing; README section added. Flat view: 27 records + README, one of them superseded. 2026-09-29 (evening): the_noise_measure_view_2026-09-29.md filed FLAT (Claude, at his request; kind record): his view that the equation lacks a signal-vs-noise notion and that every open item is that absence showing through; the sqrt N null-series tilt, property N and the data-only resolution; five parked items including a correction owed to the undefined record; binds nothing; README section added. Flat view: 28 records + README, one of them superseded. 2026-09-29 (evening, later): new working subfolder noise_vs_signal/ created on his instruction and the noise-measure view moved into it; README section amended. Flat view: 27 records + README, one of them superseded. 2026-09-29 (night): null_series_tilt_and_property_N_2026-09-29.md filed into noise_vs_signal/ (Claude, at his request; kind record); README section amended. Flat view unchanged. Later the same night: c_is_the_noise_measure_at_zero_signal_2026-09-29.md filed into noise_vs_signal/ (Claude, at his request; kind record); README amended. Flat view unchanged. Then alignment_what_one_reading_can_say_about_noise_2026-09-29.md, same folder, same night (Claude, at his request; kind record); README amended. Flat view unchanged. 2026-09-29 (night, later): lists A and B done - the pointer record written into noise_vs_signal/, four records moved into it from ours26/ and ours27/, and ours28b/ moved whole into it; noise_vs_signal/README.md written; discussion README amended. Flat view unchanged. 2026-09-30 (morning): scattered_observations_2026-09-30.md filed into noise_vs_signal/ (Claude, at his request; kind record) - a list of the morning observations, centred on the reframe that the law does not carry its own uncertainty and the noise measure lives beside it; eta the Bartlett power recorded as candidate; both READMEs amended. Flat view unchanged. 2026-09-30 (afternoon): ours29 filed into noise_vs_signal/ (Claude, after his three rulings of 11:57): the record ours29_misfit_weight_and_bartlett_power_2026-09-30.md (kind record) and three scripts (reference implementation, checks, worlds); both READMEs amended. Flat view unchanged. 2026-09-30 (afternoon, later): new subfolder ours29/ created at discussion level on his instruction, exclusive to the ours29 equation and mostly empty (README only); the ours29 record and scripts stay in noise_vs_signal/. Flat view unchanged. 2026-09-30 (afternoon, later): mass_estimator_lemmas_2026-09-29.md REVISED IN PLACE on his instruction, placing the ours29 changes (T8, L10, L10', L4', L19 scope, T31, O14, O15); second revision note under the first. Flat view unchanged. 2026-09-30 (late afternoon): o3_what_supports_the_flat_weighting_and_the_stacked_length_2026-09-30.md filed into noise_vs_signal/ (Claude, after his Go ahead; kind record): an offered closure of O3 from L8 conditional + L9 + L10 (Herschel-Maxwell) and L12 + L18; his ruling owed. Flat view unchanged. 2026-09-30 (late afternoon, later): o12_the_middle_of_the_misfit_weight_2026-09-30.md filed into noise_vs_signal/ (Claude, after his Ok do that too; kind record): an offered closure of O12 (the kink forced by the meaning that fixed kappa); his ruling owed. Flat view unchanged. SLIMMED 2026-10-22 on his ruling that VD-docs is a space for made decisions: a record stays only if a decision is its subject (founding argument, thesis, proof, ruling). 12 members remain; 117 files left for canvalidk/Mass-estimator-testor docs/ (all eight subfolders: ours26, ours27, ours29, noise_vs_signal with ours28b, unsanctioned, mass_estimator_equation, literature_review, papers; and 16 flat work-state records), their rows retired and their subfolder entries retired with them. Four records were pulled up out of noise_vs_signal because a ruling is their subject (readings_are_evidence_just_less, o3, o12, ours28b_no_borrowing). The lemma records and the 2 Sept chain audit became _note_mass_estimator_lemmas; the 30 Aug full working spec became _note_mass_estimator_equation d0. The emptied subfolders are parked in Newton-analysis/_to_delete/empty_folders/_dscn_mass_estimator/. Full list with hashes: outbox/Mass-estimator-testor/HANDOVER_2026-10-22.md. README rewritten."
