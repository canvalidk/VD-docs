    note: "HAZE AND WHAT A SUCCESSFUL NEWTONIAN APPROXIMATION CLAIMS (289 lines, VD-Newton-side, 2026-09-12, user-requested argument draft; filename says car predictions and core NM), received 2026-09-23 from VD-Newton's pass to VD-docs/ staging folder (branch codex/nml2-entry-renumbering @c2a0872; the file is unchanged since 9f9e3f8, 2026-09-13), sha256-verified against the clone. The question, his: serious people model a car without friction, find their expectations differ from experiment, and are not shaken in Newton - what logical understanding must they have? The coasting car (zero explicit longitudinal account, constant-velocity nominal prediction) separates three claims: exact zero force (refuted by deceleration), an ideal-system conditional (not refuted by a real car), adequacy for a declared purpose and accuracy (the one at issue). HAZE AS THE ALLOWANCE THAT ADEQUACY CLAIM PERMITS: the explicit zero is algebraically redundant and representational; haze need not have zero mean, may hold persistent directed friction, need not be random (bound, probability model or uncertainty about an unknown value are different commitments); adequacy as E_Q(H_C) le eps_Q. THE REVERSAL: from finite evidence, the haze REQUIRED to explain an observed departure vs the haze ALLOWED by the claim - a discrepancy beyond the allowance defeats the sufficiency claim without by itself identifying Newton's laws as the failed part; the variance-inversion trap and the earlier martingale check (consistently signed residuals reject every variance through their signs). Declares that the user-led 09-11..12 discussion governs where earlier local drafts left the definition open, and that the MFP1 brief predates these refinements. Cites the Force-Sum naming decision (08-26) and the Design 3 acting-object consolidation as background, neither adopted. Filed 2026-09-23 as a flat record in _dscn_haze on his ruling ('lets go with discussion haze'). Kind unstamped. NOT a Criticism History record: it leaves haze's entry placement explicitly open, so accepting it would change no entry list (the SORTING 2a test). The entry-placement proposal, when someone writes it, is the criticism and goes to criticism_history with criticises: force_sum. Name kept as received (VD-Newton and the other haze records cite it). Normalization NO-OP, KaTeX gate passed, nothing banked."
