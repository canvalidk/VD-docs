    note: "NOTE FOLDER, created 2026-09-07 by PROMOTION: nml1_lesson d1 (nm_l1_lesson_draft_d1, Newton I law-house only) and d2 (NM_L1_E7_integrated_complete_draft_d2, current, E7 integrated - the structural exemplar for all later lesson plans). The first of the folder-less recorded-exception notes to get its folder. No informing copies stocked yet; the nml1 decision notes it drew on sit in _dscn_nml1_content beside it. VD-Newton holds a context copy of d2 (term map recorded on its row). DIRECTION (ruled by the user 2026-09-07, the same line on every nml lesson note): A single document giving a teacher, at any level of education from school to university, everything needed to design and deliver this lesson of the Newtonian-mechanics curriculum from the VD entries it covers: what it teaches and in what order, the exercises and demonstrations, the misconceptions to expect, and how the lesson adapts across levels. For nml2 this direction is the one abandoned at the split; for nml2.2 and nml3 it is what the empty note is created to write into. TWO -INFORMING COPIES ADDED 2026-09-15 (E7_INERTIAL_ACCELERATION_PLACEMENT_NOTE, NM_L1_E7_E8_decision_note): their homes moved from _dscn_nml1_content to the Criticism History, and the lesson keeps the copies in its workbench because they are the deliberations the d2 draft was written against."
