  Newton/nml/nml3/_dscn_nml3_content:
    note: "DISCUSSION FOLDER, created 2026-09-07: the records that discuss what NML3 teaches - ten members, all flat. From the former conceptual/ layer (tagged entry-cut-independent): foundational understanding, warranted-force explication, its steel-man, logical consequences consolidated, the vocabulary reservoir, the impressed-force identity open problem. From the former entry-cut-dependent/ layer (tagged so): the entry-to-lesson bridge d1, the content specification d1, the younger-student mock lesson and its supplied-forces add-on (companions, not drafts of each other, per the 2026-08-09 ruling). The two layer subfolders of the 2026-08-17 reset are dissolved into this discussion; the LAYER survives as a tag on every row and as the criterion in the reset record, which stays at nml3 level. NO lesson note for nml3 yet: the lesson draft (nm_l3_lesson_draft.md) lives in VD-Newton and comes over through a pass. Several of these records were the parked candidates for Newton-analysis/_dscn_entry_structure (see that folder's note); a discussion is cosmetic filing, so that move remains one folder op if ruled, and a statement-record there can cite these by filename meanwhile. FIVE MEMBERS LEFT 2026-09-15 for the Criticism History under the 2026-09-11 ruling: the force-sum quartet (foundational understanding, warranted-force explication, its steel-man, logical consequences consolidated) and the impressed-force identity open problem - the entry-cut-independent layer that caused the 08-17 reset, i.e. criticisms of the Force-Sum house. -informing copies of all five went to _note_nml3_lesson. Now FIVE members, all flat: the vocabulary reservoir (a collection, cut-independent), and the four entry-cut-dependent records - the bridge d1, the content specification d1, the younger-student mock lesson and its add-on. The parked-candidates line in this note is discharged."
