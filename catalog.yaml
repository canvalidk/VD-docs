limiters to convert, nothing banked. TWO SIBLING NOTES ARRIVED 2026-08-14 and both engage this sketch directly, so read them together: Newton-analysis/canonical_force_orientation/ cites this sketch as a source and answers its missing datum DIFFERENTLY (a human-supplied orientation convention rather than which participant carries the constitutive mechanism), and Newton-analysis/participant_symmetric_forces/ names this sketch as its Related note and its Part VII proposes that gravity does not refute the constitutive asymmetry but shows the VD needs a second, participant-symmetric acting-object architecture beside it — which is a direct answer to Part VI, the universality crux this sketch left standing as genuinely unasked. FILED 2026-08-25 into Newton-analysis/_dscn_entry_structure/, FLAT: no correction, superseded version or rendition to bind, so the record's own folder bound nothing and went to _to_delete/empty_folders/. Path prefix only - filename, note_name and role untouched, and every citation by filename still resolves. Intra-branch move, so the bank -> normalize -> gates pipeline does not apply. RECORDED SHORTFALL, carried not fixed: the draft/current fields below are pre-2026-08-20 residue that the kind model retires for records. On the standing sweep list. KIND RULED record, 2026-09-05, by GRANDFATHERING (housekeeping sweep under the user's standing mandate): the dN was ASSIGNED AT INTAKE (orig_name carries no dN) and no one ever argued this was a note, so the ratified rule reverts it to record; draft and current cleared. The filename keeps its dN as an identity. Reversible in the catalog if the user recognises a direction later."
