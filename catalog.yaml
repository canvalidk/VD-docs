    note: "TYPED CLOSURE-FAILURE DEDUCTION AND THE RESIDUAL TAXONOMY - working discussion note, d1, 2026-08-15, CLAUDE-AUTHORED from the same day's discussion. Develops the mechanical-closure section of Theory/actually_there_prediction_sets/IT_IS_ACTUALLY_THERE.md using the member-named force laws of the meshing note's Part IX addendum. STATED PRESUMPTION: a more fully encoded Newtonian mechanics than the entries currently provide - Newton III in place, action-force_kind / reaction-force_kind as taught forms, Design 3 witness vocabulary available; reasoning is run against the intended shape. THE INSTRUMENT (Part I): when a system fails to close, define the residual on member p (observed net force minus internal IFS sum), map the residual FIELD over configurations, hypothesize a force kind by value-law fit, then CLASSIFY against the kind's member laws - the step that did not exist before member-named laws. Two inherited boundaries: closure is CONSTITUTED structurally (convention note sec 6) and only DIAGNOSED evidentially (abduction, not definition); and the instrument runs one way - zero residual licenses NOTHING because external pairs can cancel (convention note test 9.4). ASYMMETRIC BRANCH WORKED (Part II, spring, user's example): the member laws are discriminable per configuration, so residual matching action-force_spring deduces a SPRING OUTSIDE attached to p, while matching reaction-force_spring deduces p carries the spring and an UNNOTICED OBJECT OUTSIDE receives its action - two distinct typed deductions demanding different witness sheets, separately falsifiable; sigma is residual-MEASURABLE in this branch. SYMMETRIC BRANCH WORKED (Part III, gravity): the discrimination step FAILS NECESSARILY - per-target value degeneracy (meshing note secs 11-12) makes sigma residual-unmeasurable - and the pure-member hypotheses are not merely indistinguishable but INADMISSIBLE (either would violate same-kind reciprocity / the closure theorem), so the only permitted gravity residual from one external participant is the PAIRED SUM (1/2 + 1/2 = full Gmm/r^2 toward it). The two spring-style deductions MERGE into one: a massive participant outside occupying BOTH roles, plus a forced outward commitment with no spring analogue - p's own action-force_gravity is landing outside S right now, the cup-on-Earth commitment of IT_IS_ACTUALLY_THERE derived from the residual rather than recited from Newton III. THE TAXONOMY (Part IV): asymmetric kinds yield single-member residuals / two deductions; symmetric kinds yield ONLY paired-sum residuals / one merged deduction. THE DEGENERACY IS DIAGNOSTIC: a half-strength gravity residual would falsify participant symmetry (red-blue physics or new physics), giving the branch classification an EMPIRICAL SIGNATURE measurable from outside an open system - partial progress on the meshing note's open q2 (annotated there; the entry-side mark remains open, and q4 here asks whether it will provably predict the signature). Which questions are well-posed is known IN ADVANCE from the branch: mechanism-or-receiver-outside is well-posed for asymmetric kinds, ILL-POSED for symmetric ones - standard notation cannot even state the question. HISTORICAL INSTANTIATIONS (Part V): NEPTUNE the worked witness case (user: 'hence, Neptune!') - Uranus residual field fit gravity-kind, the merged deduction demanded a full participant whose RECEIVER half did real inferential work (the body had to move under solar gravity for the time-dependence to fit), complete witness sheet, Galle within a degree; VULCAN the worked halt case - same schema, same man, NO admissible witness sheet existed, honest verdict HALT AT THEORY BOUNDARY, residual paid by changing the ENTRY (GR) not the inventory, an unlicensed import correctly refused; DARK MATTER the live undecided case - the fill-the-witness vs modify-the-entry dispute stated as a disagreement over which forcing path the residual licenses. Part VI adds three upgrades to IT_IS_ACTUALLY_THERE (typed external witnesses; stronger entry-forcing for symmetric kinds - both roles plus the outward commitment; the HALT VERDICT as a first-class outcome) and an extended working rule ending: never smuggle the object in anyway, and a zero residual licenses nothing. OPEN (sec 17): admissible-residual-forms theorem per branch incl. mixed inventories; superposition identifiability (Neptune worked because the known inventory was subtracted first); noise/estimation for the member-classification test; whether the settled entry-side branch mark predicts the residual signature; n-participant forms; how a trace records the halt verdict so Vulcan-type cases stay distinguishable from still-open Neptune-type cases (the dark-matter state). PROVENANCE: schema, spring case and Neptune are the user's; degeneracy/merger analysis, inadmissibility argument, taxonomy, Vulcan and dark-matter framings arose in the exchange, first recorded here. Historical cases are structural instantiations, not history of science. PLACEMENT: own note folder in Newton-analysis (output-side mechanics reasoning), with the theory-side hand-off to IT_IS_ACTUALLY_THERE explicit in the header. No entry wording proposed, no headwords selected. Normalization check 2026-08-15: no-op, authored in $/$$ form, nothing banked. FILED 2026-08-25 into Newton-analysis/_dscn_entry_structure/, FLAT: no correction, superseded version or rendition to bind, so the record's own folder bound nothing and went to _to_delete/empty_folders/. Path prefix only - filename, note_name and role untouched, and every citation by filename still resolves. Intra-branch move, so the bank -> normalize -> gates pipeline does not apply. RECORDED SHORTFALL, carried not fixed: the draft/current fields below are pre-2026-08-20 residue that the kind model retires for records. On the standing sweep list. RESIDUE PARTLY CLEARED 2026-09-05 (housekeeping sweep): current set to null - current is a notes-only field marking a CHOSEN draft, and no promotion ever chose one here. draft is KEPT because this dN was AUTHORED (orig_name null or carries it), and neither grandfathering (assigned lone d1) nor the successor test (needs a chain) runs on a lone authored dN; erasing an author's own label is a ruling, not housekeeping. kind stays unset: files as record by default under the absence rule. THE USER'S RULING IS STILL OWED on this row - the one kind of residue the sweep did not close. KIND RULED record BY THE USER, 2026-09-05 ('make all 4 records'), closing the one residue the housekeeping sweep could not: an AUTHORED dN on a lone file, which neither grandfathering nor the successor test reaches. draft cleared; the authored dN stays in the filename as an identity. No direction, no drafts, no current - terminal."
