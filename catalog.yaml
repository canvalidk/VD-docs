    note: "STANDALONE COMPANION NOTE (17.2 KB), authored in-repo 2026-08-01 from a working session with Can, after the E10 blind entry-writing pass. Its own header and its sec 'Intended catalog disposition' fix the metadata implemented here: note_name vector_division_mass_estimation, NOT a draft (draft null, current null) - why_the_mass_entry_must_be_long_joint_measurement_d3 stays current for the family - filed on the same grounds as why_reconciliation_cannot_be_upstream_of_E10. What it does: the session produced three claims about null trials by informal reasoning; this note checks them against the actual estimator equation in vector_division_inertial_mass_measurement_d1 sec 4, finds agreement, and turns the agreement into an argument about which of two candidate definitions of inertial mass is the real one. Candidate A is the law rearranged, m = |F|/|a| after a codirectionality check; candidate B is d1's errors-in-variables estimator. Sec 1 shows these are not two notations: any rotation-invariant estimator from the two measured vectors has the form (|F~|/|a~|) g(cos theta) with the exact law fixing only g(1) = 1, so A is the choice g = 1 and B a different, uncertainty-determined choice - they agree on exactly aligned exact inputs and nowhere else, which makes the disagreement cases decisive. Sec 3, Result 2: a NULL TRIAL returns sigma_F/sigma_a, the ratio of the two noise floors, independent of the angle between the noise vectors - derived in closed form and confirmed over 200,000 draws per setting. Reported with a statistical warning that matters: the MEDIAN equals the ratio, the MEAN DOES NOT EXIST, because near-perpendicular noise vectors collapse the quadratic's leading coefficient and give a 1/M tail (measured at 9.7-9.9 per decade over six decades), so the sample mean never settles - report the median and the interval. Sec 5, Result 4: the singularity is MOVED, NOT REMOVED. Both candidates carry a 0/0; A's sits at (F, a) = (0, 0), the commonest physical state there is - every object at rest or in uniform motion - while B's sits at (sigma_F, sigma_a) = (0, 0), a perfectly precise null measurement, which is a probability-zero event for any real instrument and is not removable by a limit (the limit is path-dependent: approach along fixed ratio r and the answer is r). The argument for B is that a definition whose only singularity lies OUTSIDE its own theory's domain of validity is in good shape, whereas A breaks down on a book resting on a table. Sec 6 is the transferable result: a FREE BODY in an inertial frame is the null trial, so its mass estimate is a fact about the apparatus rather than the object, giving an operational test - improve one instrument and see whether the answer moves; for a real mass tightening either channel narrows onto the same value, for a free body the estimate tracks sigma_F/sigma_a and moves in OPPOSITE directions depending on which instrument improved. Two guards kept: the implication runs one way outside an inertial frame (a badly instrumented accelerating body also tracks the apparatus, but only until instruments improve), and this is a CONSEQUENCE, never a definition, since defining free-body by Newton II's silence would make Newton I reference a headword that does not yet exist in the log. It reads as the opposite of a Newton I / Newton II collapse: exactly where Newton I applies, Newton II is silent, so the two laws PARTITION rather than nest - independent support for the pedagogy note's refusal to teach Newton I as the zero-force case of Newton II, support that note does not currently have - and a free photon and a free cart are indistinguishable to Newton II, so the free case never has to adjudicate masslessness. The note grades its own claims in a Ratification status section: Results 1-4 CHECKED (derived and numerically confirmed, control run converging to m0 = 3.0000 with IQR shrinking as 1/precision); the definitional claim ARGUED NOT RATIFIED, since it depends on accepting detection-limit practice as a legitimate determination of mass, stated as a premise and not defended; and the quantum reading of sigma_F = sigma_a = 0 FLAGGED AS EXPECTATION - the structural point needs only that perfect precision be unattainable for some reason, and it asks for an actual bound on sigma_F sigma_a to be derived, which would mean there is a smallest mass this operation can fail to detect. CATALOGUED 2026-08-09: this file was authored and left on disk by the 2026-08-01 session and never catalogued - an UNRECORDED shortfall found by the catalog-to-disk bijection check during the 2026-08-09 inbox sort, and the only orphan outside the recorded nml2/ai-context-bundle exception. Nothing was moved or renamed. Normalization check run 2026-08-09: no math delimiters to convert, nothing banked. FILED 2026-08-25 into Newton-analysis/_dscn_trackability_and_mass/, FLAT, on the user's ruling that the six enter this holding discussion now and are split into _dscn_mass_estimator later - his words, 'then we can sort them into either mass estimation or trackability'. DISCUSSIONS DO NOT NEST, so the six came in flat rather than carrying vector_division_mass_estimation/ in with them; the partial-supersession relations among them stay recorded in these notes and unbound by any folder until the split. The 2026-07-27 ruling that this material is a DISTINCT QUESTION from the trackability chain (what estimator recovers m from noisy measurement, versus where a valid mass value enters the prediction chain) is NOT retracted - the coming split is what preserves it. MOVED 2026-08-25 into Newton-analysis/_dscn_mass_estimator/, its intended home since the discussion was created empty on 2026-08-21. It reached it by the long route: filed into the holding discussion _dscn_trackability_and_mass earlier today, then split out when the user promoted the entry-writing argument to a note. STAYS A RECORD, DOES NOT FOLLOW THE NOTE: it is not a draft of it. The two companions say so in their own opening lines ('Not a draft of this note... this is a companion'), and the vector-division article and the type-theoretic analysis say different things rather than the same thing better. This is the promotion-out rule working as ruled 2026-08-25 - drafts leave, feeders stay, and -informing copies of the feeders go to the note. RECORDED SHORTFALL, unchanged by this move: the draft/current fields below are pre-2026-08-20 residue that the kind model retires for records, and note_name still reads vector_division_mass_estimation, an object name that now labels four separate records grouped in a discussion rather than one thing. Both are on the standing open-items list; neither is a sorting act to fix. REVIEWED 2026-10-22 in the mass-estimator sweep: confirmed a record under his ruling that VD-docs holds made decisions only. A decision is its subject (thesis, settled correction, proof or ruling), so it stays in the slimmed discussion; kind stamped record."
