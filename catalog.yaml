    note: "Read-only informing copy, placed 2026-08-30 at his instruction, the same day the home record was sorted in. WHY IT IS HERE: sec 34 is written straight at this notes subject - not the estimator mathematics but what the Newton-II mass entry must make an interpreter DO. It states the fuller evaluator contract (weight the plausible underlying positive-codirectional force-acceleration pairs under the declared measurement policy; reject the Newton-II-constrained account if even the best pair is implausible; otherwise return the ratio of the mean compatible magnitudes with its reciprocal inverse-mass readout, uncertainty, residual, policy and provenance), keeps the shortest lesson-facing handoff beside it, and draws the line the entry need NOT cross - Gaussian integration, covariance matrices, quadrature, bootstrap intervals and goodness-of-fit calibration stay external mathematical and metrological competence. That is a direct contribution to the notes standing argument that the entry cannot be short: it says how long is long enough and where the entrys obligation stops. SECOND REASON: the sec 32 settled / sec 33 policy split tells the next draft which requirements it may assert as FORCED by the law and which are this estimators CHOICES - with the caveat Claude flagged on 2026-08-30, that items 7 and 8 of sec 32 are choices sitting in the settled list. PARTLY WRITTEN FROM THIS WORKBENCH: its Source basis names all four drafts of this note, so this is the second closed loop in four days, after disagreement_rule. SIDE EFFECT ON THE HELD-OPEN CANDIDATE: the workbench now carries vector_division_inertial_mass_measurement_d1s estimator material at one remove, since sec 7 reproduces its profile objective and relativizes it, so a direct copy of d1 adds less than it did at promotion. Recommend closing that question as answered rather than leaving it standing. NOT A KIND-DETECTOR FAULT: a note folder is the one place the development principle permits an -informing file.