    note: "NML3 FORCE-SUM FOUNDATIONAL UNDERSTANDING (2026-08-02). Self-described status: current conceptual starting note for NML3; identifies the problem the lesson and entries must solve, does NOT select the mechanism or the final force-member headword. States the goal as establishing how a material object's force account produces F_net = F_1 + F_2 + ... such that a trace can build the right-hand side as forces are found and identify its sum with the net-force-material-object already available from Newton II. Five hurdles logged: initiating a binary addition without treating the zero vector as a force; keeping contributing forces at both ends of the exposed identity; preventing duplicate admission of the same force (identity, not equal vector value — called the hardest); producing 0 as a SUCCESSFUL empty-account outcome rather than a failure to start; and proceeding without knowing the force count in advance. Load-bearing section is 'decomposition is not force membership': a net-force vector admits indefinitely many algebraically valid decompositions, so dependence must run one-way from established account members to the sum, never backwards. That point reopens the force-member name. Sorted from inbox 2026-08-05, from the 2026-08-05_vd_docs_pass transfer bundle (source VD-Newton@059ca86, compared against VD-docs@8e09dbf); the active copy stays in VD-Newton and remains authoritative for entry production. Home chosen by user instruction: new Newton/nml/nml3/ folder, mirroring the source repo's 08_nm_lesson_drafts/nml3/ and the existing nml1/nml2 pattern. NOT an excavated note — no dN model applied. Normalization was a no-op: no math delimiters to convert, nothing banked. Uses `contributing-force` as a provisional working term; the terminology decision that introduced it was NOT ingested (user instruction 2026-08-05 — deleted from the batch), so the term's ratification record lives only in VD-Newton. Likewise the NML3 entry-sequence decision it sits under was deleted from this batch by the same instruction. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/conceptual/ (path field updated; filename untouched, no dN implied by the move). This note is ENTRY-CUT-INDEPENDENT and is NOT retired by the reset - its content does not depend on which entries exist or which wall each carries, so a re-cut of the NML3 entry structure leaves it standing as live authority and as input to the new cut. Boundary record: Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md. The layer subfolder is NOT a note folder - note_name stays null. FILED 2026-09-07 into the default nml organisation the user is building up (his framing: the note and discussion structures were never meant to be comprehensive, so the nml folders stay exceptions; inside each, the lesson draft becomes a _note_, files that are exercises or exclusively about exercises go to a _dscn_..._exercises discussion, and the records discussing the lesson's content go to a _dscn_..._content discussion). Filed in the content discussion as a record that discusses what the lesson teaches. Path prefix only. The 2026-08-17 reset's LAYER is carried as the tag entry-cut-independent now that the layer subfolder is gone - the reset record at nml3/ level still states the criterion; path prefixes decay, tags do not. MOVED 2026-09-15 INTO THE CRITICISM HISTORY (Newton-analysis/criticism_history/) on the 2026-09-11 ruling that every criticism of the entry structure is homed there whatever branch wrote it (test: what would change if Newton accepted it - here entries, walls or corners). Parked as an entry_structure candidate on 2026-09-05, moved now that the mount allows it. An -informing copy was left in the lesson note workbench _note_nml3_lesson (a content discussion may not hold copies), with a home-left banner. kind: record stamped and draft/current residue cleared on entering Newton-analysis, as batch 1 did for every record there on 2026-09-05. criticises / at_commit / fate written today; the fate is Claude's reading where marked, reversible."
