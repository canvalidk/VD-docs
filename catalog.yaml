    note: "DISCOVERY RECORD, authored 2026-08-26. A gathering of parts, explicitly NOT a single coherent idea - the user asked for the pieces laid out so they paint a picture, with the reasons to doubt the picture kept in view. Subject: three senses of identity (haecceity, quantum exchange symmetry, operational trackability) that keep almost coinciding across three independently developed lines - the trackability material, fluid representation, and newton_vs_gibbs. Eleven pieces in section 2, the tentative synthesis quarantined in section 3, six ways it breaks in section 4 (including the Jaynes epistemic reading of the Gibbs N!, which is the objection most likely to dissolve the cluster), and five decidable tests in section 5. Provenance is split per section 6: the sorting, the fluid two-sidedness, the unspecified-limit observation and the phases/pressure/volume conjecture are the users; the tracer window (Stokes above, Knudsen below), the Eulerian/Lagrangian identification, the volume repair, the bosons/fermions material and the binary-vs-graded mismatch are Claude-developed and UNCHECKED. FILED FLAT in _dscn_trackability_and_mass/ under the depth rule: no corrections, supersessions or renditions to bind. Terminal, no direction, and NO dN in the filename - records do not take draft numbers under the ratified model; the legacy _dN names elsewhere in this folder predate it. Deliberately OUTSIDE scene_trackability jurisdiction: that note stops where tracks stop being available, and everything from piece 2.8 on is past that line. Cross-references newton_vs_gibbs (branch level) and vd_trackability_scene_to_particles_d4 sections 0 and 2 - neither is edited; d4 section 0 (the material of the world is trackable) is recorded here as a known overstatement. INFORMING COPY PLACED 2026-08-26 in Newton-analysis/_note_scene_trackability/ at the first stocking of that note, which is created-to-write-into and has no d1 yet. Placed because its section 2.1 IS the notes direction sentence (trackability sorts material; it does not describe a scene), 2.11 is the binary/graded mismatch the direction refers to, and section 4 is what keeps a first draft from overclaiming the sort. Carries its own warning: the record states it is not a single coherent idea. Here for those pieces, not for a synthesis it refuses."
