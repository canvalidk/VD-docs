    note: "MFP1 DETECTION WITH HAZE: INVESTIGATION BRIEF (177 lines, VD-Newton-side, 2026-09-11), received 2026-09-23 from VD-Newton's pass to VD-docs/ staging folder (branch codex/nml2-entry-renumbering @c2a0872; the file is unchanged since 9f9e3f8, 2026-09-13), sha256-verified against the clone. Written for an investigator with comparable VD knowledge who must continue without reopening settled premises. MFP1 = an omitted contribution of a RECOGNISED kind (MFP2, an unrecognised kind of acting object, out of scope). Premise, his words: 'we are doing this investigation, believing in haze' - haze is a function of the tolerance eps returning 'a zero vector with uncertainty based on eps', a phrase to be preserved and NOT silently replaced by a zero-expectation random force, a Gaussian process, an exact zero or a numerical threshold. Three roles to investigate: protection from an endless explicit account, protection from 'detecting' negligible contributions, a natural role in detection; detection vs attribution; what a successful investigation should deliver. STALENESS, recorded not bound: the brief predates the 09-12 refinements, and the 09-12 car record says so itself and states that the later instructions govern where the drafts left the definition open - it reads the brief's 'zero vector with uncertainty' as an explicit nominal zero plus a bounded allowance that need NOT be zero-mean or random. That is a FILLING-IN of what the brief deliberately left open (the brief itself forbids formalising as zero-expectation random), not a contradiction; Claude's 09-13 reading ('the car doc unfreezes the brief's premise') overstated it and is withdrawn here. An investigator should read the car record alongside. Filed 2026-09-23 as a flat record in _dscn_haze on his ruling ('lets go with discussion haze'). Kind unstamped. NOT a Criticism History record: it leaves haze's entry placement explicitly open, so accepting it would change no entry list (the SORTING 2a test). The entry-placement proposal, when someone writes it, is the criticism and goes to criticism_history with criticises: force_sum. Name kept as received (VD-Newton and the other haze records cite it). Normalization NO-OP, KaTeX gate passed, nothing banked."
