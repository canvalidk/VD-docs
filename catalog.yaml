    note: "WITNESS SHEETS - record, Claude-authored 2026-10-06 at the user's request ('Will you make a record of the witness sheets. Fully explain the idea.') from that day's conversation, written into inbox/ and sorted under the 2026-09-24 standing rule. THE IDEA (his): every object has a witness sheet - testimony about the scene that sits ONE LAYER BEYOND the trace's inputs, like a computer peripheral (physically part of the machine, logically input); the trace does not depend on sheet structure and nothing in the trace reads a sheet - the reader answers walls from it instead of from the scene; if every sheet were perfectly kept the scene would never need observing again (the witness analogy); a sheet need not be organised - an exam question's preamble works as one - and it can itself be flawed. The entries fully define what a sheet implies, so its implications become the theory's; correctness and coherence are entry-defined, and any sheet or set of sheets can be incoherent. Two forms of actually-there are separated: REACHABILITY (built in now - from F, m and a exist because reachable; what the earlier notes called entry-forced) and KIND MEMBERSHIP (not yet built - the meta-object entries' job; 'witness-sheet-forced' is a misnomer, the sheet forces nothing). PREDICTION SET: one added element, 'the witness sheets accurately describe the scene'; an incoherence element whose form must come from the entries and is not yet known. Analysis marked as such in the file: no-lookup rule untouched; unfaithful vs incoherent split (incoherence catchable from inside, unfaithfulness only by failed prediction or re-observation); his worked example ('accelerated with 5 m/s for 5 seconds... velocity now 1/2 of what it was 3 seconds ago') is ill-typed and incoherent in ordinary language but coherent through vector entries (30 m/s at t=2 s), showing coherence is a property of (sheet, theory); old input element splits into fidelity vs reading error; fidelity proposed as the one theory-independent element (not ruled); incoherence-as-disjunction (unfaithful sheet or wrong entries) left open; redundancy as both risk and check. Sec 9 is a revision table for the witness-sheet readings in IT_IS_ACTUALLY_THERE, the synthesis, prediction_sets and randomness_declarative_boundary - nothing edited in place. FLAGGED, RULING OWED: the NML3 bridge (secs 4.2-4.3) calls its force-member and IFS records 'witness sheets', but they hold trace-side accounting state - a terminology collision. PLACEMENT: Theory, own record folder by the Theory convention (the idea is about any VD theory instance; nearest neighbours actually_there_prediction_sets and randomness_declarative_boundary). Not filed as a correction/supersession of IT_IS_ACTUALLY_THERE: it is a new object about witness sheets that revises how those notes use the term, so no corrects/supersedes binding was made - a sorter's call, cheap to change. Not a criticism of the entry structure (SORTING 2a): it names entries still to be built (meta-object) rather than changing existing ones. Normalization 2026-10-06: NO-OP, no math delimiters, nothing banked."
