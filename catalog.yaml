    note: "FUNCTION-CALL MODEL DECISION HISTORY (483 lines), dated 2026-09-01, a record carried over from VDfirst - it records the decisions implemented on branch codex/parameterized-headwords at checkpoint 6da2e21 and cites the related spec specs/2026-09-01-vd-parameterized-headwords.md by relative path, which is NOT held in this repo (the citation reads as source-relative, recorded not rewritten). Sorted in 2026-09-02 on his ruling, Code branch, own folder; the filename keeps VDfirsts dated convention so it resolves back to source. WHAT IT RECORDS: eighteen chronological questions and answers that produced the current VD function-call model, separating three operations that had been conflated - EXPANSION selects an entry, BETA-LIKE INSTANTIATION supplies actuals to formal parameters and constructs a residual, R-REDUCTION records one persons observed response to that residual. Standing commitments (its closing list): VD assumes no primitive delta-reduction layer; instantiation constructs a residual but does not interpret it (3 add 5 has no built-in result; calling R human-certified equivalence is incorrect); one trace is one persons encounter and distributions arise across encounters; actuals bind positionally left to right; substitution respects token and argument-segment boundaries; instantiation precedes ordinary lazy tokenization; every underscore suffix currently denotes an argument. BAND-AIDS it declares as deliberate, replaceable shortcuts (its explicit return list): one signature per stem, atomic actual values only, hard error on over-application, flat simultaneous instantiation without binders, the simplified R-response protocol. Not a VD-Newton decision record of the kind dropped under the 08-05 rule - those were numbering and naming decisions that rot; this is a design-note record of a model, the Code folders stated business. Normalization a NO-OP, no math delimiters."
