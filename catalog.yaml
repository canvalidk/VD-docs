    note: "DISCUSSION FOLDER, created 2026-09-23 on his ruling ('lets go with discussion haze'), with its name. SCOPE: haze - his name for Z_eps, the explicit, tolerance-indexed place in a finite Newtonian force account for what the account did not include, with limits on what it may explain. HIS FRAMING, 2026-09-23: haze is 'a research problem with a criticism attached', not a criticism with research attached - so it gets its own discussion (and maybe later a note), and any piece of it that proposes a change to the entry structure is a separate record for criticism_history. As of creation NONE of the members is such a record: every one leaves haze's entry placement explicitly open. FOUR FLAT MEMBERS, reading order = date: the 09-10 origin argument (NML3_HAZE_AND_THE_LOGIC...), the 09-11 MFP1 investigation brief, the 09-12 car/adequacy record, Claude's 09-13 language-of-approximation piece. No relations bound; the brief-vs-car refinement is recorded on the brief's row as a filling-in, not a supersession. HELD OUT, in inbox/: the two fluid direction records (09-10, 09-12), ambiguous between this discussion and the lumping material - to circle back. MISSING: the two 2026-09-09 origin sources the 09-10 argument cites (tolerance/special-zero discovery; remainder intermediate-expression algorithm), local to VD-Newton, never passed. NO NOTE: the members are successive attempts at what haze is, but they change content rather than expression (record behaviour); a note arrives only when he names a direction."
  Newton-analysis/_dscn_particle_and_mass_origins:
    note: "DISCUSSION FOLDER, created 2026-08-25 on user instruction and POPULATED IN THE SAME ACT - the first discussion created with members rather than empty, and the first coined since the model was ratified. NAME GIVEN BY THE USER: 'trackability and mass'. SCOPE: the chain from tracks to particles to mass - how trackability yields point-particles, how rigidity licenses lumping and additive mass, where a valid mass VALUE enters the prediction chain, and what estimator recovers m from measured non-conforming vectors. DECLARED A HOLDING DISCUSSION at creation: the user's stated plan is to sort the members into mass estimation or trackability afterwards, so this grouping is EXPECTED to be split. That is not a defect - a discussion is a filing choice, and a filing choice is allowed to be provisional. MEMBERS, 12 files. (1) tracks_to_particles/ KEEPS ITS OWN FOLDER inside the discussion, 4 files, because d2 is corrected_by d3: the depth rule gives a folder to any record with attachments to bind. (2) vd_point_particle_bridge_spine_d1.md and (3) vd_mass_identification_pipeline_d1.md sit FLAT, each a lone record once its -informing fossils were staged out. (4) The six vector_division_mass_estimation files sit FLAT, on the user's ruling that they enter here now and split out to _dscn_mass_estimator later. DISCUSSIONS DO NOT NEST - which is why the vector_division group came in flat rather than carrying its folder. Open item (6) of 2026-08-21 (whether discussions nest) is answered in practice rather than by stipulation: the statement-record device lets an argument's identity be written down as CONTENT, so nesting is never the only way to express a sub-argument. NOTES EXCLUDED BY THE RULE, AND THIS IS EXACTLY THE CASE STATEMENT-RECORDS WERE INVENTED FOR: _note_rigidity_composition (rigidity -> additive mass -> CoM) and _note_photon_frame_certification are squarely in this genre - the first supplies the lumping premise the spine relies on, and the second's d3 informed tracks_to_particles, which is why a copy of it sat in that folder until today - but a note is directional and stays at branch level, so their participation in this argument can only be recorded as content, in a statement-record, if it is judged worth recording. BORDERLINE RECORDS OFFERED AND DECLINED by the user 2026-08-25: material_object_naming, newton_vs_gibbs, composition_discovery. So the 2026-08-21 candidate set for the then-fourth candidate discussion 'trackability_to_mass' is adopted MINUS material_object_naming - notable because the 08-21 note had graded that one a strong member on the ground that it synthesizes the other three. His declining it is the ruling; the 08-21 grading is superseded, not contradicted, since a discussion has no membership test to be wrong about. AUDITS AT FILING: no -informing copy inside the discussion (six were staged out to _to_delete/ FIRST, which is what made the two flat placements possible); catalog<->disk bijection holds; the _note_ / kind: note bijection is untouched. RECORDED SHORTFALL, surfaced and NOT fixed: several members still carry draft/current from the pre-2026-08-20 model, which the kind model retires for records, and why_the_mass_entry_cannot_be_short.md still carries the explicitly RETIRED value draft: unknown. Left for the user's ruling, as with the acting-object primitives pair - retracting a draft claim is his call, not a sorting act. SPLIT BEGUN 2026-08-25, hours after creation, exactly as declared: the six mass-estimation files LEFT - four to _dscn_mass_estimator, two promoted to _note_why_mass_estimation - and this folder now holds SIX FILES of purely trackability material: tracks_to_particles/ (4, keeping its folder), vd_point_particle_bridge_spine_d1.md and vd_mass_identification_pipeline_d1.md. A holding discussion doing what it was declared to do is not a defect. THE NAME NOW OVERSTATES ITS CONTENTS and is the user's to change - discussions are named by him at creation, and renaming a folder is free. TRACKABILITY HAS NO DRAFT LINE, established by reading the files 2026-08-25: vd_trackability_scene_to_particles_d4.md declares in its own header that it supersedes d1, d2 and d3 and that they 'should no longer be consulted' - supersession in the strict sense, so tracks_to_particles is a RECORD line with d4 current by determination, not a note. The spine and the pipeline are lone synthesis documents. CONSEQUENCE FOR THE PLANNED TRACKABILITY NOTES: they cannot be made by promotion, because there are no drafts to declare. They would be notes CREATED TO WRITE INTO - direction stated, workbench stocked with -informing copies, d1 not yet written - which is a different act from promotion and worth keeping distinct in the model. TWO MEMBERS ARRIVED 2026-08-26, taking this to 11 files in 6 members: identifiability_and_fluid_representation_discovery.md and lumping_horizon_and_thermodynamic_boundary.md, both flat. THE ONE-DISCUSSION RULING, 2026-08-26: asked whether this discussion should be SPLIT IN TWO to mirror the two notes created at branch level (_note_scene_trackability, _note_mass_address_lumping), the answer is NO, and the user accepted it outright. The decisive rule was already in ORGANIZATION.md: the two filing outcomes are INDEPENDENT - a record may be filed in a discussion AND inform a note, the record stays home and only its -informing copy enters the note's workbench. A per-note _dscn_ split would make the discussion do the WORKBENCH's job, in a container that by ratified rule has no membership test and may hold no copies. THREE OF THE SIX MEMBERS STRADDLE BY THEIR OWN TEXT, and a file lives at one path, so the only way to put a straddler on both sides is a copy - which inside a discussion is the forbidden -informing shape: tracks_to_particles/ (d4 is the document BOTH notes are carved from, split at its section 3), lumping_horizon_and_thermodynamic_boundary.md (its own Position line: stands between the trackability material and the lumping material) and vd_point_particle_bridge_spine_d1.md (the single chain that every current note annotates - ground is trackability, wall 1 is lumping, the seam in one file). TWO MEMBERS INFORM NEITHER NOTE: rigidity_composition/ and vd_mass_identification_pipeline_d1.md are mostly the CoM ledger, which the lumping note disclaims by carrying the proxy license only. THE POSITIVE REASON, not merely the negative one: the two notes are TWO CONSECUTIVE CUTS OUT OF ONE SPAN, not two adjacent topics that got filed together. WHAT DOES THE SORTING INSTEAD: the -informing copies, per-note and per-file, which CAN go to both workbenches. STATEMENT-RECORD OWED, the second discussion to earn one after _dscn_entry_structure: the sort itself - reading order, which records feed which note, where the section-3 line falls - is CONTENT, and it currently survives only in this note, which nothing addresses. RENAMED 2026-08-26 ON USER INSTRUCTION: this folder was _dscn_trackability_and_mass and is now _dscn_particle_and_mass_origins. The 2026-08-25 entry above predicted it - the name now overstates its contents and is the user's to change - and he confirmed the original was meant as a placeholder. NAME GIVEN BY THE USER, chosen over two Claude candidates: point_particle_bridge (the house term, already the spine note's own title and carried on the nml2 informing copies) and forming_massive_particles (his own earlier phrase). WHY HIS WON, on Claude's endorsement: it names the QUESTION rather than one member's answer-structure, so it survives a revision of the bridge account, where a folder named for the bridge would carry a superseded structure's name; it names BOTH outputs of the construction, the count and the value, where point-particle bridge buries the mass half inside a compound; and its 'and' joins two products of ONE construction, unlike the placeholder's 'and', which joined a precondition to a quantity - which is exactly why that name went stale the moment the mass-estimation files left. RECORDED RESERVATION: 'origins' can be misread as historical or metaphysical, where the concept came from, rather than constructional. Hence this SCOPE LINE, which the name cannot carry on its own: THE SUBJECT IS CONSTITUTION, NOT HISTORY. The span the members trace is how a scene of material becomes a countable point particle that carries a mass - ground (the scene is trackable), to count (lumping), to carrier and additivity (the CoM, M = sum mi), to the value in the slot (the pipeline), to where the route runs out (the lumping horizon, which hands thermodynamics off). WHAT THE RENAME TOUCHED: eleven path rows and this folders: key, nothing else. HISTORICAL PROSE UNDER THE OLD NAME IS DELIBERATELY LEFT AS WRITTEN, here and in the branch, _dscn_mass_estimator and _to_delete notes - those are past-tense records of what happened on 2026-08-25, they are true as written, and rewriting them would falsify the record. Folders are cosmetic, no file was renamed, and every citation by filename still resolves. THREE MEMBERS ADDED 2026-08-26 BY CROSS-BRANCH MOVE, on user instruction, taking this to 14 files in 9 members: vd_coverage_five_aspects_and_industry_appearances_d1.md, one_dimensional_redundancy_vscode_math_d1.md and glass_ball_mdp_example_d1.md, all three FLAT, all three from Newton/nml/nml2/nml2.2/, each leaving an -informing copy behind. HOW THEY WERE FOUND: a sweep for drafts of the two trackability notes. They are not drafts - each says something the scene note d4 does not, which is the supersession side of the successor test - but all three are the most developed statements in the repo of material inside the two notes jurisdictions, and all three postdate d4 (2026-07-20, 07-21, 07-24 against 07-03). THE CUSTODY ARGUMENT: analysis of what the entries should be belongs in Newton-analysis under the 2026-08-20 branch line, so the home moves and the lesson keeps a copy; the copy exists BECAUSE HOME LEFT, the reverse of the usual borrow-into-a-workbench direction. THE USER PRE-AUTHORISED THE ROUGH EDGE: how these relate to nml will likely change, and nml folders are already a standing exception to the note/record/discussion shapes, so the placement is deliberately cheap and revisable rather than settled. THE CORRECTIONS RECORD STAYED BEHIND, user ruling: vd_review_corrections_d1.md remains in nml2.2 because its third review target, the pre-water student inventory, is lesson material that stays there. Consequence recorded: the corrected_by relation on one_dimensional_redundancy now SPANS BRANCHES - legal, since relations resolve by filename and path prefixes decay - and that member therefore sits FLAT, because a records folder exists to bind attachments and the attachment is not present to bind. OPEN COLLISION SURFACED BY THE SWEEP AND NOT RESOLVED, the most consequential thing in this pass: vd_review_corrections_d1 (2026-07-24) CONTRADICTS d4 ON THE PRIMITIVE. d4 section 3 makes kinematic redundancy (fixed offset) the primitive and argues distance-rigidity OVER-licenses, because fixed distances permit rotation and would lump a spinning wheel while discarding the spin. The review argues the opposite direction - that the offset criterion is the wrong one because it FORBIDS rotation - and replaces it with two named tolerances: eps_shape (distance preservation, licenses a BODY, permits spin and forbids bending) and eps_trans (residual scatter about a chosen member, licenses that body being ONE PARTICLE). That is a direct challenge to the agreed direction line of the mass_address_lumping note, which states the primitive as kinematic redundancy with rigidity surviving only as its zero-tolerance limit, exact rigid TRANSLATION. The two may well reconcile - the review can be read as doing d4s deliberately parked rotation case rather than refuting it, and it separates body-hood from particle-hood where d4 collapses them - but it is a RULING, it is the users, and it has sat open in another branch since 2026-07-25 with the corrected draft never edited. It should be made BEFORE the lumping notes d1 commits to a primitive. TWO MEMBERS LEFT 2026-09-05 on user instruction: lumping_horizon_and_thermodynamic_boundary.md and glass_ball_mdp_example_d1.md moved FLAT to the new _dscn_lumping_consequences (see that folder's note for why it exists). Now 12 files in 7 members: tracks_to_particles/ (4), rigidity_composition/ (3), and 5 flat - identifiability_and_fluid_representation_discovery, one_dimensional_redundancy_vscode_math_d1, vd_coverage_five_aspects_and_industry_appearances_d1, vd_mass_identification_pipeline_d1, vd_point_particle_bridge_spine_d1. The scope line stands - constitution, not history - and is sharper for the departure: the horizon was the member that ran past the mass value into thermodynamics, and the glass ball was a consequence case rather than a constitution record. A discussion is a filing choice; two path rows moved, nothing else changed, every citation still resolves. The 2026-08-26 one-discussion ruling is NOT reversed by this: that ruling refused a split mirroring the two trackability notes; the new discussion mirrors no note and is wider than this one, and the two records that moved belong to it by their own text. ONE MEMBER ARRIVED 2026-09-05, later the same day, on user instruction: vd_review_corrections_d1.md from Newton/nml/nml2/nml2.2/, FLAT (a correction shared across three documents in three places binds into no folder), leaving an -informing copy behind. Now 13 files in 8 members. It is the record that CONTESTS d4 sec 3's primitive (eps_shape / eps_trans against fixed offset) - so the criterion argument the lumping note has to settle is now held inside this discussion on both sides, d4 and the review, rather than across branches. The user had ruled 2026-08-26 that it stay in nml2.2; he reversed that today because the lumping note's rule changed (rigidity vs redundancy is no longer a filter). This was the ONLY nml file taken in the 2026-09-05 sweep for the discussions other than _dscn_entry_structure - the sweep found nothing else in Newton/nml for mass_estimator, this discussion, lumping_consequences or acting_object_primitives; the entry_structure candidates (nine files: the two nml1 E7/E8 notes, NML2_working_note_core_constraints, the four nml3/conceptual force-sum records, the impressed-force open problem) were deliberately left in place - he is building up to that pass and wants the other discussions cleared first."
  Newton-analysis/_note_scene_trackability:
    note: "NOTE FOLDER, created EMPTY 2026-08-26 and STOCKED the same day - the second note in this repo made by CREATION-TO-WRITE-INTO rather than by promotion, and the first whose direction is recorded before any draft exists. Name given by the user. NO d1 YET: the folder holds five -informing copies and no primary file, which is exactly the state the model describes for a note created to write into - direction stated, workbench stocked, d1 not yet written. The standing audit assertion that every _note_ folder holds at least one kind: note file therefore still fails here, BY DESIGN, and this note carries note-hood in this folder note until its first draft exists. DIRECTION, agreed with the user 2026-08-26 and previously recorded nowhere in the repo: Newtonian mechanics ASSUMES particle tracks - every r(t) is the trajectory OF something, and silently cashes the claim that some point was followable from one moment to the next. This note takes that assumption as its subject: HOW TRACKS ARE PRODUCED, AND WHERE THEIR PRODUCTION FAILS. Production - what a tracker is given, what it does, what it can recover. Failure - the assumption does not hold uniformly across the scene; trackability SORTS material rather than describing all of it, and identifying how that divide works, sharp or graded, is what the note is aimed at. FAILURE MARKS THE END OF THE NOTES JURISDICTION, NOT A FURTHER TOPIC WITHIN IT: it establishes where tracks stop being available and hands custody on WITHOUT NAMING WHO TAKES IT, because the apparatus for answering that does not exist this early. Everything here stands before NML2 and depends on nothing downstream. ARRIVAL is when both halves are CRITERIA - what produces a track, and what puts material beyond the reach of one - rather than examples. JURISDICTION RULING, user, 2026-08-26, load-bearing: an earlier Claude draft gave this note an acting-object corollary, that what fails the sort is confined to the acting-object slot. He struck it. Trackability is confined to before NML2, so it cannot reach into acting objects - not merely out of scope but UNWARRANTED FROM THE NOTES OWN POSITION, since making that claim needs apparatus the note does not have that early. Side effect: the section 7 defeat collision resolves itself, because defeat is a judgment failing after a bundle exists, which is past the line. WHERE THE CUT FALLS against the scene note d4: sections 0-2 (ground, tracker, coverage residues) here; section 3, kinematic redundancy, opens the mass_address_lumping note and is NOT this notes; sections 4-7 that note; section 8, mass as address only, neither - an address out. This note is thin next to that one and that is correct; its jurisdiction is genuinely narrow. WORKBENCH, five copies, selected by a stated test rather than by topic - a record earns a copy only if a first draft would be WRONG OR UNWRITABLE without it, the admissible jobs being: supplies a criterion the note must state, fixes the notes boundary, or blocks a mistake. On-topic is not a job and a hand-off destination is not a job. Placed: vd_trackability_scene_to_particles_d4 (the subject matter and the boundary), vd_coverage_five_aspects_and_industry_appearances_d1 (coverage as criteria, which the arrival condition demands), identifiability_and_fluid_representation_discovery (the source of the direction sentence, and section 4 blocks the overclaim), vd_tracks_to_particles_corrections_d3 (the S7a debt owed to this note) and vd_point_particle_bridge_spine_d1. DECLINED AND RECORDED: lumping_horizon_and_thermodynamic_boundary, because it is about lumping expiring rather than tracking failing and is past the jurisdiction line - the note hands custody on without naming who takes it. THE BRIDGE SPINE COPY IS A USER CALL OVER A CLAUDE OBJECTION: Claude excluded it on the ground that it imports the downstream chain this note is defined as not depending on; the user overruled - half of it is useful - and it is executed as called, with the live/not-live split and the retired-wording caution written into its banner rather than argued again. SIZE IS NOT A SELECTION CRITERION HERE, user correction 2026-08-26: the 2026-07-07 rationale for the informing device was that a workbench must be pasteable as AI context without hassle; workbenches are now UPLOADED, so line count does not gate the copy set. The constraint that remains is NOISE rather than budget, and the banner is the instrument for it - which is why every banner here states what its copy is FOR and what in it is dead. That change of rationale moved one file, the corrections note, from cite to copy. d1 ARRIVED 2026-08-27 and the note is no longer empty: scene_trackability_covered_track_family.md, authored by the user and sorted in the same morning, renamed at intake from scene_trackability_argument_draft.md. Its sec 16 Source map credits all five -informing copies stocked here on 2026-08-26 claim by claim, and its secs 11 and 13 hold the jurisdiction line the user drew - handing off to redundancy and lumping, and explicitly disclaiming that non-trackable material can be routed through acting-object machinery at this address. THE BY-DESIGN AUDIT FAILURE ENDS HERE: this folder now holds a kind: note file. _note_mass_address_lumping is still empty and still exempt. The DIRECTION above now also lives on the d1 file row, which is where the model wants it; this folder note keeps it as the record of where it was agreed. NOT YET ARRIVED by its own test: sec 15 carries six open questions and the two halves are still worked as examples rather than criteria."
  Newton-analysis/_note_lumping:
    note: "NOTE FOLDER, created EMPTY 2026-08-26 and STOCKED 2026-09-03 - the third note in this repo made by CREATION-TO-WRITE-INTO. Name given by the user. NO d1 YET: the folder holds six -informing copies and no primary file; the standing audit (every _note_ folder holds a kind: note file) fails here BY DESIGN until d1 exists, and this note carries note-hood in this folder note until then. DIRECTION, agreed with the user 2026-08-26 and until today recorded nowhere in the repo: a standalone account of lumping as the move that supplies an ADDRESS for mass and never a value, operating only on material that has already survived trackability's sort. Aimed at characterizing a judgment that must be COMMITTED TO IN ADVANCE AND CAN ONLY BE CHECKED IN ARREARS: lumping cannot be read off the tracks, it is defeasible and its defeats are retrospective, yet the count it fixes is needed before any predicted track exists. Carries the PROXY licence only and disclaims the ACCOUNT licence - the centre-of-mass ledger holds for any body, redundant or not, and belongs downstream. Arrival is when the value question can be handed off intact rather than answered, and when the standing for a lumping made in advance can be stated without appeal to how it later turned out. THE PRIMITIVE SENTENCE OF THE 08-26 WORDING IS WITHDRAWN (user ruling, 2026-09-02/03 session). The line had read: its primitive is kinematic redundancy - not rigidity, which survives only as redundancy's zero-tolerance limit. That was Claude's synthesis of d4's position; the user never held the logic between rigidity and redundancy resolved, and rigidity-vs-redundancy is NOT a filter for this workbench - a record about either is relevant. The line as it stands in the files: rigidity as fixed distances of solids (tracks_to_particles d1) -> rigidity redefined as a track feature and made the criterion (d2) -> fixed offset replacing it, distance-rigidity said to over-license because it lumps the spinning wheel (corrections C2/C2a, d4 sec 3) -> the nml2.2 review (vd_review_corrections_d1 sec 1, outside this discussion) reinstating distance preservation as eps_shape (licenses a body) with redundancy demoted to eps_trans (licenses one particle) - and beside that line, unrelated to it: rigidity as shared acceleration in the additivity derivation (rigidity_composition) and the projected localisation criterion of the 1D note. Nobody wrote the reconciliation. Settling it is the note's first job; rigidity as redundancy's zero-tolerance limit is one candidate outcome, not a premise. WHERE THE CUT FALLS against d4: sections 0-2 are scene_trackability's; section 3 opens this note; sections 4-7 are its body; section 8, mass as address only, is its exit. THE CHAIN RULE (user, 2026-09-02/03): when the scene_trackability note is written, an -informing copy of THAT NOTE comes here; scene_trackability's feeder records are therefore not re-copied unless they carry lumping-side material no other record repeats. Under it four of note 1's five feeders drop to citation: coverage_five_aspects (pre-line), identifiability_and_fluid_representation_discovery (its sec 2.3 slab remark is made better by lumping_horizon sec 4), vd_tracks_to_particles_corrections_d3 (C2a, C3, C4, C6, C8 all implemented in d4; the compression byproduct is restated in scene_trackability sec 11), and the spine - which the user then placed anyway, below. WORKBENCH, six copies, selected by the NON-OVERLAP test the user asked for - which records carry lumping-side information nothing else in the discussion repeats: vd_trackability_scene_to_particles_d4 (the lumping core, secs 3-8: primitive, cliques, four residues, two licences, defeat taxonomy, address grading); lumping_horizon_and_thermodynamic_boundary (the interval index, diffusion as the irreducible defeat, bounded vs thermal - declined for scene_trackability for the mirror reason); one_dimensional_redundancy_vscode_math_d1 (projection before redundancy, the localisation criterion, address-discrete vs spatially discontinuous); tracks_to_particles_rigidity_as_lumping_criterion_d2 (the only positive statement of rigidity-as-track-feature as the criterion - consulted despite d4's supersession because that supersession on the primitive is what is in question); from_rigidity_to_additive_mass_d1 (the only statement of rigidity in the dynamical sense, shared acceleration - downstream, placed so the note can tell that sense apart from the track senses); and vd_point_particle_bridge_spine_d1 (USER CALL, as for scene_trackability - Wall 1 and the open segment, C8 is a Wall-2 problem). Every banner names WHICH SENSE of rigidity or redundancy its copy uses, since six senses are now in one folder. OVERLAP, cited not copied: vd_mass_identification_pipeline_d1 (value side; its Stage 2 repeats d4 in the sub-family wording d4's edits-owed list retires), trackability_bodies_and_rigid_bodies_d1 (the solids sense, covered by d2 and by from_rigidity_to_additive_mass_d1), from_fma_rigidity_to_com_plain_math_d3 and its superseded d2 (same rigidity contribution as d1 secs 3 and 6, the rest CoM algebra), and the four feeders above. GLASS_BALL IS THE USER'S CALL, pending: its principles (licence lost -> re-lump; return of redundancy creates a new address rather than restoring the old; a total does not fix a partition) are d4 secs 7-8; unique to it are the worked case and the point that the count is not supplied by nouns. OUTSIDE THE DISCUSSION, deferred by the user to a later pass: nml2.2's vd_review_corrections_d1 (the strongest rigidity-side argument in the repo; a copy would run against the branch informing order, Newton-analysis -> Newton) and the pre-water inventory (secs 8.7, 14-16, 25, 28). OPEN, raised by the user at stocking: whether the CONSEQUENCES of lumping (defeat, address grading, the horizon, re-lumping) should become a second note. Claude's read, recorded not decided: the divide that is failing is not lumping-vs-consequences but criterion-vs-standing - what depends on which criterion wins (rigidity or redundancy, tolerance, cliques, projection) against what holds whichever wins (address not value, committed in advance, defeasible, proxy licence only). The 08-26 direction minus its withdrawn primitive sentence already describes the second; the hole is the first. A consequences note would have to assume a criterion the criterion note has not settled - the forward-reference shape the 08-26 jurisdiction ruling struck from scene_trackability. Stocking does not prejudge the split: copies can go to a second workbench later. SIZE IS NOT A CRITERION (user, 2026-08-26); the banners carry the noise control. RENAMED 2026-09-03, the same day it was stocked: _note_mass_address_lumping -> _note_lumping_conditions, on the user's TWO-NOTE DECISION - first a note on lumping CONDITIONS AND ASSUMPTIONS (this one: settle the criterion - rigidity or redundancy, the tolerance and interval indices, cliques, projection - and state what lumping assumes from trackability's output), then a note that EXPLAINS lumping without justifying it, consequences and theorems, which is _note_lumping_consequences, created empty beside this one. His words: as long as that decision isn't decided, we first gotta do that, then the consequences become available. WHAT THE RENAME MEANS FOR THE DIRECTION ABOVE: the 08-26 wording - address not value, committed in advance and checked in arrears, proxy licence only, arrival when the value question hands off intact - is the CONSEQUENCES note's direction and moves there; what remains for THIS note is the part the 08-26 line got wrong by assuming settled: the criterion. This note's direction, to be worded by him: what licenses a lumping, and what a lumping assumes. Its arrival is a decided criterion that the consequences note can take as given. The six copies stocked above are criterion material and stay; their rows carry the new note_name, their banners say where they were placed and under what name. The chain rule applies forward: the consequences note takes THIS note's copy when written. Name given by Claude to pair with the second folder; his to change, folders are cosmetic. ONE NOTE FOR LUMPING (user decision, 2026-09-05, reversing the 09-03 two-note plan): this is it. The consequences NOTE created 09-03 was dissolved the same day it was stocked, and a DISCUSSION, _dscn_lumping_consequences, was created empty in its place for the undirected records this note will throw off - see that folder's note for the reasoning and the history. What that means here: this note argues lumping in a DIRECTED fashion, towards a decided set of conditions and assumptions; consequences are not its business and get no direction - they become records, filed in the new discussion, free to leave mass origins. The 08-26 mass_address_lumping wording is no longer any note's direction; its content (address not value, committed in advance, the licence split, the arrival condition) is candidate record material for the discussion. One thing from the coherence review this note must own: the PROXY LICENCE IS CRITERION-DEPENDENT - any member track standing for the representative holds under fixed offset / eps_trans and fails under eps_shape (a spinning wheel is a body whose rim track cannot stand for its centre) - so which licence a lumping carries is decided by the criterion this note settles, and is not to be assumed by anything downstream. Workbench unchanged: the six copies above. Name unchanged; with one note it could simply be _note_lumping - his call, free. RENAMED 2026-09-05, same day: _note_lumping_conditions -> _note_lumping, his call on Claude's offer, once the one-note decision made the qualifier redundant. Six path rows, note_name and project updated; banners amended. Also that day, on his instruction, lumping_horizon_and_thermodynamic_boundary left _dscn_particle_and_mass_origins for _dscn_lumping_consequences; this note's copy of it now names the new home."
  Newton-analysis/_dscn_lumping_consequences:
    note: "DISCUSSION FOLDER, created EMPTY 2026-09-05 on the user's decision, with only a .gitkeep so that it pushes. Name given by Claude to pair with _note_lumping_conditions; his to change, folders are cosmetic. THE DECISION, his words: we are going to make a separate discussion for lumping consequences, but we will have ONE note for lumping. We will argue about lumping in a directed fashion when considering the conditions, towards the note; but the note will also spawn undirected, sprawling records about consequences. We want them in a separate place because this discussion can LEAVE THE IDEA OF MASS ORIGINS - so it will have more freedom. WHAT THIS IS, in the model's terms: a discussion created to write into - a filing destination coined before its members exist, for the records the lumping note throws off as it is argued. Its scope is deliberately WIDER than _dscn_particle_and_mass_origins, whose scope line is constitution-not-history and whose span ends at the mass value: a consequence of lumping may run out to thermodynamics (the lumping horizon already does), to fluids, to whatever the criterion touches, without having to be about how a scene becomes a massive particle. No membership test, as for every discussion; the folder note says what it is for. HISTORY, kept so the reversal is legible: (1) 2026-09-03 the user decided on TWO NOTES - conditions first, then a consequences note explaining without justifying - and Claude created _note_lumping_consequences beside the conditions note. (2) 2026-09-05 morning the user proposed a separate DISCUSSION for consequences; Claude argued against it as the per-note split the 2026-08-26 one-discussion ruling rejected and because discussions are coined when there are records to group; he accepted for the moment and had the consequences NOTE stocked instead (four copies: d4 secs 4-8, lumping_horizon, one_dimensional_redundancy, glass_ball). (3) Later the same day, on a coherence review, the user decided this: one note, one new discussion. His reason answers Claude's objection rather than overriding it - the objection assumed the discussion would MIRROR a note, and this one does not: there is no consequences note to mirror, the records it will hold do not yet exist, and its scope is wider than the origins discussion rather than a subset of it. Claude's created-when-there-are-records-to-group line is thereby amended: a discussion may also be created to write into, like a note, when the records it will hold are the expected output of a note being argued. (4) The consequences NOTE was therefore DISSOLVED the same day, hours after stocking: its four -informing copies are fossils in Newton-analysis/_to_delete/informing_fossils/lumping_consequences/ and the empty folder is in _to_delete/empty_folders/; rows updated to the staging paths, retirements due when the user empties _to_delete. Nothing else about the dissolution is recorded on those copies beyond the staging - they were placed and unplaced within two days and no draft ever cited them. TWO POINTS FROM THE COHERENCE REVIEW THAT LED HERE, carried forward because they still bite: (a) the consequences-note direction Claude had written (the 08-26 mass_address_lumping wording) was not criterion-invariant - its proxy-licence-only sentence holds only if the criterion licenses particles (fixed offset / eps_trans) and fails if it licenses bodies (eps_shape); that sentence now belongs to the lumping note's argument, not to any direction; (b) Claude's stated reason for leaving the consequences workbench empty on 09-03 (a copy would smuggle an unsettled criterion) was WRONG - a workbench commits nothing, a draft does - and is retracted here rather than left standing as a stance the user overrode. WHERE THE 08-26 DIRECTION GOES: nowhere as a direction. Address-not-value, committed-in-advance-and-checked-in-arrears, the licence split, the arrival condition are now candidate RECORD topics for this discussion, to be written when the note's argument produces them. EXISTING RECORDS THAT COULD MOVE HERE, flagged and NOT moved: lumping_horizon_and_thermodynamic_boundary (it leaves mass origins for thermodynamics by its own sec 4-5) and glass_ball_mdp_example_d1 (a consequence worked case). Both currently sit in _dscn_particle_and_mass_origins; moving a member is free (path rows only) but it is the user's call, and the origins discussion's own folder note would record the departure. FIRST TWO MEMBERS ARRIVED 2026-09-05, hours after creation, on user instruction (he took both of the flagged candidates): lumping_horizon_and_thermodynamic_boundary.md and glass_ball_mdp_example_d1.md, both FLAT, both moved from _dscn_particle_and_mass_origins. The .gitkeep stays. The horizon's -informing copy in _note_lumping and glass_ball's in nml2.2 now name this folder as home; the two fossils in _to_delete are unaffected. The lumping note was renamed _note_lumping the same day. 2026-09-05, evening: the four -informing copies staged out of this folder when it became a discussion were deleted by the user with Newton-analysis/_to_delete/; their rows are retired. This folder holds records only, as the rule requires."
  Newton-analysis/_note_why_mass_estimation:
    note: "NOTE FOLDER, created 2026-08-25 by PROMOTION out of a discussion - the first time that ruling has been exercised. Name given by the user: 'why mass estimation'. The three acts of recognition were done together: direction named, drafts declared, drafts gathered. WHY IT IS A NOTE AND NOT A RECORD SET: d3's own supersession declaration says it 'fully supersedes why_the_mass_entry_cannot_be_short.md as the entry-writing argument', but then says that document 'correctly found' the result and only 'had not yet separated' independent measurement results from a joint Newton-II fit. Under the successor test that is a better rendering of a standing finding - a DRAFT - so the author's word 'supersedes' is not what decides it. This is the clearest case yet that the test asks what the successor CHANGED, not what it calls itself. DRAFTS: d1 why_the_mass_entry_cannot_be_short.md, d2 why_the_mass_entry_must_be_long_joint_measurement_d3.md (current). The d2 file's name keeps the LEGACY _d3 from the vector_division_mass_estimation line it left; the numbering restarted because this is a new object with its own numbering space, and reusing the old numbers would have collided with numbers already spent on files that are now records in the mass_estimator discussion. Catalog over filename is the anticipated case, and no file was renamed. WORKBENCH: two -informing copies, of the two companions that declare themselves companions to d2 in their own opening lines. Their homes stay in the discussion. Held open, not ruled: whether vector_division_inertial_mass_measurement_d1.md earns a third copy. WHAT STAYED BEHIND: four records in _dscn_mass_estimator - the vector-division article and the type-theoretic analysis (which say different things, not the same thing better) and the two companions. So the four-folder shape the user described is now real for this subject: a discussion of records beside a note of drafts, at branch level. DIRECTION IS PROVISIONAL - written by Claude because promotion requires one and null is the defect the five grandfathered notes already carry. The user named the note but has not stated its direction line; replace it at his next touch. d3 ARRIVED THE SAME DAY: why_inertial_mass_must_be_estimated.md, authored by the user 2026-08-25 and sorted in from inbox/ hours after this folder was created. It is now current; d2's current flipped to false. THE NOTE TOOK A DRAFT WITHIN HOURS OF BEING RECOGNISED AS ONE - the cleanest possible confirmation that the successor test read d2 correctly, and the answer to the user's own remark that 'the filing is already being productive'. Its source-basis list names both earlier drafts and all four records in the mass_estimator discussion, and singles out why_the_estimator_is_the_definition as a downstream proposal rather than a premise - so the two -informing copies were the right two. The draft line is now d1 -> d2 -> d3 in the catalog, with only the middle file's name carrying a legacy _d3 that does not match its catalog number; the new file deliberately takes no dN suffix so that two competing d3s do not sit in one folder. Fixing the mismatch would mean renaming the middle file, which is the one breaking act, and is the user's call. d4 ARRIVED 2026-08-27: why_mass_must_be_estimated_introduction_d2.md, an introduction that retells d3s opening for a reader with no VD background and stops at the sentence naming the estimation problem. THE USER RULED IT A DRAFT OF THIS NOTE over Claudes read that its audience and its partial coverage made it a separate object - a second case, after the d3 supersession declaration, where the label Claude would have reached for is not what decides the binding. d3 STAYS CURRENT: a partial rendering is not promoted by a sorting pass, and a notes current draft is chosen. CONSEQUENCE FOR THE DIRECTION: it is now wrong in a second way - not only provisional and unwritten by the user, but narrower than the note has turned out to be, since VD-literate reader no longer covers the audience d4 addresses. WORKBENCH STOCKED A THIRD TIME 2026-08-27, on his instruction: median_based_estimator_inertial_mass-informing.md, whose home is the mass_estimator discussion and which arrived in this repo the same morning. The offer made at promotion has now been taken once; vector_division_inertial_mass_measurement_d1 remains the one candidate still held open, and the over-stocking caution still applies to it. FOURTH COPY 2026-08-29: disagreement_rule_mass_estimator_trace-informing.md, placed the same evening its home record was sorted in. THE FIRST CLOSED LOOP IN THIS REPO - that record was written FROM this workbench and cites the copy placed two days earlier, and it now returns as an input that constrains d5. vector_division_inertial_mass_measurement_d1 is still the one candidate held open. FIFTH COPY 2026-08-30: inertial_mass_estimator_full_working_spec_d1-informing.md, placed the day its home record was sorted in - the second closed loop in four days, since that record cites all four drafts of this note in its own Source basis. Its sec 34 is the piece this note actually needs: the evaluator contract the entry must trigger, and the line past which the entry owes nothing. THE WORKBENCH IS NOW FIVE COPIES DEEP, which is the most any note here has carried; watch it. The long-held vector_division_inertial_mass_measurement_d1 question is arguably answered rather than open, since the spec sec 7 brings that files estimator material in at one remove. SIXTH AND SEVENTH COPIES 2026-09-02, on his instruction, placed the day their home records were sorted in: what_forces_the_ratio_of_means_readout-informing (what the next draft may call forced: the composition laws, not reciprocal invariance, select the readout - a VD-internal premise, since the estimator is the definition and must compose as the definiendum composes) and what_forces_the_chain_to_the_estimator-informing (sec 7 audits this notes own drafts d1-d3 and gives the derivation order for the length claim: load forced, location by ruling, length by consequence; sec 9 lists corrections owed to d1 sec 3-4 and d3 sec 3). THE WORKBENCH IS NOW SEVEN COPIES DEEP. Claude recommended records-only on the size ground; he chose both. Each banner states what in the copy is not for this note. EIGHTH COPY AND THREE NEW FILES 2026-09-08, from VD-Newton's pass to VD-docs/: mass_estimation_introduction_candidate_2026-09-06 BOUND AS d5 by the successor test (a rewrite of d4, the introduction line, same argument said better for the same reader, with the shared-quantity dependency argument now inside it as sec 3) and MADE CURRENT BY HIS RULING - d3 flipped to current: false; the draft line is d1 -> d2 -> d3 -> d4 -> d5 with d5 current. Beside it, as workbench records rather than drafts or informing copies: its sources record (mass_estimation_introduction_candidate_sources) and the development plan it was drafted from - a placement the model does not name, recorded as such, cheap to move. The eighth informing copy is vd_shared_quantity_argument_mass_estimation_2026-09-06-informing, home in the discussion, the record d5 was written from; he chose it alone of the three offered (practical_limits, uniqueness and the steering declined - past the introduction's stopping point). THE DIRECTION IS NOW WRONG IN A THIRD WAY: with the introduction current, the rendering the note is heading toward is the reader-without-VD-background introduction, not the VD-literate case; the direction field on d5 says so. Still his to state. 2026-10-22: three informing copies dropped (median_based_estimator, disagreement_rule, vd_shared_quantity_argument) because their sources left for Mass-estimator-testor in the mass-estimator sweep; staged in Newton-analysis/_to_delete/informing_copies_2026-10-22/. The spec and chain-audit copies stay, repointed to their new note homes. The three dropped copies differed from their sources only by a six-line placement header (do not edit here, home, why placed in this note); the bodies were byte-identical to the originals now in Mass-estimator-testor docs/, and the headers survive in git history."
  Newton-analysis/_note_mass_estimator_equation:
    note: "NOTE FOLDER, created 2026-09-23 (night) EMPTY - a note created to write into, on the user's instruction ('Lets start by making a mass estimator equation note. And write a literature resting story of how we got this far'). .gitkeep only until d1 lands. PLANNED d1: the story of how the estimator equation was reached - F/a is not a definition; best-point, median and ratio-of-means stages; the composition argument; the unforced law and the default-prior literature; the coverage limit - with every step marked as a standard literature result (cited, checked against the paper), a VD premise, or new. Today's (2026-09-23) parameter findings (lambda as a balance prior, the (f alpha)^k reduction, switch rules, update rule) are EXCLUDED from d1 by his instruction; they come at the end. Papers it rests on are collected in _dscn_mass_estimator/papers/. DIRECTION: not yet stated by him - to be ruled before or with d1 (the model requires one at promotion; do not let a provisional wording stand in, cf. _note_why_mass_estimation). Relation to _note_why_mass_estimation (whose d5 is the no-VD-background opening): not ruled; kept as a separate note on his instruction. 2026-09-23 (night), later: d1 filed - how_we_reached_the_mass_estimator_equation_d1.md, current. Direction still unruled (null on the row). 2026-09-26: d2 filed - the_mass_estimator_equation_d2.md, now current (d1 current: false, kept untouched). d2 features ours25b and justifies it as a chain of tagged forced moves; step 8 (shape of the starting belief) left open by his ruling. Direction still unruled. 2026-10-22: d0 added, inertial_mass_estimator_full_working_spec_d1 (30 Aug), promoted in from the discussion as the first statement of the equation, on his ruling. d0 rather than renumbering, because dN is an identity and d1/d2 name their numbers in their headers. Current stays d2. Seven informing copies whose sources left for Mass-estimator-testor (or, for the spec, moved into this folder) were dropped to Newton-analysis/_to_delete/informing_copies_2026-10-22/. The next draft is cut in the tester, where the work now lives, and posted back."
  Newton-analysis/_note_mass_estimator_lemmas:
    note: "NOTE FOLDER, created 2026-10-22 by PROMOTION out of _dscn_mass_estimator, on his ruling that a document which expects changes is a draft of a note. Drafts: d1 what_forces_the_chain_to_the_estimator (2 Sept chain audit), d2 mass_estimator_lemmas_2026-09-27, d3 mass_estimator_lemmas_2026-09-29, d4 mass_estimator_lemmas_2026-10-10 (current). The 27 Sept record had declared itself a record whose changed versions arrive as replacements; that supersession chain is the draft line, so its supersedes fields were cleared at promotion. Filenames unchanged. DIRECTION: not yet stated by him; null on the rows and owed, on the precedent of _note_mass_estimator_equation (do not let a provisional wording stand in). The working copy of the current draft lives in Mass-estimator-testor docs/vd-docs-context/; the next draft is cut there and posted back."
  inbox:
    note: "Staging area. 'VD unsorted important' behaves the same way — drop things in, then sort. TRANSFER-BUNDLE RECORD, 2026-08-05 batch (folded in here 2026-08-09 when the emptied inbox/2026-08-05_vd_docs_pass/ folder and its README were deleted by user instruction, retiring that catalog entry): handoff from VD-Newton@059ca8647550a05aeefe96beff7fd8a1707e9207, compared against VD-docs@8e09dbf9d3e521cbe76e36426ead656c04a71650. Standing rule from that README - active copies remain in VD-Newton and are authoritative for entry production, so ingesting a copy here is never grounds to delete or demote the source. COVERAGE CAVEAT preserved: the selected August E10 writing pass cites an E10 d5 packet present in neither VD-Newton nor its Git history, so that batch is NOT a complete packet lineage. Disposition: of 9 listed new files, 4 were already homed and byte-identical (mass d3, triplet d2, E10 _b pass, E11 pass) and their staging copies were deleted per the dedupe rule; 3 decision records (NML2 renumbering, NML3 entry sequence, NML3 contributing-force terminology) were dropped uningested by user instruction and survive only at source; 2 NML3 conceptual notes went to Newton/nml/nml3/; 2 refresh files were overwritten in place in inbox/VD unsorted important/. HANDED TO VD NEWTON - standing record of docs whose custody moved OUT of this repo (user decision; recorded here because the VD-Newton transfer ledger already lives in this note, and because both departures were cited by path from entries that stay). The direction is the reverse of the transfer-bundle traffic above: these are not copies we declined to ingest, they are documents we HELD and gave up, so their catalog entries were RETIRED rather than kept as absences. In both cases the file was removed from disk and the active copy is now VD Newton's, authoritative there; do not re-ingest either without a fresh decision. (1) inbox/DESIGN_2_1_BUG_REPORT_AGGREGATE_VS_MEMBER_CONSTRAINT.md - the confirmed Design 2.1 structural bug report (an aggregate constraint misused as a member constraint; P(x) != Q(E), and an aggregate condition usually fixes a FAMILY of admissible sets rather than one). Held in inbox from 2026-08-12 under the carve-out 'leave Design 2.1 in inbox, you aren't responsible for it'; handed over and removed by the user at some point after that, discovered missing by the 2026-08-14 bijection check and confirmed by the user the same day. (2) Newton/Design 3/FORCE_SUM_IFS_ABSTRACTION_BOUNDARY_DISCOVERY_NOTE.md - the chronological discovery note that derived that bug set-theoretically and produced the candidate Force-Sum triplet {net-force, IFS, V(f)} with the polymorphism result that the Force-Sum law needs only the TYPES and is therefore NOT the IFS-construction law; also the source of the HAND ON THE WALL method note. Sorted into Design 3 on 2026-08-13, deleted 2026-08-14 on user instruction - the user judged the doc as a whole does not fit this repo, while noting that the material in it that DOES fit had already been extracted into a separate note. WHAT SURVIVES HERE, so nothing load-bearing left with them: the extraction is Newton-analysis/action_reaction_asymmetry/ACTION_REACTION_CONSTITUTIVE_ASYMMETRY_SKETCH_d1.md, which carries the sec 7 constitutive-carrier finding; Newton-analysis/canonical_force_orientation/ carries the triplet forward and names the third corner impressed-force; Newton/nml/nml3/NML3_OPEN_PROBLEM_IMPRESSED_FORCE_IDENTITY_ACTION_REACTION_EXCLUSIVITY.md, which the FORCE_SUM note reframed, is unaffected and stays. Both departed files also survive as PRE-NORMALIZATION copies in the bank (_math_originals/2026-08-12/ and /2026-08-13/), which is provenance only, NOT a retained working copy - the normalized versions (86 and 194 edits) are not preserved anywhere, so recovery means re-running tools/normalize_math.py on the banked original. SORTING PASS 2026-08-27, flat files only, at the users instruction (the two subfolders were left untouched). Four files in: why_inertial_mass_must_be_estimated_draft.md was a re-drop of the already-homed d3 of why_mass_estimation, identical bar the math delimiters it had not yet been through - DELETED under the dedupe rule, the normalized branch copy being the keeper, and the first deletion this repo has done in place rather than through _to_delete/ (deletion permission was granted for the session). A Median-Based Estimator for Inertial Mass.md went to the mass_estimator discussion as a record, renamed. scene_trackability_argument_draft.md became the d1 of _note_scene_trackability, renamed. why_mass_must_be_estimated_introduction_d2.md became d4 of _note_why_mass_estimation on the users ruling. ONE HARD-GATE FAILURE, fixed at source and not worked around: a stray closing brace in the median estimators sec 13 boxed likelihood blocked gate2-parse; it was corrected in inbox/ before banking, so the bank copy carries the fix. SORTING PASS 2026-08-29: one flat file, disagreement_rule_mass_estimator_trace.md, straight to the mass_estimator discussion as a record - no rename needed, the name was already house style. Normalized on intake, 91 edits, all gates passed first time. Subfolders left untouched again. SORTING PASS 2026-08-30: one flat file, inertial_mass_estimator_full_working_spec_d1.md, to the mass_estimator discussion. No rename (house style, authored d1 kept), normalization a NO-OP - already in $/$$ form at source, so nothing banked and math_normalized stays null. Subfolders untouched for the fourth pass running. SORTING PASS 2026-09-02, flat files only at his instruction (only the flat ones in inbox), subfolders untouched for the fifth pass running. Three files in: the two 2026-09-02 Claude-authored estimator reviews went to the mass_estimator discussion as records, renamed to drop the date prefixes, with -informing copies into _note_why_mass_estimation on his ruling (Claude had recommended records only); 2026-09-01-function-call-model.md, a VDfirst decision history, went to