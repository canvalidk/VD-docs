    note: "NML3 YOUNGER-STUDENT ADD-ON: SUPPLIED FORCE ACCOUNTS AND NEWTON METERS. Self-described status: mock lesson add-on, extending NML3_YOUNGER_STUDENT_MOCK_LESSON with problem formats that supply force values directly so students can practise force addition before the acting-object machinery opens. Filed FLAT beside the mock lesson by the same user instruction 2026-08-09; the two are companion documents, NOT d1/d2 of one note (the option to merge them into a single dN note was offered and declined). Core claim: NML3 creates a classroom problem type that was unsafe in NML2.1, because a newton meter reading 8 N does not by itself establish that the net force is 8 N - the meter supplies the VALUE OF ONE FORCE CONTRIBUTION, and the net force is the sum of the whole account. Contents: three ways to supply force information (direct values, a story with already-identified forces, a meter reading), a three-stage newton-meter progression (one meter one force; meter plus another force; meter reading equal to net force only by cancellation), a core problem bank (same-direction, opposing, balanced accounts, more than two forces cancelling), two-dimensional addition including the rule that components are not automatically separate forces, the distinctive NML3 ending (one net-force vector has many decompositions; same resultant from different physical accounts; the inverse question fails), three question formats that deliberately skip acting-object machinery, teacher boundary notes, a ten-step mini-sequence, an exit bank, and a compact summary. Two teacher guards are the substance. Sec 21: supplied-force problems must not silently become universal methodology - THIS PROBLEM SUPPLIES THE FORCE ACCOUNT is a classroom convenience, while THE PHYSICAL WORLD ARRIVES WITH A FORCE ACCOUNT ALREADY LABELLED is false, and the lesson should say so out loud. Sec 22: never call a meter reading the net force - the clean first-stage case is that the meter force is the only force in a simplified account, and later examples show a reading that numerically equals net force only because the other contributions cancel. Sec 20 lists the six questions being skipped (why an interaction counts as a force, which acting object produced it, activation condition, force law, action vs reaction member, how completeness was shown) and insists they are SUPPLIED INPUTS rather than omissions. Sorted from inbox 2026-08-09. NOT an excavated note - no dN model applied. Normalization no-op: no math delimiters to convert, nothing banked. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/entry-cut-dependent/ (path field updated; filename untouched, no dN implied by the move). RETIRED AS AUTHORITY, KEPT AS REASONING RECORD - this note was written against the NML3 entry cut that is now being withdrawn (E13-E17 with E16 as the force-member/admission wall and E17 as the IFS/closure wall), so it must not be read as a current target. Retirement follows the E10 packet precedent: superseded as the working account, deliberately kept, and NOT EDITED IN PLACE - no banner was added to the file, the boundary lives in the folder, this catalog note, and the reset record at Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md. Never-archive rule honoured: nothing deleted. OPEN AT SOURCE: whether the new cut reuses E13-E17 or advances to fresh numbers is a VD-Newton decision; until it is settled, bare E13-E17 references in this file name the RETIRED cut. The layer subfolder is NOT a note folder - note_name stays null. FILED 2026-09-07 into the default nml organisation the user is building up (his framing: the note and discussion structures were never meant to be comprehensive, so the nml folders stay exceptions; inside each, the lesson draft becomes a _note_, files that are exercises or exclusively about exercises go to a _dscn_..._exercises discussion, and the records discussing the lesson's content go to a _dscn_..._content discussion). Filed in the content discussion as a