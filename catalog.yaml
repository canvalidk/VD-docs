    note: "AUTHORITY DOCUMENTS AND THE NAME-FREE STRUCTURE OF LANGUAGE. Self-described status: working derivation note, dated 11 August 2026; records what has been earned and what remains provisional, and notes the route begins to RESEMBLE the VD without yet deriving it. Central idea (sec 0): words are arbitrary, but locally changing a word changes what a sentence does; the resolution is that a word can be changed without substantive consequence only under a COMPLETE SUBSTITUTION, where every causally relevant use changes together. A local edit changes which already-installed handle is used; a complete substitution changes the handle assignment while preserving the underlying structure. That raises the note's driving question - if surface names are arbitrary, what stores the choice of one naming arrangement rather than another? - and answers it with a proposed new mathematical object, the AUTHORITY DOCUMENT, which represents a language's arbitrary naming choices. 'Represents' is meant as a matrix represents a linear transformation: a mistaken authority document still represents a naming arrangement even if no community ever realised it (sec 3, representation is not realisation). Sec 4 casts authority documents as GAUGE CHOICES. The note's structural claim: a language with names removed is NOT a simple graph of words with pairwise references - that is too lossy (sec 6) - but a recursively structured collection of whole linguistic contexts, with surface names added afterward by the authority document. Further sections: the name-free substitution test (5), entry numbers not being part of the ontology (7), the role of sets and the treatment of synonyms (8), a worked 'Cat likes to eat fish' example (9) with the substitution mechanics (10) and why it is richer than search-and-replace (11), cycles expected but triplets not yet selected (12), and an emerging correspondence with the VD (13). Secs 14-16 are the honesty ledger - what has been earned, what has NOT, and technical cautions - followed by a compact working model (17), a concrete substitution trace (18), research correspondences to investigate later (19), and a working summary (20). Sorted from inbox 2026-08-11 into a NEW note folder; d1 assigned as the first draft of a new note (no predecessor in Theory). Math-normalized on intake: 135 edits (display-delim-block, inline-delim), all gates passed, no soft flags; original banked at _math_originals/2026-08-11/."
