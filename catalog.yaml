    note: "PARTICIPANT-SYMMETRIC FORCES: OWNER-BLIND ACTIVATION, SAME-KIND RECIPROCITY AND HALF-WEIGHTING - discussion note / candidate theorem, self-labelled d2, dated 2026-08-13, project VD Newton, authored outside this repo. PART I fixes an acting-object interface separating three questions - can x own an instance of kind G, does y satisfy G's activation condition, and what value does x's G return on y - and proposes the typing rule Condition_G: NonOwner -> bool while V_G: Owner x NonOwner -> V_F. The activation condition may query ONLY the prospective non-owner; the value rule may query both. Owner state (mass, charge, current, position) may still change the force VALUE; what is forbidden is letting the owner's identity or type SELECT a different activation condition. That yields a VD-native granularity criterion: if changing the owner requires selecting a different activation condition, the supposed single acting-object kind is reducible and must be split. Atomicity is defined at the smallest level fixing one owner qualification, one owner-blind condition and one value procedure - reciprocity at a family label is not enough. PART II derives the half-weighting: a participant-symmetric implementation gives each participant an instance of the same kind, so target B's IFS holds TWO distinct occurrences of one physical pair interaction (the action of the A-owned G on B, and the reaction of the B-owned G landing back on B), distinct because the acting-object-instance identities differ, G_A vs G_B. Assigning each the full pair-force gives 2F, so each representation carries one half; worked through for Newtonian gravity, near-Earth mg and Coulomb. The 1/2 is NOT a modification of gravity or Coulomb's law - it is the normalization required when one pair interaction is represented from both participant-owned sides. PART III is the OWNER-BLIND PARTICIPANT CLOSURE THEOREM: for an atomic kind with an owner qualification, an owner-blind activation condition, a joint value procedure and same-kind reciprocity, the owner class equals the target class (O_G = T_G =: C_G), hence R_G = C_G x C_G, and A interacts-with B implies A interacts-with A and B interacts-with B at the TYPE level - distinct instances of one type, NOT literal self-force. The product form R_G = O_G x T_G is now DERIVED from the condition's type rather than assumed, which the note states as its core simplification over d1. PART IV is the Red-Blue test: a cross-type-only reciprocal law is logically possible but cannot be one atomic owner-blind same-kind-reciprocal acting-object - it decomposes into red-to-blue and blue-to-red, and a purple-force supertype label does not restore it, because the evaluator still dispatches on the owner. PART V draws the boundary the note is careful about: the theorem proves same-type occurrences are ADMITTED, not that their value is nonzero in any state, and a zero-valued occurrence is not the same as no occurrence - the nothing-versus-zero-something distinction the VD must preserve. A candidate NO-IDENTICALLY-ZERO-BRANCH nondegeneracy principle would close the loophole where a value rule nullifies same-type pairs; it is proposed, explicitly not established. PART VI applies the interface to gravity, point-charge Coulomb and Biot-Savart magnetostatics, the last qualified to COMPLETE CLOSED steady-current systems and explicitly not claimed for arbitrary isolated current elements or time-dependent electromagnetism where field momentum may be essential. PART VII is the join to the constitutive-asymmetry sketch: gravity is NOT a counterexample that destroys constitutive asymmetry, it indicates the VD needs at least TWO acting-object architectures behind one force-value interface - constitutively asymmetric or relational (springs, contacts, constraints, actuators; activation may depend on an owner/non-owner relation, one side computed and the other negated) versus participant-symmetric fundamental (owner-blind, either participant may own, joint value procedure, two-sided representation, half-weighting). Sec 20 declines to propose owner-blind activation as universal, because a spring condition such as 'the non-owner is attached to this spring' refers to the owner. PART VIII proposes a candidate fundamental-force selection principle (atomic kind + owner-blind activation + same-kind reciprocity + optional nondegeneracy) and sharpens rather than answers the question why fundamental kinds should have those properties instead of decomposing into directed source-species mechanisms. PART IX lists what changed from d1: removed the independent source-target factorization assumption, removed the pair-compatibility loophole, added the structural/nonzero distinction, narrowed the scope, unified theorem with half-weighting. PART X is a compact summary plus six open questions, incl. whether owner-blind activation is derivable from a deeper VD rule or is an extra design commitment, and how this branch connects to action/reaction identity and IFS exclusivity. RECORDED EXCEPTION - MISSING d1: VD_PARTICIPANT_SYMMETRIC_FORCES_HALF_WEIGHTING_AND_SOURCE_TARGET_CLOSURE_d1.md is NOT in this repo, and the user confirmed 2026-08-14 that it lives outside it - the same shape as the ENTRY_PACKET_E10 d1 exception. The dN is HONOURED AS THE FILE STATES IT, not inferred; filename untouched, orig_name null. This note folder therefore holds only its current draft, and the never-archive rule is unaffected because d1 was never here. PLACEMENT, USER DECISION 2026-08-14: own note folder in Newton-analysis, beside its sibling Newton-analysis/action_reaction_asymmetry/ACTION_REACTION_CONSTITUTIVE_ASYMMETRY_SKETCH_d1.md, which this file's own header names as a RELATED NOTE (not a predecessor) and which Part VII answers back to. Kept SEPARATE rather than folded into action_reaction_asymmetry precisely because the file names a different d1 as its predecessor - note identity follows the file's own declaration. Filed in Newton-analysis as an output-side finding about mechanics rather than an entry-design decision, the same reason the sketch is in this branch. Hand-off targets when they exist: the impressed-force / V(f) wall, Newton/Design 3/VD_ACTING_OBJECT_INVENTORY_WORKING_NOTE.md, and Newton/nml/nml3/NML3_OPEN_PROBLEM_IMPRESSED_FORCE_IDENTITY_ACTION_REACTION_EXCLUSIVITY.md; no informs-link recorded yet because no receiving note exists. Also bears directly on the sibling note Newton-analysis/canonical_force_orientation/, whose open question 4 - how symmetric mechanisms represent canonical orientation when neither participant is a privileged constitutive carrier - is exactly the case treated here. Normalization was a NO-OP on 2026-08-14: already in $/$$ form at source, no delimiters to convert, nothing banked."
