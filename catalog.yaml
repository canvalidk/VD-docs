    note: "NOT a branch. Repo maintenance tooling + its specs. Currently: math delimiter normalization for VS Code (see tools/MATH_NORMALIZATION_SPEC.md). Files here are catalogued individually; the ORGANIZATION.md note model does not apply to them."
