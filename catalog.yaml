  Newton/nml:
    note: "THE NML FOLDERS ARE A STANDING EXCEPTION to the note/record/discussion shapes, and stay one. His words, 2026-09-06: the note and discussion framework was never meant to be comprehensive - they are just the two first described structures - so an nml folder is not forced into either. INSIDE each nml, a DEFAULT ORGANISATION is being built up (2026-09-07, first pass): (1) _note_<nml>_lesson/ - the lesson draft line, promoted to a note object with its drafts and its workbench (informing copies, drafting brief); created only where a lesson draft exists (nml1, nml2, nml2.1 - not nml2.2, not nml3 yet); (2) _dscn_<nml>_exercises/ - only files that are exercises or exclusively discuss exercises; created empty where nothing qualifies yet; (3) _dscn_<nml>_content/ - the records that discuss what the lesson teaches (working notes, decision records, content specs, conceptual notes). What stays FLAT at nml level: context compilations and informing copies that have no note to serve yet (nml2.2), parent-level records that define a folder's layers (the nml3 reset record), and the ai-context-bundle set slated for deletion. The nml/ root itself holds the pedagogy doctrine, the generic seed set (lesson-design-context/), and the parked Newton-III worksheet. Direction lines on the three notes are PROVISIONAL Claude wording, marked as such on each row; he owes the real ones. UPDATE 2026-09-07, same day: on his instruction the lesson note exists for EVERY nml even when empty (created to write into), so _note_nml2_2_lesson and _note_nml3_lesson were added and nml2.2's workbench material moved in; the default is now written down as Newton/nml/NML_ORGANIZATION.md, provisional, with the scaffold recipe for a future nml4. DIRECTION LINES RULED 2026-09-07: one line for all nml lesson notes, no longer provisional - see any lesson note row or Newton/nml/NML_ORGANIZATION.md."
  Newton/nml/nml2/nml2.2/_note_nml2_2_lesson:
    note: "NOTE FOLDER, created 2026-09-07 EMPTY OF DRAFTS - a note created to write into, on the user's instruction that every nml carries its lesson note from the start. Holds the workbench already: the NML2.2 drafting brief and the four home-left informing copies (one-dimensional redundancy, five-aspect coverage, glass-ball MDP, review corrections), moved in from the flat level. No d1 yet; the drafting brief is what the d1 will be written from. RECORDED EXCEPTION to the _note_/kind:note audit until d1 lands (see Newton/nml/NML_ORGANIZATION.md). DIRECTION (ruled by the user 2026-09-07, the same line on every nml lesson note): A single document giving a teacher, at any level of education from school to university, everything needed to design and deliver this lesson of the Newtonian-mechanics curriculum from the VD entries it covers: what it teaches and in what order, the exercises and demonstrations, the misconceptions to expect, and how the lesson adapts across levels. For nml2 this direction is the one abandoned at the split; for nml2.2 and nml3 it is what the empty note is created to write into."
  Newton/nml/nml3/_note_nml3_lesson:
    note: "NOTE FOLDER, created 2026-09-07 EMPTY - a note created to write into, on the user's instruction that every nml carries its lesson note from the start. .gitkeep only. The working lesson draft (nm_l3_lesson_draft.md) lives in VD-Newton under 08_nm_lesson_drafts/nml3/ and becomes this note's d1 when it comes over through a pass; the content specification and the entry-to-lesson bridge it will be written from are records in _dscn_nml3_content. RECORDED EXCEPTION to the _note_/kind:note audit until then (see Newton/nml/NML_ORGANIZATION.md). DIRECTION (ruled by the user 2026-09-07, the same line on every nml lesson note): A single document giving a teacher, at any level of education from school to university, everything needed to design and deliver this lesson of the Newtonian-mechanics curriculum from the VD entries it covers: what it teaches and in what order, the exercises and demonstrations, the misconceptions to expect, and how the lesson adapts across levels. For nml2 this direction is the one abandoned at the split; for nml2.2 and nml3 it is what the empty note is created to write into. FIVE -INFORMING COPIES ADDED 2026-09-15 (the force-sum quartet and the impressed-force open problem): their homes moved from _dscn_nml3_content to the Criticism History; the copies stock this still-draftless workbench with the conceptual layer the nml3 lesson draft (in VD-Newton) is written from. The recorded audit exemption (no kind: note file yet) stands."
