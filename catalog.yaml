    note: "MASS ESTIMATOR INVESTIGATION: CONDITION ON NEWTON II BEING CORRECT (96 lines, VD-Newton-side, 2026-09-07), received 2026-09-08 from VD-Newton's pass to VD-docs/ staging folder (branch codex/nml2-entry-renumbering @5ae1797, subfolder Mass estimator/); flat in the mass_estimator discussion, kind unstamped. A RECORD OF HIS RULING, quoted verbatim in it: the idea is to see what must be true IF THE LAW IS CORRECT - given anti-aligned readings the only way for them to occur is with error, so we look for the smallest possible error, treating force and acceleration as equal information, and the relationship is assumed not to have failed however unaligned the readings are; it was simply an unlikely thing to happen. CONSEQUENCES it draws: for this investigation Newton II is a premise; incompatibility of the central readings is explained by measurement error; large discrepancy describes the unusual errors the law-constrained account requires; crossing a discrepancy threshold is not a reason to stop conditional reconciliation; the assistant's objection (that an anti-aligned central point outside a threshold set was unwanted) used the older specification's rejection contract, the wrong criterion for this purpose; force and acceleration are treated symmetrically as information under the full declared covariance, which does not equate their units or instruments. THE DISTINCTION IT INSISTS ON: 'smallest possible error' must not silently change the agreed equation - minimizing Q selects a maximum-likelihood reconciliation, the estimator instead weights the whole compatible-pair law and reports E[f]/E[alpha], which need not be a minimum-Q pair or a mode; the tested F = (-sqrt6,0), a = (sqrt6,0) case makes it concrete - infimum discrepancy 6 approached by killing either channel, the ratio-of-means point is 1, and every fixed-mass-1 reconciliation has discrepancy at least 12, so the readout is NOT the least-error reconciliation; if literal least-error selection is a requirement, its relation to the readout is the next behavioural target - no new point equation is selected. For the laboratory: the gate/withholding tests reproduce the old specification and are not acceptance requirements; earlier 'unwanted' interpretations based on crossing 9 are withdrawn; Q and residuals are preserved to describe the error needed, not used to declare failure. CUSTODY: ingested here as a record because it is a conceptual ruling that scopes the spec d1 Part IV (the rejection gate is not part of THIS investigation) and three records cite it as their authority; it also steers VD-Newton's live laboratory (their README points at it), so under the custody rule THEIR COPY STAYS while it steers - both hold, and the return says so; not the numbering-and-naming kind of decision record dropped under the 08-05 rule. Relation to the spec: scoping, UNBOUND per the 08-26 rule - it does not say the spec is wrong, it says the spec's gate answers a different question. Normalization a NO-OP (no math delimiters), nothing banked. KEPT FLAT 2026-09-15 when the rest of the 09-06..09-08 batch went into unsanctioned/: it is HIS ruling quoted verbatim - his content, not the session's. REVIEWED 2026-10-22 in the mass-estimator sweep: confirmed a record under his ruling that VD-docs holds made decisions only. A decision is its subject (thesis, settled correction, proof or ruling), so it stays in the slimmed discussion; kind stamped record."
