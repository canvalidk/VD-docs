    note: "RANDOMNESS AND THE DECLARATIVE BOUNDARY (304 lines, prose plus text and haskell blocks, no math), a VD-Newton-authored analysis note ingested 2026-09-05 as row 6 of their 2026-08-26 pass checklist - the one row that was NOT HELD HERE AT ALL, ruled NOT YET INGESTED on 2026-09-02 with the agreed home Newton-analysis, flat record; brought in today under the standing mandate. Source: their pass to folders/2026-08-26/06_newton_analysis/ copy, byte-identical to 05_design_3_catchup/RANDOMNESS_DECLARATIVE_BOUNDARY.md (which stays there as part of their Design-3 steering pack); the 06_newton_analysis/ original had already been removed on their side after 9e39a35. THE CLAIM: in a declarative theory a value follows from definitions, relations and inputs, and the VD's witness sheets implement exactly that - a demand finds or forces an object witness and reads or fills the slot. A genuinely random outcome does not have that shape: the theory supplies the allowed outcomes and their probabilities, but the individual sampled value is not the determined attribute of any ordinary object witness. It ENTERS AT A BOUNDARY - as pure Haskell cannot roll a die and pushes randomness into IO, a seed, or an explicit distribution. THE CONTRAST that makes it matter for QM: the Newtonian habit - an unexplained force forces an acting-object witness, possibly outside the system, hence an open system - must NOT be applied to a quantum measurement outcome, because inferring a missing object that determined the exact value would change the theory into a hidden-determiner theory. So the trace should mark the random input boundary (DEMAND / EXPAND / BOUNDARY / INPUT / BIND, with source of binding: random boundary, not ordinary object attribute) and bind the value for later reuse, rather than fake a witness sheet with next outcome already sitting in a slot. Working principle: the VD can force object witnesses for object-backed attributes and random boundaries for genuinely random outcomes, and should not confuse the two; classical mechanics fits the declarative picture of a pre-filled world witness sheet, QM is where the object-witness machinery reaches its limit. FILED by the branch line - analysis of any type - as a RECORD, flat at branch level: no correction, supersession or rendition to bind, and no existing discussion it addresses. Nearest neighbour is _dscn_acting_object_primitives, which is precisely about when a force forces a source witness; NOT filed there - a discussion is named at creation with the user, and this note argues a limit of that machinery rather than joining its argument. A sorter's placement, cheap to change. Name kept as received, snake_case already. Normalization 2026-09-05: NO-OP, no delimiters, nothing banked. Custody: ours; their checklist row flips to Delete in the re-issued return. MOVED 2026-09-15 TO THEORY ON USER RULING (2026-09-11: 'why don't you move the randomness thing to VD theory as a record'), executed once the mount came back: Theory/randomness_declarative_boundary/, its own record folder by the Theory convention, kind: record. Why it left Newton-analysis: its claim is about declarative theories and where a random outcome enters them - at an input boundary, not as an attribute of an object witness - with Newton only as the contrast case; the 2026-09-11 entry-structure sweep graded it NONE for entry-structure relevance. Ingested 09-05 with Newton-analysis as the agreed home; that home is superseded by this ruling. Filename unchanged; every citation still resolves."
