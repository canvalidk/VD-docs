    note: "READINGS ARE EVIDENCE, JUST LESS: TEMPERING BY THE OFF-LINE MISFIT, record written by Claude 2026-09-29 (night) at the user request ('Yes go ahead' to the offer of a record, after 'Yes investigate various ways. Try to make sense of it.'), filed via inbox/ under his standing rule into noise_vs_signal/. KIND STAMPED record. TERMINOLOGY RULED TONIGHT: the true errorless vector is the SIGNAL, not a push ('No more using the word push for this. Its signal.'). THREAD (sec 1): measured = signal + error, SNR = |signal|/sigma, beta = omega^2/(1+omega^2) = sin^2 phi (Pythagoras on typical sizes; arcsine = uniform in phi); back-calculated error energy vs declared 2 per 1D reading: ours27 1.93/1.96/2.02, ours28 1.72/1.99/2.65 (null / 1 unit / 3 units) - candidate property, not ruled; the law-averaged true force and true acceleration are not codirectional (1D +1,-1: +0.206 vs -0.206; 2D perpendicular: 25 deg); plug-in beta-hat = max(0, 1-k/H) (MLE, James-Stein) does not remove the sqrt N tilt (16.3 vs 15.6 at N=1000). HIS PROPERTY: aligned + sigma down => signal up; misaligned + sigma down => signal down; ours28 fails the second half (perpendicular pair: signal share 0.99 at sigma 0.1, misfit Q = 100) because its signal share reads only H, never the off-line misfit Q. Not the source of the measured overconfidence (1D has no misalignment; own-world tests have no impossible readings) but a defect of its own: behaviour on readings the premises call impossible, chosen by nobody. HIS RULING: 'The readings are evidence. Just less.' FORCED (sec 2): less = flatter, law prod E_i(m)^g(Q_i) with Q_i = (T_i - |C_i|)/2 m-free; g(0) = 1 by Z (T24, T25 survive, analytic); bounded confidence as sigma -> 0 plus 'evidence, not none' fix the tail as g ~ kappa/Q, limit tilt kappa a/(1-a), a = |C|/T; kappa and the middle shape free (narrow F2 item); scale-free discounts excluded; Student-t excluded by Z, so T23 forces the along-line shape only; inert in 1D. TESTS (2D, ours28 base, six forms): sigma sweep - every kappa/Q form converges (1.50 nats at a = 0.6) where ours28 reaches 60000; own world - forms flat inside the noise band cost 0-6% width, forms discounting at Q ~ nu cost 25-45% and over-cover; rescue - one impossible reading drops ours28 to 8.5% coverage, tempered 91-100%. Does not touch the sqrt N tilt, the readout, 3D, or gating (g > 0 always). PARKED: axis splitting (L8) collides unless g(Q_i) counts as carried shared state; alignment record sec 3 overridden outside the noise band; kappa and middle shape; the back-calculated-error property; the non-codirectional averaged pair; tester presets and 3D. Checks: sandbox numpy/scipy, seeds and grids stated in sec 9; scripts not kept. Math: already in $ form, normalize_math check no-op (no delimiters to convert), KaTeX parse of all 178 segments clean; nothing banked. Scopes the lemma record (L8, L13/T23, L20, R1, T24, T25, O6, O7), the alignment and null-series records, the learned-omega hint record; binds nothing. SHARPENED THE SAME NIGHT (sec 10, 21:13-21:25): the per-reading error-inflation nuisance is CLOSED as a side path (it tempers by misfit at each mass, not at the best mass, and caps aligned readings at half-log growth); HIS RULING one reading is one completeness claim (a k-dim reading declares no signal component outside its declared subspace; that claim imposes k-1 codirectionality conditions whose violation is Q; a 1D reading is a projection, imposes none, cannot be contradicted); so 1 x 3D is not 3 x 1D - same data, different declaration - and the strong form of axis splitting (L8) is FALSE by ruling; nu corrected to k_i - 1 with Q inside the declared subspace (2D k=2 tests unchanged; k=1 reading not tempered, agreeing with T25). Carried to the lemma record in place: L8 rewritten, L21 and T30 added, O3 reopened, O12 and O13 added. PULLED UP 2026-10-22 from noise_vs_signal/ to the flat discussion: its subject is his 29 Sept ruling that misaligned readings are evidence, just less, so it stayed when the working folder around it left for Mass-estimator-testor. Citations of the old subfolder path are stale, recorded here, not rewritten."
