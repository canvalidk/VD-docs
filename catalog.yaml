e drafting side. KIND DELIBERATELY LEFT UNSET, and this is the one open ruling in the move: its d1 is AUTHORED, not assigned at intake - the header reads Status: working note, d1 and orig_name is null, so the file has never been renamed. Grandfathering settles a lone d1 ASSIGNED at intake (it reverts to record) and the successor test settles a chain; neither runs on a lone AUTHORED d1 with no successor. It therefore files as a record BY DEFAULT under the absence rule, exactly as participant_symmetric_forces does, and a later ruling that it is a note would take it back out for one folder op. RESIDUE CARRIED, NOT FIXED: status draft, draft d1, current true, and project nml2.2 recording where the work was done. INFORMING COPY PLACED 2026-08-26 in Newton-analysis/_note_scene_trackability/ at the first stocking of that note, which is created-to-write-into and has no d1 yet. Placed because the directions arrival condition asks for CRITERIA rather than examples and this is the only place coverage exists as criteria - extent, density, balance, distinctiveness, observability - plus the operational audit and the badly-seeded-family argument. Live: sections 0-6. Not load-bearing here: 7-10 industrial grounding and 12-13 lesson-facing. RESIDUE PARTLY CLEARED 2026-09-05 (housekeeping sweep): current set to null - current is a notes-only field marking a CHOSEN draft, and no promotion ever chose one here. draft is KEPT because this dN was AUTHORED (orig_name null or carries it), and neither grandfathering (assigned lone d1) nor the successor test (needs a chain) runs on a lone authored dN; erasing an author's own label is a ruling, not housekeeping. kind stays unset: files as record by default under the absence rule. THE USER'S RULING IS STILL OWED on this row - the one kind of residue the sweep did not close. KIND RULED record BY THE USER, 2026-09-05 ('make all 4 records'), closing the one residue the housekeeping sweep could not: an AUTHORED dN on a lone file, which neither gran