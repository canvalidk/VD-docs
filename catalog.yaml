    note: "NO BORROWING BETWEEN READINGS: OURS28B WITHDRAWN, AND WHAT PER-READING RULES CANNOT DO, record written by Claude 2026-09-28 (late night) at the user request ('Yes please'), filed via inbox/ under his standing rule into ours28b/. SEC 1 HIS RULING (verbatim): 'in general we actually don't want to learn by assuming anything about the upcoming new measurement. So we don't want to claim that the upcoming push will be estimatable.' and 'info can come from any measurement domain in any combination. Like one F = 1, then F = 50000000, then F = 0.00001. So if you learn for example that there is some consistent direction or measurement uncertainty between guesses. We don't want that.' Premise: the definition borrows nothing between readings; readings joined only through the shared mass; per-reading knowledge declared, never learned. SEC 2 EXCLUDES ours28b, a learned population of per-reading scales (middle), a shared direction tensor, any one-scale-per-series; KEEPS ours27 and ours28 (full-covariance form, declared subspace); the strong zero-reading property returns (same principle). Tests (one pair, 95% coverage, 400-500 series): all r=1 N=200 flat/ours28/middle/ours28b 68.4/84.0/96.2/96.4; mixed 90.4/94.8/96.0/95.8; strong 91.8/96.0/96.6/96.4; Codex heterogeneous undeclared N=400 74.5/79.5/80.0/96.0, shared tensor 93.8; declared k=1 95.3/96.3/95.8; appended zero reading moves median 1.78->1.65 (middle), 1.80->1.65 (ours28b), not flat or ours28. SEC 3 restates the per-reading impossibility (OU equation). SEC 4 NEW RESULT: no per-reading rule is never overconfident - S = E[psi U_true] vanishes for a zero-push reading while V > 0 (S within 0.002 of 0 for every law tried); symmetric Beta(a,a) scan: arcsine V/S 5.45/1.90/1.08/0.97 at r=0.5/1/2/3, V(0) 0.42 (flat 3.00); a=0.01 2.75/1.32/1.03/1.00, V(0) 0.02 but keeps 24-46% of a moderate reading; smaller a less overconfident, more wasteful; the shape is a declared trade under the ruling. SEC 5 STANDING: ours28 full-covariance form; premises added (no borrowing; betweenness provisional; own frames and signs; same law same mass); both shapes declared by the uniform-noise-angle rule; own-world calibration; bounded overconfidence below about one noise unit; C3 narrow form stays a premise. SEC 6 ours28b WITHDRAWN; folder kept as the record of why; derivation theorems stand as mathematics. Scripts not kept. Binds nothing. Math in $ form, normalize check no-op, KaTeX 56 segments clean. MOVED 2026-09-29 (night) into noise_vs_signal/ on his instruction (do A and B lists - list A, the noise-vs-signal records); an intra-discussion move, content untouched; relative links to it elsewhere now point one level off (filenames are the identifiers). PULLED UP 2026-10-22 from noise_vs_signal/ours28b/ to the flat discussion: its subject is his 28 Sept no-borrowing ruling (L19), so it stayed when the working folder around it left for Mass-estimator-testor. Citations of the old subfolder path are stale, recorded here, not rewritten."
