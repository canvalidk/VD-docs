    note: "WHY FORCE-SUM MUST BE A TRIPLET WITH THE IFS AND V(f) - active entry-facing discovery note dated 2026-08-18, authored outside this repo against the managed snapshot canvalidk/VD-docs@26265de6e79013bd93b37f9ad278c3dab6ffc11b. RESULT (sec 0): Force-Sum must preserve a three-corner relation among the target's net force, its membership-closed IFS, and the force-vector value V_C(f) of each member f, related by F_net(M|C) = sum over f in IFS of V_C(f) PROVIDED the IFS is independently certified complete. The equation is a CONSTRAINT relation, not only a forward algorithm: with membership closed, net force and the other members' known values determine an otherwise unknown V(f), so V(f) cannot receive its first theoretical meaning in a later force-kind or acting-object triplet. Sec 1 draws four distinctions: member existence is not member value (a magnetic member can be admitted while its law is unknown); membership closure is not value completion; a particular force value is not a force kernel (a kernel is a stable relation over a family of contexts); and closing by exhaustion is not closing by agreement (omitted forces may cancel, so numerical agreement does not prove closure). Sec 2 is the inverse Force-Sum theorem under five stated premises, with the explicit non-claim that a residual warrants a member - membership is a premise established independently. Sec 3 runs magnetic-kernel discovery as the worked case. Sec 4 refutes an expression-valued IFS through three responses (omit / anonymous X / named V(f)), none of which eliminates the member-value corner. Sec 5 shows the one-way pipeline is circular and that whichever module owns the equation IS the Force-Sum triplet regardless of filename - a semantic-placement result, not a ban on compilation strategies. Sec 6 gives the four licensed orientations (forward, inverse, constraint preservation, independent audit); sec 8 the evaluator requirements and seven tests; sec 9 the entry-structure consequence with the headword left open; sec 10 a disciplined nonclaims list. PLACEMENT, USER DECISION 2026-08-20: own note folder in Newton-analysis, NOT Newton/Design 3 and NOT handed out to VD Newton. This follows the 2026-08-14 canonical_force_orientation precedent rather than the fate of its own predecessor: Newton/Design 3/FORCE_SUM_IFS_ABSTRACTION_BOUNDARY_DISCOVERY_NOTE.md was sorted into Design 3 on 2026-08-13 and handed to VD Newton on 2026-08-14 (see the HANDED TO VD NEWTON record in the inbox folder note). The _d1 suffix was ADDED (lossless, orig_name recorded) and the SCREAMING_CASE filename kept. DIRECT KIN: Newton-analysis/canonical_force_orientation/CANONICAL_FORCE_ORIENTATION_CONVENTION_DISCOVERY_2026-08-14_d1.md sec 7 named the third Force-Sum corner impressed-force V(f); this note supplies the argument that the corner must be CO-ADMITTED in Force-Sum rather than defined downstream. Kept a SEPARATE note, not a d2 of it - it does not name that note as a predecessor. RECORDED-NOT-FIXED DEFECTS, both found on intake 2026-08-20: (1) sec 11's local source list cites paths from a folder layout that does not exist in this repo - 07_design_2_1/, 08_nm_lesson_drafts/nml3/, and DESIGN_2_1_ENTRY_STRUCTURE.md (nearest real file: inbox/VD unsorted important/DESIGN_2_1_DRAFT_1_ENTRIES.md); FORCE_SUM_IFS_ABSTRACTION_BOUNDARY_DISCOVERY_NOTE.md survives only as a bank copy at _math_originals/2026-08-13/, and NML3_GENERATOR_NONTERMINATION_CLOSURE_CONSTRAINT_2026-08-08.md is not in this repo at all. The same phantom numbered layout recurs in the sibling static_electric note, so fix at the authoring source rather than per-file. Sec 11's MANAGED paths block is correct and resolves against the pinned commit. (2) OPEN CRITIQUE from the 2026-08-20 reading session, recorded for the next drafting pass, not folded into the file: the note bills sec 3 (magnetic-kernel discovery) as the decisive test, but the load-bearing argument is sec 1.1's distinct-equal-valued members, which is ontic and holds with every kernel already known; sec 3's epistemic framing invites a reframe the multiplicity argument does not. Two arguments are also blurred - multiplicity proves V must exist as a map keyed by f, while sec 5's circularity is what proves it must be co-admitted here. Sec 4.3's named symbol F_B is already committed to in Newton/Design 3/vd_acting_object_architecture_consolidation.md as the constraint case F = C, a fresh symbol indexed to the instance, so every normal force already forces this requirement without any discovery story. Context C is never defined though the inverse theorem needs identical context and frame across F_net and every V_C(g), and constructs are known to be pose-dependent. The closure certificate has no production mechanism (sec 1.2 retires the old bare no-more-acting-objects signal without replacing it) yet everything in secs 2-3 is conditional on it. Sec 10 disclaims that the global identity criterion for force occurrences is settled while sec 1.1 depends on f1 != f2 being determinate. Corollary worth claiming: the one-unknown premise plus a value-complete remainder means the inverse route can expose only ONE unknown kernel at a time, parasitic on an otherwise fully known account. Math normalization on intake 2026-08-20 was a NO-OP - already in $/$$ form at source, no delimiters to convert, nothing banked. GROUPED into Newton-analysis/vd_analysis/ on 2026-08-20 and RETURNED to this path the SAME DAY, when the user retracted the premise behind that folder - see the Newton-analysis folder note. Net effect on this file: none. Path, folder, filename and every other field are as they were before that pass. FILED 2026-08-25 into Newton-analysis/_dscn_entry_structure/, FLAT: no correction, superseded version or rendition to bind, so the record's own folder bound nothing and went to _to_delete/empty_folders/. Path prefix only - filename, note_name and role untouched, and every citation by filename still resolves. Intra-branch move, so the bank -> normalize -> gates pipeline does not apply. RECORDED SHORTFALL, carried not fixed: the draft/current fields below are pre-2026-08-20 residue that the kind model retires for records. On the standing sweep list. KIND RULED record, 2026-09-05, by GRANDFATHERING (housekeeping sweep under the user's standing mandate): the dN was ASSIGNED AT INTAKE (orig_name carries no dN) and no one ever argued this was a note, so the ratified rule reverts it to record; draft and current cleared. The filename keeps its dN as an identity. Reversible in the catalog if the user recognises a direction later. SUPERSEDED 2026-09-05 by FORCE_SUM_TRIPLET_IFS_VALUE_RELATIONAL_NECESSITY_2026-08-18.md, the 2026-08-26 VD-Newton version ingested under row 12 of their pass checklist (agreed 2026-09-02, done today under the standing mandate): retitled, a notation-translation block added, the three corners restated as net-force / interaction-set / impressed-force, and sec 9's open headword question closed. superseded_by relation SET. This file gains a folder, force_sum_member_value/ inside the discussion, at its first attachment per the depth rule - path prefix only, filename untouched. Kept, never archived: read the successor, or this file for the IFS / V(f) wording the successor's translation block refers back to. The OPEN CRITIQUE recorded above applies to the successor unchanged."
