    note: "STATIC ELECTRIC ACTION WITHOUT ELECTRIC SOURCE CHARGE - Newton analysis note dated 2026-08-19, self-labelled candidate foundations result and explicitly NOT YET A NEWTON ENTRY, authored outside this repo. THE CASE (sec 2): an opaque, non-shielding tube containing a steady conveyor of closely spaced permanent magnets; in the continuum limit the internal magnetic-moment distribution is stationary in tube coordinates though its constituents move. Relativistic EM predicts such a steady moment flow produces a stationary exterior electric field, so a charge at rest relative to the tube feels a static charge-linear force. The physical effect is NOT new; the acting-object consequence is the claimed result. THE RESULT (sec 1): a stationary electric force on charge does not entail an electric-charge source, so a Galilean Newtonian EM statics containing only Coulomb, Ampere and Biot-Savart acting objects is not acting-object complete. The crack is treating 'source charge implies Coulomb action' as licensing its converse. Sec 3 types the provisional tube-static-electric acting object (carrier, target slot, source-side construct, operating construct, output occurrence) and separates the field profile from the impressed-force occurrence: the acting object WARRANTS the occurrence, V_C(f) is the occurrence's value, and the tube-owned E-profile is a CONSTRUCT used by the value evaluator - definitionally locked, not a free-standing scenario object. Sec 4 recovers the member value by inverse Force-Sum over controlled contexts and earns the target-side evaluator V = q R_T E(xi), optionally a body-fixed potential if closed-loop work measurements establish conservativity; no half weighting, the tube being one constitutive carrier. Sec 5 proves Galilean covariance via the tube-relative body coordinate. Sec 6 argues it belongs to EM STATICS on the magnetostatic precedent that statics means macroscopic stationarity, not absence of microscopic motion, and warns against defining EM statics circularly as Coulomb plus magnetostatics. Secs 7-8 give the no-reduction arguments; sec 9 types current and magnetic-moment flow as carrier-attached constructs (the rank-two K_m); sec 10 states the incompleteness proposition with a proof sketch; sec 11 insists the full-EM explanation is not a Newtonian reduction because primitiveness and reducibility are theory-relative; sec 12 separates what is and is not new and declines to claim external novelty; sec 13 lists eight items of open work. PLACEMENT, USER DECISION 2026-08-20: own note folder in Newton-analysis, honouring the file's own header self-declaration ('Newton analysis note'), and filed as an output-side finding about mechanics rather than an entry-design decision - the same reason the action_reaction sketch sits in this branch. Kept a SEPARATE note from Newton-analysis/primitive_current_no_go/, which arrived the next day out of the same discussion: note identity follows the file's own declaration (2026-08-14 ruling) and the no-go note declares no draft relation to this one. DEPENDS ON: Newton-analysis/force_sum_member_value/ for the independent-closure requirement and the inverse recovery of an already warranted member value (sec 4 uses both), and on Newton/Design 3/vd_acting_object_architecture_consolidation.md for the slot/construct/parameter distinction. Its sec 7 is the first physics application of that note's occurrence-versus-value separation. No informs-links recorded - no receiving note exists. RECORDED-NOT-FIXED DEFECT: sec 14's local source list cites 07_design_2_1/FORCE_SUM_TRIPLET_IFS_VALUE_RELATIONAL_NECESSITY_2026-08-18.md and 04_entry_design_guides/vd_spring_acting_object_working_brief_v1.md - the same phantom numbered layout as the force_sum note's sec 11. There are no numbered folders in this repo and NO spring working brief exists anywhere in it, which matters because sec 4's no-half-weighting claim is sourced to that missing brief; the real half-weighting authority is Newton-analysis/participant_symmetric_forces/VD_PARTICIPANT_SYMMETRIC_FORCES_OWNER_BLIND_ACTIVATION_AND_HALF_WEIGHTING_d2.md and the claim should be re-checked against it rather than assumed to transfer. OPEN CRITIQUE from the 2026-08-20 reading session, recorded not folded in: (1) sec 7 refutes only the FICTITIOUS-charge reduction; the stronger opponent posits a real lab-frame bound surface charge from moving magnetization and adds a source-generation law feeding ordinary Coulomb, which satisfies premise 2 on its own terms and survives the Galilean test since u_rel is relational. Answering it needs the reduction criterion that sec 13 item 5 lists as UNFORMALIZED - so the proposition ends in QED while its discriminating notion is open. (2) The user's 2026-08-20 reductio settles the direction of the answer: the objection maps onto Biot-Savart (a current loop is exteriorly equivalent to a dipole sheet, so the same move would dissolve current as a primitive source kind), which nobody accepts - so the wire is a PRECEDENT for this note's principle, not a counterexample, and the criterion should be derived from it. Candidate criterion: a source kind is primitive when its slot has warrants INDEPENDENT of the force profile it generates, independence meaning warranted by a different law in the already-admitted set. Current qualifies (charge transport, electrode chemistry, Joule heating, force in an external field - three separate law-houses); a charge posited for the tube does not, its only warrant being the field itself. Sec 9's black-box discipline already blocks the over-generation worry. (3) sec 13 item 2 (reciprocity) should be promoted out of open work - failure there breaks E31-E33 outright, which is architecture-level rather than EM-level. (4) The warrant against charge is positive evidence of absence (the tube is inspectable) rather than missing witness; sec 2 states the fact without leaning on it. (5) The Sun-Guo-Wang spin-current-induced-field result is the empirical keystone of sec 11 and may have drawn subsequent comment; verify before it carries this weight. (6) Framing: the title sells an EM claim that physicists will answer with 'model it with bound charge'; what survives is a VD result about source-slot witnesses and kind stability, which sec 12 half-concedes by pointing at foundations as the venue. Math-normalized on intake 2026-08-20: 72 edits [display-delim-block, inline-delim], no soft flags, all four hard gates passed; original banked at _math_originals/2026-08-20/inbox/. FILED 2026-08-25 into Newton-analysis/_dscn_acting_object_primitives/, FLAT: this record has no correction, superseded version or rendition, so its folder bound nothing and the depth amendment in ORGANIZATION.md's Discussions section applies. Moved from Newton-analysis/static_electric_acting_object/, whose now-empty directory the mount refuses to rmdir and which will not reach the remote (git does not track empty directories; the 2026-08-20 vd_analysis case is the precedent). Filename, note_name and project are untouched - the object keeps its name, the folder was the cosmetic part. Intra-branch move, so the bank -> normalize -> gates pipeline does not apply; it governs files LEAVING inbox/. The filing argument and the standing WEAK evidence grade are in the discussion's folder note. RECORDED SHORTFALL, surfaced at this touch and deliberately NOT fixed: this entry still carries draft: d1 and current: true, which the 2026-08-20 kind model retires for records - a record takes no dN and no current. That kind pass was deliberately limited to three cases and never reached this file. Recorded rather than stripped, since retracting a draft claim is the user's call. KIND RULED record, 2026-09-05, by GRANDFATHERING (housekeeping sweep under the user's standing mandate): the dN was ASSIGNED AT INTAKE (orig_name carries no dN) and no one ever argued this was a note, so the ratified rule reverts it to record; draft and current cleared. The filename keeps its dN as an identity. Reversible in the catalog if the user recognises a direction later."
