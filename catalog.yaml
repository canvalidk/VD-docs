  - path: "Newton-analysis/action_reaction_asymmetry/ACTION_REACTION_CONSTITUTIVE_ASYMMETRY_SKETCH_d1.md"
    type: md
    role: primary
    tags: [sketch, action-reaction, constitutive-carrier, acting-object, third-law, asymmetry]
    project: action_reaction_asymmetry
    status: sketch
    dup_group: null
