    note: "NML3 ENTRY-TO-LESSON BRIDGE, d1 (self-declared in the file header - the dN was authored, not assigned here). Self-described purpose: turn the force-sum constraints into entry packets, a content specification, and then a timed lesson draft without silently inventing the missing warrant or closure machinery. Its diagnosis is that NML3 has NOT stalled on ideas - the law contract is largely settled - but on the missing OPERATIONAL MIDDLE LAYER between conceptual constraints and lesson prose (abstract trace/state machine, content specification, exercise and evaluator bank, timed plan, residual wording); the vagueness came from nm_l3_lesson_draft.md jumping straight from notes to seven lesson sections. Two substantive proposals. (1) The STRUCTURAL REPAIR of sec 3: assign one outward wall to each winter word - E16 becomes the force-member wall (generator: admission of one independently warranted, uniquely keyed member, the 'only warranted members' half) and E17 the interacting-forces-set wall (closer: independent exhaustion, the 'all warranted members' half). (2) Sec 9 sets ENTRY-PACKET TARGETS for E13 to E17 as IRIL-allowed / IRIL-blocked / IRIE slots rather than polished sentences, with E13 (net-force-material-object, sum after closure) written LAST. Working title 'NML3: Account Before Addition'; student handle 'Earn the members. Use each source key once. Prove there are no more. Then add.'; signature question is the partial account that already matches the measured net force with one candidate unresolved - answer NO, a zero residual does not prove exhaustion - and its halt case is called the NML3 equivalent of NML2.1's expired mass-address halt. Sec 10 narrows six remaining architectural decisions: final force-member headword left open among contributing-force / warranted-force / other and to be judged against installed behaviour; interacting-forces-set kept, with list-like behaviour assigned to the ordered discovery trace rather than the completed object; the acting-object key needing an entry-order audit (opaque witness key vs prior scaffold headword vs reordering) to avoid a forward dependency in E16; warrant interface specified while concrete instantiation defers to the later acting-object and force-law blocks; finite accounts adopted for the first lesson; one context token C expanded only at packet-writing time. Sec 11 gives a 12-step production order in which writing the content specification is step 7 - so the CONTENT_SPECIFICATION_d1 filed alongside it is the DOWNSTREAM product of this bridge, not a draft of it; the two are separate objects, and neither carries a note_name. Step 9 of that order leaves open whether the classroom material is one long lesson or an NML3.1/NML3.2 split, which is the unresolved question the younger-student mock lesson also touches. Sorted from inbox 2026-08-09. NOT an excavated note - the self-declared d1 is honoured as given and no dN model was imposed. Normalization no-op: no math delimiters to convert, nothing banked. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/entry-cut-dependent/ (path field updated; filename untouched, no dN implied by the move). RETIRED AS AUTHORITY, KEPT AS REASONING RECORD - this note was written against the NML3 entry cut that is now being withdrawn (E13-E17 with E16 as the force-member/admission wall and E17 as the IFS/closure wall), so it must not be read as a current target. Retirement follows the E10 packet precedent: superseded as the working account, deliberately kept, and NOT EDITED IN PLACE - no banner was added to the file, the boundary lives in the folder, this catalog note, and the reset record at Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md. Never-archive rule honoured: nothing deleted. OPEN AT SOURCE: whether the new cut reuses E13-E17 or advances to fresh numbers is a VD-Newton decision; until it is settled, bare E13-E17 references in this file name the RETIRED cut. The layer subfolder is NOT a note folder - note_