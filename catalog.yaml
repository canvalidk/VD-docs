    note: "WHAT STARTS THE SNOWBALL TO RELATIVITY, record written by Claude 2026-11-02 at the user request ('just put these together in their own record in NM analysis right? Likely these ideas stand on their own anyways'), from the 2 November conversation; committed from the cloud session (his other computer, so straight to GitHub), passed through inbox/ intake (normalizer check a no-op, all 68 math spans parse under KaTeX) and sorted in the same commit. CONTENT: the Galilean/relativistic divide stated as a condition on state (C1 current state, C2 configuration only, C3 Galilean covariance; Currie-Jordan-Sudarshan no-interaction theorem); Newtonian mechanics as theorems of a translation-invariant U(Q); his claim that the static EM forces alone would raise no paradoxes leading to relativity, held in part and sharpened: instantaneous Galilean theories with present-state energy are paradox-free, and the snowball starts with finite propagation, not induction; Weber as the counterexample (Galilean, instantaneous, derives Faraday induction and Ampere's force); the C2-versus-NM relative-velocity scope reconciliation owed; input to the open Ampere-vs-Grassmann ruling of NM magnetism (C1 + strong third law exclude Grassmann; Ampere is the k = -1 member Weber produces) - offered, ruling his; the magnetic-moment-flow acting object of STATIC_ELECTRIC_ACTING_OBJECT_RESULT_2026-08-19_d1 read as the boundary marker where Galilean statics meets induction. FILED INTO THIS DISCUSSION because it addresses both 08-19 records: sec 8 records that the 2 November value-equivalence finding (moving-magnet field = electric dipole field) does not contradict the 08-19 no-reduction result, which concerns acting-object source warrant, and lists the 08-19 open-work items (1 kernel, 3 static domain, 6 Galilean-EM comparison) that the 2 November work bears on. Binds nothing (scoping). Full working lives in a Claude doc linked from the record. REVISED IN PLACE THE SAME DAY on his instruction ('just fix today's version'): the magnetic-moment-flow strength K now uses the magnets' velocity relative to the device, u_rel, not their lab velocity, which was not Galilean-invariant - the point the 08-19 record's sec 5 already makes. SECOND SAME-DAY ADDITION, his yes: sec 8 now records that the moment-flow kernel is certified at element level with no free parameter (moment-flow elements can be isolated in a stationary loop, unlike current elements, so no kappa analogue) and that its couplings to currents and magnets are zero in static configurations - in value it differs from charges nowhere; the 08-19 acting-object distinction is what remains. WORKINGS APPENDIX BEGUN 2026-11-02 on his instruction ('Just do today's record in the repo. Make a start'): W1 the moment-tensor transformation (P = u x M_lab / c^2 exactly; a single moving magnet has p = u x m / c^2 with NO gamma - the gamma first written in sec 8 was wrong and is fixed), W2 the pure moment flow has B = 0 exactly and zero static couplings both ways, W3 the uniqueness of the moment-flow element law, W4 the element force laws. W4 CORRECTS SEC 6: Ampere's element force has nonzero curl at fixed orientations, so it has no configuration energy either; under primitive currents + C1 + strong third law the selected element law is NEUMANN (kappa = +1), not Ampere - the input this row first recorded ('Ampere is the k = -1 member Weber produces') is retracted in the record itself, which says so. Still unwritten, listed in the appendix: the reduction-result potential lemma, the Helmholtz two-term derivation, the sec 2 theorems in full, the Lk mod q symmetry step. COMPLETED THE SAME EVENING ('keep going'): W5 the sec 2 consequences in full (momentum, weak and strong third law, angular momentum with orientation torques, boosts, energy), W6 the Helmholtz two-term form (isotropic tensor + parity + 1/R, and the closed-loop identity), W7 the potential lemma behind value equivalence (cutoff construction; scope: value only, assumes