    note: "NML3 FORCE-SUM VOCABULARY RESERVOIR. Self-described status: broad vocabulary collection. Purpose: collect words and phrases that already carry useful residual meaning around the force-sum law WITHOUT yet deciding which should become formal VD headwords. Deliberately keeps a wide net - overlapping terms, old-fashioned terms, modern pedagogical language, and terms that are dangerous because they carry multiple meanings are all retained; the aim is to preserve available semantic material, not to choose terminology. 21 sections. Secs 1-17 are the collection proper, grouped by the job the word does: interaction/source/provenance; membership, belonging and admission; force-instance and individuality language; collections, accounts and inventories; target and boundary language; composition and combination; result/resultant/net-effect; equivalence without identity; resolution, decomposition and the DANGEROUS INVERSE DIRECTION; cancellation, balance and zero-resultant; completeness and closure; search, discovery and generation; residual and mismatch; value, magnitude and representation; measurement and supplied-information; diagram and modelling; and historical Newtonian wording worth preserving. Sec 18 shortlists words with especially strong residual potential, split by side (source/existence: interaction, source, origin, exerted on, acting on, impressed on, attached, contribution, constituent, individual force; plus membership, composition, and closure sides). Sec 19 quarantines semantically dangerous words. Sec 20 gives candidate phrase contrasts for future residual writing. Sec 21 fixes the document's role: it functions as a WORD RESERVOIR, and a later pass interrogates each promising term with a fixed five-question probe (what reaction is already installed by this word; what part of NML3 could use that reaction; what misleading baggage does it carry; is the reaction culture-installed strongly enough to rely on in a residual; would it serve better as headword, residual phrase, exercise label, teacher-facing term, or anti-misconception contrast). Explicit: NO TERMINOLOGY DECISION IS IMPLIED BY INCLUSION. Directly serves the residual layer that [[entry_writing_guide_auditable_compositions]] governs - the guide's rule is that residuals may only be composed from already-installed reactions, and this reservoir is the stock of candidates. Sorted from inbox 2026-08-12. NOT an excavated note - no dN model applied, filed flat beside the other NML3 documents. Normalization no-op: no math delimiters to convert, nothing banked. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/conceptual/ (path field updated; filename untouched, no dN implied by the move). This note is ENTRY-CUT-INDEPENDENT and is NOT retired by the reset - its content does not depend on which entries exist or which wall each carries, so a re-cut of the NML3 entry structure leaves it standing as live authority and as input to the new cut. Boundary record: Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md. The layer subfolder is NOT a note folder - note_name stays null."
