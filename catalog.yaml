    note: "ENTRY WRITING PASS, E10 `inertial-mass-material-object` (2026-08-01, 475 lines) — second pass at this corner, written by Claude at Can's request as an independent drafting pass against packet d5. REVISED TWICE AFTER REVIEW the same day, both times on Can's diagnosis; secs 3 (substitution) and 4 (the leading conditional) are the corrections and both CHANGED THE ANSWER rather than the presentation. SETTLES ON 42 WORDS against candidate A's 137: the 2026-07-25 pass's fourteen-word sentence UNCHANGED, plus 'If the two are nonzero and codirectional, it is the net-force magnitude divided by the acceleration magnitude. Otherwise they do not determine it; estimate them and it together.' THE SUBSTITUTION TEST (Can, 2026-08-01): an entry is substituted into, so the test is how the definiens reads with its slots FILLED — 'the positive scalar that multiplies (10,0,0) to give (5,0,1)'. Two consequences. (1) SUBSTITUTION DESTROYS PROVENANCE AND PRESERVES TYPE: a bare value does not say whether it was measured or given, so a provenance-keyed branch cannot fire at the moment it is needed, while codirectionality is a property OF THE VALUES and survives intact. Hence the type check must be codirectionality — d5 DECISION 1 DOES NOT SURVIVE, and d5 decision 2 MOVES to the evaluator (which does still hold the provenance slot), where it belongs anyway since its content is 'do not lose the uncertainty', a retention requirement. (2) The reader reaches 'no such scalar' WHILE PARSING sentence one, so sentence two must CORRECT THE VERDICT rather than route by situation — which is what 'do not determine it' is for and why an instruction to estimate cannot carry it alone. TWO GENERAL RULES EXTRACTED, both flagged for CORE and neither about mass: (i) an entry may only branch on what survives substitution — properties of the values survive, facts about their provenance do not, so the whole exact/measured architecture in the d3-d5 line should be re-read against it (right about the world, wrong about which layer can see it); (ii) leading versus trailing domain conditions are NOT equivalent under skimming, which if right is a general entry-writing constraint belonging beside the residual/auditable split in the E8 pass rather than being rediscovered per corner. Also raises for ruling: whether anaphoric SHORT forms (`the net-force magnitude`, not `its net-force-material-object`) count as headword mentions and therefore substitute — the pass assumes not, which is the same reading that lets `them` and `it` work; the trace is correct either way but legibility differs. THE NEW ARGUMENT (sec 2): the 7/25 pass's own sec 4 definite-description table is a table over the OBJECT'S quantities, and read literally on two measurement results — generically non-codirectional, and by that pass's own sec 11.1 identity any direction mismatch is an EXISTENCE failure — it returns `contradiction` for essentially every real trial. So the fourteen words do not merely omit measurement; they tell an experimenter their object has no mass, and they do it SILENTLY because a failed definite description does not announce which presupposition broke. The hole is SEMANTIC not procedural: sentence one's possessives denote the object's actual quantities and a measurement result is evidence about one. Sec 3 argues the 7/25 sec 5.3 IRIL conclusion is NOT simply superseded as d5 claims — 5.3's subject was the INVERSION (procedural, belongs in the IRIL, undisturbed), and it could not have reached the measured case since the observation/measurement/joint-estimate distinction postdates it; that pass's own sec 5.4 already licensed 'a second sentence alongside the relation, never in place of it', which is the shape adopted. THREE CUTS FROM CANDIDATE A, each argued from a result the corpus already owns: the exact-branch procedure is REDUNDANT with sentence one (every outcome is a row of the sec 4 table, generated by `the` and `positive`) and reintroduces the magnitude form that 7/25 sec 11.5 shows cannot detect the law's violation; the retention clauses are the OTHER THEOREM, migrating into the definiens in the very packet that diagnoses the migration; the circularity clause answers 'what is this result worth', not 'what is inertial mass'. THE LEADING CONDITIONAL (sec 4, Can's second correction — 'try using the words if, division, magnitude'): the explicit magnitude form goes BACK IN, which looks like a reversal of 7/25 sec 5.3 and is actually a repair of the PLACEMENT it objected to. That pass rejected candidate C because a TRAILING 'when both vectors are nonzero and point in the same direction' is a subordinate clause a reader can drop — skim the tail and a complete, grammatical, WRONG instruction remains. A LEADING 'If' cannot be skimmed the same way: drop it and what remains is not a sentence the reader was given. The condition GOVERNS rather than qualifies, so grammar does the enforcing — the same mechanism the E8 pass credits for `its` and the 7/25 pass for `the`. `nonzero` is in the conditional specifically to close the 0/0 case 7/25 sec 11.5 raises against ratio forms; and the ratio SUPPLEMENTS the relation rather than replacing it, so sec 11.5's second objection (any two non-parallel vectors divide cleanly) is met by sentence one still failing to denote. Sec 3.2 adds that the substitution test ALSO undercuts siting the inversion in the IRIL: that works for an automated evaluator running IRIL clauses as steps, but not for a human reader in NML2.1 who has the substituted string and not the IRIL. SEC 6, 'THE GENERATOR, STATED ONCE': this pass removed three clauses for being logically entailed (`codirectional`, the magnitude form, the branch itself) and each removal made the entry a tighter STATEMENT and a worse TRIGGER — entailment is not noticing, derivability is not performance, and a reader's situation is not visible to the string once values are in it. Two of the three restored. Also QUALIFIES the 7/25 sec 4 virtue ('parallelism is never mentioned'): elegance conditional on inputs being exact is not elegance for the one corner whose inputs generally are not. Sec 5 keeps the cuts made for the right reason — retention and circularity belong to ANOTHER ARGUMENT, not to this entry — and sec 5.1 marks the distinction between the two kinds of cut explicitly. Seven-entry drafting record with three substitution checks and a minimality check; D5 is candidate C restated, recorded because it is what makes the leading/trailing distinction visible. RAISES A DEPENDENCY (sec 8, parallel to 7/25 sec 5.4): the shorter string is only safe while the evaluator implements retention — if those fields are ever dropped from JointNewtonIIFitResult the clause must grow back. NEW OPEN QUESTION: E8 and E9 are one sentence, this is two, and the second is a different KIND of sentence (what to do when access to the terms is indirect); every entry whose inputs are ever measured has the same exposure, so the house may have acquired a second sentence slot whose rules are undecided — flagged as a CORE question, not a Newton one. Also notes sentence two pays NO suffix tax (it refers back with `these`/`them`), narrowing d5 Q2: the tax is per MENTION, and an entry can grow without growing its mention count. Normalization a no-op, nothing banked."
