    orig_name: "scene_trackability_argument_draft.md"
    informs: null
    direction: "Newtonian mechanics ASSUMES particle tracks - every r(t) is the trajectory OF something, and silently cashes the claim that some point was followable from one moment to the next. This note takes that assumption as its subject: HOW TRACKS ARE PRODUCED, AND WHERE THEIR PRODUCTION FAILS. Production - what a tracker is given, what it does, what it can recover. Failure - the assumption does not hold uniformly across the scene; trackability SORTS material rather than describing all of it, and identifying how that divide works, sharp or graded, is what the note is aimed at. FAILURE MARKS THE END OF THE NOTES JURISDICTION, NOT A FURTHER TOPIC WITHIN IT: it establishes where tracks stop being available and hands custody on WITHOUT NAMING WHO TAKES IT, because the apparatus for answering that does not exist this early. Everything here stands before NML2 and depends on nothing downstream. ARRIVAL is when both halves are CRITERIA - what produces a track, and what puts material beyond the reach of one - rather than examples. Agreed with the user 2026-08-26; carried on the folder note until this file existed, moved onto a file row at the arrival of d1, 2026-08-27."
    note: "THE NOTES d1 - the first draft of scene_trackability, authored by the user 2026-08-27 and sorted in from inbox/ the same morning. THE WORKBENCH WORKED AND THE FILE SAYS SO: its sec 16 Source map credits exactly the five -informing copies stocked here on 2026-08-26, claim by claim - d4 for scene-before-bodies, the tracker procedure, the tolerance floor and the two residues; coverage_five_aspects for the five coverage aspects and adversarial densification; the spine for the jurisdictional line; the corrections note for the owed frame-ordering sentence and the warning not to forward-reference mass; identifiability_and_fluid_representation for the graded, interval-and-tolerance-indexed sort and the fluid counterexample to a binary one. That is what stocking a note created-to-write-into is for, and this is the first time the device has been seen paying off end to end. IT OBEYS THE JURISDICTION RULING WITHOUT BEING TOLD: sec 11 hands off to redundancy and lumping and lists what trackability does not determine (bundle boundaries, particle count, cohesion, mass address, mass value, centre of mass, force account), and sec 13 explicitly disclaims that non-trackable material can already be routed through acting-object machinery at this address, calling the stronger conjecture something that needs apparatus unavailable in this note. That is the corollary the user struck on 2026-08-26, correctly kept out. ARRIVAL NOT YET REACHED by the directions own test - it arrives when both halves are CRITERIA rather than examples, and sec 15 still carries six open questions, including what quantity grades a re-identification claim and how the trackability horizon decomposes. So d1 is current by default, not by preference. THE KNOWN AUDIT FAILURE IS OVER HERE: this folder now holds a kind: note file, so the standing assertion that every _note_ folder does is satisfied again; _note_mass_address_lumping remains the one deliberate exception. RENAMED at intake from 'scene_trackability_argument_draft.md'; orig_name recorded. NO dN IN THE FILENAME, deliberately: the 2026-08-26 draft sweep found that every _dN in the tracks_to_particles chain was ASSIGNED at intake and none authored, which is what forced grandfathering, so the number is left where it belongs - the catalog. NORMALIZATION WAS A NO-OP: the file carries no LaTeX math delimiters at all, nothing was banked, math_normalized stays null."
