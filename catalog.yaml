    note: "WHAT FORCES THE RATIO-OF-MEANS READOUT (253 lines), Claude-authored 2026-09-02 in answer to his ask - prove the form of m_hat = fbar/alphabar or find forcing arguments - and sorted in the same day on his ruling; the file itself says kind unset, filing is the authors call. RESULT: the form is right, the reason the spec gives for it is not. Reciprocal invariance (spec sec 11) is satisfied by every reasonable candidate - the induced-mass median, every quantile, the geometric mean, the RMS ratio, the profile minimiser, any T(f)/T(alpha) - so it selects nothing. What selects fbar/alphabar is that the readout is LINEAR in the latent magnitudes, and linearity is forced by requiring the estimator to compose as Newtonian mass composes: (L) mass adds under lumping at common acceleration, which forces linearity in f; (R) inverse mass adds under common force, which forces linearity in alpha. Each law kills what the other lets through (m-regression passes only L, mu-regression only R, median/geo/RMS neither, verified by Monte Carlo on skewed coupled laws); then units covariance plus exact consistency fix the form and reciprocity follows as a COROLLARY. The premise is VD-internal, not statistical: the estimator IS the definition, so it must compose as the definiendum composes or E10 and the lumping entry define different words. IDENTITY: m_hat = E[alpha m]/E[alpha], the leverage-weighted posterior mean; k=1 is the unique reciprocal power weight, k=2 reproduces Deming asymmetry. TWO NEW FINDINGS: the flat (f,alpha) measure is symmetric in m and mu only for N=1 - for N common-mass trials the two flat measures differ by m^(2N-2), so Level 3 cannot inherit sec 11 from measure symmetry; and the gate statistic Q_min is chi-square with d-1 dof at interior fits, so Q_crit = 9 is a 0.3 percent false-rejection threshold in 2D and 1.1 percent in 3D, closing one sec 33 item. Also recorded: the cone-volume measure changes readouts under 5 percent, the log-flat measure is excluded; all the specs closed forms reproduced (sec 17 0.160, sec 18 125.3, sec 21 4.0). CORRECTIONS OWED (sec 8): spec sec 11 requirement to consequence; sec 23s reasons target the old excitation-model median; sec 32 items 7-8 are forced given L and R; why_the_estimator_is_the_definition Result 1 counts roots not minima (for anti-aligned data the positive Deming root is the profile MAXIMUM). NONE BOUND: all scoping under his 08-26 rule, offered not placed. Renamed at intake from the dated filename because its companion cites it by the undated name; the one cheap rename moment. Normalization a NO-OP - already in $/$$ form, nothing banked. Companion: what_forces_the_chain_to_the_estimator, same day. REVIEWED 2026-10-22 in the mass-estimator sweep: stays as a record, a standing finding rather than an early draft of the lemma line (his ruling that day). Its successor, mass_readout_composition_uniqueness_2026-09-06, sits beside it."
