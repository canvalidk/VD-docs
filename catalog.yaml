    note: "LAW CORNERS AND THE ORIENTATION TRAP - record of a 2026-10-19 conversation (Claude app, mobile), written into inbox/ at the user's request ('Ye go for it') and sorted 2026-10-19 under the 2026-09-24 standing rule. Attribution is marked inline: the spine is his [Can], worked mappings and objections are Claude's [Claude] and were offered, not ruled on; literature references NOT checked against primary sources. THE IDEA (his): each triplet entry is a different statement of the law - a law has three corners, so it can be stated three ways, one oriented around each headword; a corner need not carry the whole law's information content but can. This explains why the third law of thermodynamics has three standard statements (Nernst, Planck, unattainability). Mystery is a dropped node: 'energy is conserved' feels mysterious because the full statement ('in an energetically closed system') is not said - the lossy-readout diagnosis of the Haskell essay used as a tool. THE ORIENTATION TRAP (his): choosing which corner to state first is forced, mathematicians treat the other two as theorems of the first and so neglect the information asymmetry, and the choice affects everything surrounding the law but not the law - a trap for the philosopher. Alternative logs (his): spring-constants-first Newton, wave-function-first. CLAUDE'S CONTRIBUTIONS: corner tables for Newton II, the first, second and third laws and the houses chain first->second->third law (heat's wall = second law's chimney, entropy's wall = third law's chimney); Caratheodory's integrating factor as co-birth of entropy and temperature in the mathematics; corner_1 + S_1 |- corner_2, corner_3 (the asymmetry moves into the borrowed surroundings); the law-house chronology makes the cycle legal in one direction only (a wall may use the law, the chimney may not); the 2019 SI as an existing reordered log; a sorting test for foundations debates (same houses different order = orientation dispute; extra houses = content difference, idle-ontology audit applies). Sec 6 holds 14 open items; RULINGS OWED on item 1 (tension with VD_LAW_HOUSE_FOUNDATION rule 8 - no one corner should encode the whole relationship - writing guideline or amended?) and item 9 (energy and symmetry). PLACEMENT: Theory, own record folder by the Theory convention - it is a second justification of the triplet rule, the empirical counterpart to why_the_triplet_rule_is_needed_d2, about any VD theory rather than the Newton entries. NOT placed in Theory/triplet_as_admission_event/: the record says itself it neither supersedes nor corrects d2, so there is nothing to bind, and that folder is not a _note_ workbench, so no -informing copy was placed either. Not a criticism of the entry structure (SORTING 2a): accepting it changes no Newton entry, wall or corner; its one structural pressure point is on a Core rule (rule 8), recorded as a ruling owed. Normalization 2026-10-19: NO-OP, already in $/$$ form at source, nothing banked. SUPERSEDED WHOLESALE same day (2026-10-19/20) by why_three_law_corners_2026-10-19.md, at the user correction that this record emphasised the wrong point: it explained why a law has three EQUIVALENT statements and parked their non-equivalence as open item 2, when the real question is why physics counts UNEQUAL statements as one law, and how odd it is that why-three could be asked at all. Successor test: says something different, so supersession, not a draft. All content was carried over, so this file need not be consulted; kept as history in its own record folder."
