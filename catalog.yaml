    note: "THE VD PROJECT, FROM THE AUDITABILITY ANGLE - informal introduction, 2026-06-18, motivating the project rather than deriving anything. The funnel image: a theory takes heterogeneous stuff in and gives a prediction out; the named objects (force, mass, energy) can be inspected, the unnamed ones in the funnel do work anonymously; in mathematics to name something is to notice its existence, so the VD is the set of tools for naming the anonymous participants. Gives three criteria, four objections and the tools that answer each. SORTED 2026-09-02 from inbox/VD unsorted important to Theory/Orientational beside what_the_vd_is and why_this_project_is_worth_your_time, the orientation set it belongs to. Normalization a no-op, nothing banked."
