    note: "STANDALONE CORRECTION NOTE (264 lines) against ENTRY_PACKET_E10_..._d4, authored in-repo 2026-08-01 from a working session with Can. Target: the DEFERRAL PICTURE that d3 and d4 both leave unchallenged — the assumption that reconciliation COULD be a prior operation (metrology, an evaluator pre-pass, a separate numbered entry) handing E10 a conforming pair, which is what makes E10 look repairable by better wording. Argument: E9 takes acceleration as input and so requires it identifiable without net-force; E8 takes net-force as input and so requires it identifiable without acceleration; neither may be defined by reference to the other, and in practice the channels ARE separate (component forces / load cells vs differentiated position samples). Independently determined vectors are then generically non-conforming. Hence a two-horn dilemma on what any upstream step could deliver: HORN ONE, it delivers the quantities as its channels found them, and the exact definition is INERT over the whole domain traces run on; HORN TWO, it delivers a reconciled pair, and E8/E9 become INOPERABLE because each entry's input would presuppose its own output. No third delivery, so reconciliation is INTERNAL to mass determination, not preprocessing. NOT a draft of this note and deliberately outside the draft line (d3 stays current) — same grounds as why_the_mass_entry_cannot_be_short.md, per ORGANIZATION.md 'assign dN only when the order is confident'. Consequences recorded: open question 3 SETTLED BY DISSOLUTION (Can, same day) — E12-as-upstream and any separate feeding entry are ruled out by the dilemma, but the remaining alternatives were malformed too, since both assumed the estimator needs a home INSIDE the dictionary. It does not: the estimation capability exists but lies OUTSIDE THE SCOPE OF THE VD'S AUTHORITY, on the DIFFERENTIATION PRECEDENT — E8 returns an acceleration and obtaining one means differentiating position data, which the VD neither defines, numbers nor owns, without that making E8 defective. So E10 NAMES the operation and does not supply it; decision 11's capability-naming is permanent rather than a deferral pending the E12 ratification. Also dissolves the pedagogical tension (a first-year uses acceleration without deriving a differentiation scheme, and can hold 'the true pair must be estimated' without meeting ODR). ONE RIDER recorded: this external competence is NON-UNIQUE where differentiation usually passes as innocent (d1's competing estimators and the g(cos-theta) result), so the trace must record WHICH POLICY was applied — already provided for by decision 6's policy/provenance fields, but its source is the non-uniqueness of the external competence, not the mass corner. E10's payload also derived as three items rather than asserted as a length. Explicitly does NOT establish the retention theorem (residual, provenance, independence status) — that stays on the separate self-confirmation chain in d3 secs 3-4 — and does not close the cross-trial invariance gap. Carries a PROVENANCE OF THE CLAIMS section separating Can's argument from Claude's formalisation, and records a position Claude withdrew in session (that deferral to metrology was a coherent division of labour VD merely could not afford; horn two refutes it — conventional treatments do not notice because they do not trace). Written in $/$$ form at source, normalization a no-op, nothing banked. FILED 2026-08-25 into Newton-analysis/_dscn_trackability_and_mass/, FLAT, on the user's ruling that the six enter this holding discussion now and are split into _dscn_mass_estimator later - his words, 'then we can sort them into either mass estimation or trackability'. DISCUSSIONS DO NOT NEST, so the six came in flat rather than carrying vector_division_mass_estimation/ in with them; the partial-supersession relations among them stay recorded in these notes and unbound by any folder until the split. The 2026-07-27 ruling that this material is a DISTINCT QUESTION from the trackability chain (what estimator recovers m from noisy measurement, versus where a valid mass value enters the prediction chain) is NOT retracted - the coming split is what preserves it. MOVED 2026-08-25 into Newton-analysis/_dscn_mass_estimator/, its intended home since the discussion was created empty on 2026-08-21. It reached it by the long route: filed into the holding discussion _dscn_trackability_and_mass earlier today, then split out when the user promoted the entry-writing argument to a note. STAYS A RECORD, DOES NOT FOLLOW THE NOTE: it is not a draft of it. The two companions say so in their own opening lines ('Not a draft of this note... this is a companion'), and the vector-division article and the type-theoretic analysis say different things rather than the same thing better. This is the promotion-out rule working as ruled 2026-08-25 - drafts leave, feeders stay, and -informing copies of the feeders go to the note. RECORDED SHORTFALL, unchanged by this move: the draft/current fields below are pre-2026-08-20 residue that the kind model retires for records, and note_name still reads vector_division_mass_estimation, an object name that now labels four separate records grouped in a discussion rather than one thing. Both are on the standing open-items list; neither is a sorting act to fix. REVIEWED 2026-10-22 in the mass-estimator sweep: confirmed a record under his ruling that VD-docs holds made decisions only. A decision is its subject (thesis, settled correction, proof or ruling), so it stays in the slimmed discussion; kind stamped record."
