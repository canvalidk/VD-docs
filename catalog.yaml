  Newton-analysis:
    note: "INCUBATOR: many mini-projects, each developing an idea across documents. To be split into one subfolder per mini-project. SCOPE CORRECTED 2026-08-20 (user ruling): this branch does NOT exist to hold only outward-facing publishable content. The earlier wording here - building documents toward a publishable sketch - created a pretence that everything filed here must face outward, and in-between documents kept arriving with a paragraph of justification attached because of it. The branch was always meant to hold exactly those in-between documents; discussion about what the Newton entries should be belongs HERE. BRANCH LINE, user ruling 2026-08-20, AMENDING the 2026-07-07 branch-character rule (which read: discussion about what the entries should be goes to the Newton branch; discussion that uses the entries or the trace to produce insights goes into Newton-analysis): IF IT IS ANALYSIS OF ANY TYPE IT BELONGS IN NEWTON-ANALYSIS, unless it is more directly addressed to the Newton branch - bug reports and to-do lists being the examples given. The first half of the 2026-07-07 rule no longer holds. The placements that cited it - canonical_force_orientation, action_reaction_asymmetry, force_sum_member_value, participant_symmetric_forces and the rest, each filed here rather than Newton with a recorded justification - are now simply normal, and need no justification. THE DISCIPLINE THIS BRANCH NEEDS IS KIND, NOT CAMP: note versus record, below. CREATED AND RETRACTED THE SAME DAY, 2026-08-20: a subfolder Newton-analysis/vd_analysis/ was created to hold analysis whose subject is the VD apparatus rather than mechanics, carrying a membership test (strip the VD vocabulary out; if no claim about the world survives, it goes there), a rule that compiled releases draw only from outside it, and two exits. Four note folders were moved in - force_sum_member_value, canonical_force_orientation, participant_symmetric_forces, participant_symmetric_canonical_orientation - and moved back the same day once the user retracted the premise: the branch was always for in-between material, so the camp that folder named does not exist. An EMPTY vd_analysis/ directory may remain in the working tree - the mount refuses rmdir - but git does not track empty directories, so it will not reach the remote. TWO THINGS SURVIVE that pass, because neither depends on the retracted premise. (1) Those four documents are ONE CONTINUOUS ARGUMENT and are best read in this order: force_sum_member_value (Force-Sum must preserve a third corner) -> canonical_force_orientation (that corner exposes a human runtime orientation input) -> participant_symmetric_forces (symmetric mechanisms force a second acting-object architecture) -> participant_symmetric_canonical_orientation (the two meshed, and the orientation input survives in both branches). (2) The note/record proposal. The whole reversal cost catalog edits and one folder rename; no file identity changed - the first live demonstration of the folders-are-cosmetic rule. OPEN PROPOSAL, user 2026-08-20, REPO-WIDE, NOT YET RATIFIED AND NOT IMPLEMENTED - NOTE VERSUS RECORD: the default kind is RECORD, and a record becomes a note only when explicitly recognized as one. A note is DIRECTIONAL - aimed at a form it has not reached, which is why it takes dN drafts. A record is TERMINAL - complete as what it is, and takes corrections rather than drafts, with the correction bound into the same folder. Recognition is the excavation act itself: naming the direction, declaring which existing records are its drafts, and gathering them. Empirical case, measured 2026-08-20: of 48 note_names in this catalog only 14 have a real draft line - 34 have exactly ONE file, a lone d1 with no successor, and nine more entries carry draft: unknown. The model demanded a dN at intake, when least was known; the proposal moves that claim to the moment of recognition, and grandfathers the 14 lines that were actually argued. ALSO SETTLED IN THAT DISCUSSION (user, 2026-08-20): the FILENAME is the identifier and references point to files; FOLDERS ARE COSMETIC and may be renamed or regrouped freely, which is what makes a reversal like the one above cheap. Renaming a FILE is therefore the one genuinely breaking act and stays recorded with orig_name. Verified the same day: of 253 catalogued files, 36 basenames repeat and every repeat is a copy of one document - no two distinct documents share a name, so name-to-document resolves uniquely. Corollary found while checking: the Code notes cite the meshing note as Newton-analysis/participant_symmetric_forces/VD_PARTICIPANT_SYMMETRIC_CANONICAL_ORIENTATION_MESHING_d2.md, a folder it has never lived in - the path prefix was already wrong before any of today s moves, and nobody noticed because the filename resolved. Path prefixes in citations decay; the filename does not. DISCUSSIONS INTRODUCED 2026-08-21 (user), a THIRD object kind beside record and note - see the three _discussion_ folder entries below for the full definition. Three were created EMPTY this date at the user's instruction, named by him: _discussion_entry_structure, _discussion_acting_object_primitives, _discussion_mass_estimator. Membership is deferred, so this branch is UNCHANGED in content. OPEN ITEMS, recorded rather than decided. (1) ORGANIZATION.md IS NOT YET AMENDED - the model change lives only in this catalog, which makes it a recorded shortfall rather than a defect, but the amendment is the next act. (2) IS MEMBERSHIP A CATALOG FIELD OR PHYSICAL CONTAINMENT? Claude argued for a discussion: field with the folder as its mirror, exactly as kind is authoritative and the _note_ prefix is derived; the user has not ruled. It matters because two branch notes, _note_rigidity_composition and _note_photon_frame_certification, already participate in the trackability material through -informing copies but cannot nest under the notes-stay-at-level rule. (3) DEPTH: does a single-file record inside a discussion still get its own folder? Proposed amendment, not adopted - a record's folder exists to bind it to its corrections, superseded versions and renditions, so a record with none of those gains nothing from one and could sit flat inside its discussion; this would amend the both-kinds-get-a-folder rule. (4) The _discussion_ prefix is Claude's proposal, adopted provisionally and cheap to reverse, folders being cosmetic. (5) A FOURTH candidate discussion was proposed and is NOT among the three the user named: trackability_to_mass (tracks_to_particles, point_particle_bridge_spine, mass_identification_pipeline, material_object_naming; strong evidence - the spine states the chain the others annotate, tracks d4 cites the pipeline by name, the naming note synthesizes all three). Its status is OPEN, not rejected on the record. (6) tracks_to_particles (four records, d4 superseding d1-d3, d3 correcting d2) and vector_division_mass_estimation (six records) are each ALREADY discussion-shaped, which raises whether discussions nest. (7) The Newton-I trio - nothing_vs_zero_somethings here, newton_first_law_article and vd_design_3_newton_i_correction in the Newton branch - is a set of three records addressing each other that CANNOT become a discussion, since a discussion can no more span branches than a note can. CORRECTION, user, 2026-08-21, SAME DAY as the three discussions were created: A DISCUSSION MAY NOT CONTAIN -INFORMING COPIES. Claude's first reconstruction of WHY was wrong - it invented a new property, that everything in the folder must hold a position on the question - and the user rejected it. THE ACTUAL REASON, stated by Claude and confirmed by him: AN -INFORMING COPY EXISTS TO SERVE DEVELOPMENT. His own rule when he introduced the device on 2026-07-07 was that a note's folder must be self-contained enough to copy its contents and paste them as AI context without hassle - which is a WORKBENCH. A note is DIRECTIONAL, there is a next draft to write, so the folder needs its inputs sitting in it. A RECORD IS TERMINAL, and a discussion is made of nothing but records, so there is no next draft anywhere in a discussion for an informing copy to feed. The device is not untidy there, it is CATEGORICALLY INAPPLICABLE - which is why this is a flat prohibition and not a judgement call. NOTES KEEP THEIR INFORMING COPIES; records and discussions are the barred cases. ORGANIZATION.md was already ahead of this: its Records section lists what a record's folder may hold - corrections, superseded versions, renditions - and informing copies are not on that list. THIS IS AN ORGANIZING PRINCIPLE, NOT A THIRD RULE (user, 2026-08-21). One statement generates all three cases: A FOLDER'S PERMITTED CONTENTS FOLLOW FROM WHETHER ITS OBJECT IS STILL BEING DEVELOPED. Note = under development = workbench = drafts plus borrowed inputs. Record = terminal = corrections, superseded versions and renditions, nothing borrowed. Discussion = only records = nothing borrowed anywhere. Three stipulations collapse into one principle with three readings, and DIRECTIONALITY - the note/record axis - is doing all the work, which is where the model wants it. DIAGNOSTIC HARVESTED FROM IT: an -informing copy is now a KIND-DETECTOR. Its presence asserts that someone treated the host object as under development, so an informing copy inside a record's folder means either the copy is STALE or the KIND IS WRONG. This is the same move ORGANIZATION.md already makes when it calls parallel variants diagnostic of note-hood, so directionality now has two independent structural symptoms. It also supplies, DERIVED rather than stipulated, the audit assertion the discussion model was missing: no -informing file may sit inside a discussion folder or inside any record's folder. FIRST RUN OF THAT AUDIT, 2026-08-21: Newton-analysis holds seven -informing copies and SIX ARE FOSSILS of the pre-2026-08-20 model, sitting in folders that are now records - mass_identification_pipeline/ (from_fma_rigidity_to_com_plain_math_d3, vd_trackability_scene_to_particles_d4), point_particle_bridge_spine/ (those two plus vd_mass_identification_pipeline_d1) and tracks_to_particles/ (photon_frame_certifier_and_gravity_d3). They lost their job AT DEMOTION, not at discussion-formation; the discussion rule does not create this cleanup, it makes it visible. Exactly ONE sits where it still belongs - _note_rigidity_composition/vd_trackability_scene_to_particles_d4-informing.md, hosted by a NOTE, which keeps it. NOT ACTED ON: the six are recorded here and left in place for the user's decision, since deleting them is a content change; their informs LINKS in the catalog are unaffected either way. WITHDRAWN, an earlier claim in this note: the cost of the informing ban was stated as three copies charged against the open trackability_to_mass candidate, which mis-framed a pre-existing cleanup as a price the new rule imposes. That framing is withdrawn. The STRUCTURAL argument for membership-as-a-catalog-field survives it and is strengthened - a note that participates in a discussion cannot be represented inside the discussion folder by ANY device once the ban is categorical, so the only place that participation can live is a catalog field - but open item (2) remains the user's to rule on. UPDATE 2026-08-25, SECOND FILING PASS. Open item (5) above - the fourth candidate discussion trackability_to_mass, recorded 2026-08-21 as OPEN and not rejected - is CLOSED BY ADOPTION: the user coined it as 'trackability and mass' and it exists as _dscn_trackability_and_mass with 12 files, adopting the 08-21 candidate set minus material_object_naming, which he declined along with newton_vs_gibbs and composition_discovery. Open item (6), whether discussions nest, is answered in practice: they do not - the vector_division group came in flat, and statement-records carry any sub-argument identity that nesting would otherwise have expressed. THE SIX FOSSIL -INFORMING COPIES recorded above as 'left in place for the user's decision' have been decided: staged into Newton-analysis/_to_delete/informing_fossils/ for his deletion, since a discussion may hold no -informing copy and three of the four core members carried one. Removing them is also what let two of those members sit flat. The seventh fossil found 2026-08-25, Theory/triplet_as_admission_event/alpha_and_the_one_draft-informing.md, is NOT staged - it is in another branch and outside this pass. Newton-analysis is now 12 top-level entries lighter than it was on 2026-08-20, which is the legibility problem discussions were introduced to solve. UPDATE 2026-08-25, THIRD FILING PASS - all three of the 2026-08-21 discussions are now populated and the branch is FLAT NO LONGER: top level went from ~21 sibling record folders on 2026-08-20 to 16 entries, of which 4 are discussions, 3 are notes, and only 6 are bare record folders (abstract_interaction_candidate, composition_discovery, material_object_naming, newton_vs_gibbs, nortons_dome_resolution, nothing_vs_zero_somethings). That is the legibility problem discussions were introduced to solve, solved. _dscn_entry_structure took its 08-21 candidate set unchanged, all six. The six fossil entries are RETIRED, the user having deleted the staging folder. Newton-analysis/_to_delete/ DELETED BY THE USER 2026-09-05 (evening), folder entry retired and its record folded here: it was the staging folder created 2026-08-25 for material awaiting his deletion, because the mount refuses rm and rmdir. At the end it held empty_folders/ (husks of record folders emptied by filings) and informing_fossils/lumping_consequences/ with four -informing copies - vd_trackability_scene_to_particles_d4, lumping_horizon_and_thermodynamic_boundary, one_dimensional_redundancy_vscode_math_d1, glass_ball_mdp_example_d1 - placed at the first stocking of lumping_consequences on 2026-09-05 and staged the same day when that folder was ruled a discussion (a discussion holds no informing copies). Their four rows are RETIRED under the outbound-custody convention (a file that ends is retired, not recorded as an absence); the home records are untouched. The six earlier fossils of the 2026-08-21 audit had already been retired when he deleted their staging on 2026-08-25. Standing arrangement unchanged: inbox/_to_delete/ remains the staging folder for anything ruled removable."
  Newton-analysis/criticism_history:
    note: "THE CRITICISM HISTORY - space 1 of the two entry-structure spaces (ORGANIZATION.md, Entry-structure criticisms). Created EMPTY 2026-09-11 on user instruction (.gitkeep only), so that its internal organisation can be worked out by playing inside it before the members arrive. Its members-to-be are the twelve files still under _dscn_entry_structure/ (the demoted discussion; see that folder note) plus the nine nml candidates and, potentially, the Design 3 strand - all on the move list with the user, since the sandbox cannot move files on the mount this week. RULES: every record here is a criticism of the entry structure by the test (what would change if Newton accepted it), carries criticises / at_commit / fate / fate_ref, is never edited, and stays whatever its fate. Flat and chronological by default; a discussion may be coined inside it when an argument crystallises. A RECORDED EXCEPTION to the folder shapes: a bare folder of many records at branch level, neither discussion nor record-folder. Internal organisation OPEN as of creation - deliberately. POPULATED 2026-09-15 once the mount came back: the twelve files of the demoted discussion moved in (four flat records, four record folders - canonical_force_orientation, force_sum_member_value, inertial_acceleration_two_entries, participant_symmetric_canonical_orientation - each binding a superseded version), the emptied _dscn_entry_structure/ folder staged in Newton-analysis/_to_delete/empty_folders/ and its folder key retired, and the eight nml candidates moved in flat (the 09-05 count of nine counted the net-force-wall note twice) (nml1: E7 placement, E7/E8 decision; nml2: net_force_wall_withheld; nml3: the force-sum quartet and the impressed-force open problem), each leaving an -informing copy in its lesson note workbench. NOW 20 FILES IN 16 MEMBERS, every one carrying criticises / at_commit / fate / fate_ref. NOT moved: NML2_working_note_core_constraints (fails the test - consumes the cut, argues nothing about it); the Design 3 strand (todo, oop_discussion, unfolding_forces, trace_architecture, newton_i_correction, nothing_vs_zero - all pass the test; his answer was potentially, so they wait for a yes). Internal organisation still deliberately open. THE FORMER DISCUSSION FOLDER NOTE, preserved verbatim because its reading-order and evidence-grade prose is the seed of the house justifications: DISCUSSION FOLDER, created EMPTY 2026-08-21 on user instruction ('don't put anything in em first'). A DISCUSSION is a THIRD object kind, adopted in principle by the user this date alongside record and note: a folder that groups multiple RECORDS WHICH ADDRESS ONE ANOTHER. It asserts that the documents talk to each other, not merely that they share a topic - the distinction that keeps it from degrading into a topic folder, since everything is about several topics and topic membership becomes arbitrary and then contested. NOTES ARE NEVER NESTED IN ONE: they stay at branch level, because a note is directional and aimed outward at a reader who is not in the discussion, while a record is terminal and its meaning is partly given by the argument it arose in. NO -INFORMING COPIES INSIDE A DISCUSSION (user correction, 2026-08-21), which RETRACTS the promotion-out mechanism first recorded here the same day. See the Newton-analysis folder note above for the rule, exactly what it retracts, the proposed replacement and the measured cost. The .gitkeep is there only because git does not track empty directories (the retracted vd_analysis/ folder of 2026-08-20 is the precedent for how such a folder silently fails to reach the remote). SCOPE OF THIS ONE: the entry-facing argument about what the Newton entries must structurally preserve. NO MEMBERS YET. Candidate set proposed 2026-08-21 and deliberately NOT acted on: action_reaction_asymmetry, canonical_force_orientation, participant_symmetric_forces, participant_symmetric_canonical_orientation, typed_closure_deduction, force_sum_member_value. Evidence grade STRONG - four of the six cite each other by full repo path, and the set runs 2026-08-13 to 2026-08-18 as one continuous argument whose reading order is already recorded in the Newton-analysis folder note above; the chain of address is legible in the files (the asymmetry sketch leaves its Part VI universality crux open, participant_symmetric_forces Part VII answers it with two architectures, the meshing note meshes that with canonical_force_orientation and discharges its open q4, meshing d2 supersedes d1 after the user found the overclaim, and typed_closure_deduction builds its instrument on the meshing note Part IX member-named laws). THE USER NAMED THIS DISCUSSION ENTRY STRUCTURE rather than the proposed 'force orientation', and the documents support the rename: force_sum_member_value self-describes as an entry-facing discovery note addressing the semantic and evaluator requirement exposed by the NML3 entry-structure reset, and canonical_force_orientation as the local Design 2.1 entry-facing interpretation. So the discussion is named for what the argument is FOR, not for the mechanism it turns on. POPULATED 2026-08-25, the third and last of the three folders created empty on 2026-08-21, and the largest. THE 08-21 CANDIDATE SET WAS ADOPTED UNCHANGED, all six: ACTION_REACTION_CONSTITUTIVE_ASYMMETRY_SKETCH_d1, CANONICAL_FORCE_ORIENTATION_CONVENTION_DISCOVERY_2026-08-14_d1, VD_PARTICIPANT_SYMMETRIC_FORCES_OWNER_BLIND_ACTIVATION_AND_HALF_WEIGHTING_d2, participant_symmetric_canonical_orientation/ (d1+d2), VD_TYPED_CLOSURE_FAILURE_DEDUCTION_RESIDUAL_TAXONOMY_d1 and FORCE_SUM_TRIPLET_IFS_VALUE_RELATIONAL_NECESSITY_2026-08-18_d1. Five sit FLAT; only participant_symmetric_canonical_orientation keeps a folder, because d2 supersedes d1. THE STRONG EVIDENCE GRADE IS WHY THIS ONE NEEDED NO DEBATE: four of the six cite each other by full repo path and the set runs 2026-08-13 to 2026-08-18 as one continuous argument. READING ORDER, already recorded in the Newton-analysis folder note and worth repeating here because a folder cannot carry it: the asymmetry sketch leaves its Part VI universality crux open -> participant_symmetric_forces Part VII answers it with two architectures -> the meshing note meshes that with canonical_force_orientation and discharges its open q4 -> meshing d2 supersedes d1 after the user found the overclaim -> typed_closure_deduction builds its instrument on meshing Part IX's member-named laws. force_sum_member_value supplies the third Force-Sum corner the orientation note exposes. THIS IS THE DISCUSSION MOST WORTH A STATEMENT-RECORD: the order above is content, it is cited nowhere as a file, and it currently survives only inside catalog notes, which nothing addresses. AUDITS AT FILING: no -informing copy anywhere in the folder; catalog<->disk bijection holds; _note_ / kind: note bijection untouched. TWO THINGS CARRIED, NOT FIXED: every member still carries draft/current residue the kind model retires for records, and participant_symmetric_forces is the 2026-08-21 TIER-3 case whose kind cannot be settled by either grandfathering or the successor test - it files as a record by default, and a later ruling that it is a note would take it out again for one folder op. TWO MEMBERS ADDED 2026-09-02 from inbox/VD unsorted important: vd_newton_structure_session (2026-05-18, flat - now the earliest dated member) and inertial_acceleration_two_entries/ (a folder, because the two-entries design note of 2026-06-08 supersedes the headword-collision bug report of 2026-06-06 and the depth rule binds them). The discussion now has eight members: six flat, two folders. TWO FOLDERS CREATED 2026-09-05 at the ingest of VD-Newton's 08-26 pass rows 10 and 12: canonical_force_orientation/ and force_sum_member_value/, each holding our _d1 and the 2026-08-26 version that supersedes it (intact math and the naming-decision rewrite of sec 7 in the first; the notation-translation block and the settled headword form in the second), with the supersedes / superseded_by relations SET at intake. Both records left the flat level under the depth rule - a record gains its folder at its first attachment - path prefix only. The discussion now has eight members: four flat, four folders. In both new folders the UN-SUFFIXED filename is the newer version, kept as received because it is the name VD-Newton cites; the _d1 is the older. DEMOTED 2026-09-11 ON USER INSTRUCTION - NO LONGER A DISCUSSION: this folder is the CRITICISM HISTORY, ruled name Newton-analysis/criticism_history/ (rename pending; the sandbox cannot rename on the mount this week, so the _dscn_ prefix is a recorded lie until the user runs the move). His framing: entry-structure criticism arrives from all branches and is always about a potential future decision, so it cannot be organised by nml or E-number without the tree lagging its contents; hence TWO SPACES - this immutable chronological history, and Newton/structure_justifications/ as the mirror of the current structure stocked with -informing copies from here - and a NEW RESPONSIBILITY, the restock pass, that had never been done. Rules in ORGANIZATION.md (Entry-structure criticisms) and SORTING.md sec 2a; guide in Newton/structure_justifications/STRUCTURE_JUSTIFICATIONS.md. EVERY MEMBER NOW CARRIES criticises / at_commit / fate / fate_ref (2026-09-11). Fates written today are Claude's READING from the records, marked on each row, reversible: two_entries accepted (Design 2.1 has E7 and E8), the four _d1/d1 versions superseded by their successors, everything else open - including the two 08-26 records whose triplet NAMES were ruled at source but whose structural claims were not. NOT YET MOVED IN (move list with the user): the nine nml candidates (nml1: E7 placement, E7/E8 decision; nml2: net_force_wall_withheld; nml3: the force-sum quartet and the impressed-force open problem) and the Design 3 strand (todo, oop_discussion, unfolding_forces, trace_architecture, newton_i_correction, nothing_vs_zero), each to leave an -informing copy where it was written. NML2_working_note_core_constraints fails the criticism test (consumes the cut, argues nothing about it) and stays. Nortons dome sec 2 conflicts with the accepted Newton I correction and is unadjudicated - a candidate first loop of the cycle. The four-strand reading order recorded above remains true and is what the first house justifications will be compiled from. UPDATE 2026-09-11, later: the target folder Newton-analysis/criticism_history/ now EXISTS, empty, created on his instruction so its internal shape can be worked out before the members move; so the pending operation is a MOVE of these twelve files into it (plus the empty attachment folders), not a rename of this folder, which is then removed."
