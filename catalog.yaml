    informs: null
    note: "NML3 MOCK LESSON - ADDING FORCES AND BUILDING A FORCE ACCOUNT. Self-described status: mock younger-student lesson draft; audience upper primary / early secondary, adaptable upward - so its AUDIENCE DIFFERS from the introductory-university audience of NML3_CONTENT_SPECIFICATION_d1, and the two are not drafts of each other. Filed FLAT in nml3/ by user instruction 2026-08-09 (options offered were a younger-student subfolder or a single dN note; flat-and-tagged was chosen), so the audience split is recorded here rather than in the folder shape. Ten parts plus teacher notes: force as arrow, same-direction addition, opposing forces, head-to-tail addition in two dimensions, order independence, net force, target discipline, cancellation, the decomposition trap, a box-on-a-table interaction example, four board rules, an exit ticket, and teacher notes. Its own teacher notes are the useful part for the project: sec 17 says most of the lesson should feel like an ORDINARY introductory forces lesson and that this is intentional - NML3 does not need to make vector addition seem strange, the conceptual extension arrives only after students already understand the sum. Sec 18 names the one distinctive move: refusing the hidden textbook step of taking the net force and decomposing it into whatever named forces make the equation work, installing instead interaction-account-first / sum-second (board version: FORCES FIRST. ADDITION SECOND.), and lists the formal machinery - IFS, force-member identity, acting-object-instance keys, set uniqueness, equal vectors from distinct members, empty vs nonempty zero-resultant accounts, generation vs closure - that the same idea becomes at higher levels, so the younger lesson is explicitly a preparation for it rather than a simplification of it. Sec 19 records a VOCABULARY DECISION for young learners: prefer force contribution / force arrow / force account / physical interaction, and use the verb REPRESENTS - captures is judged slightly metaphorical and appropriates too legal, while represents preserves the later three-way distinction between physical interaction, force-instance, and vector representation. Sec 20 lists five questions deliberately NOT required here (proving a candidate interaction is real, knowing every interaction has been found, keying members, action vs reaction, how concrete acting objects generate force laws). Relevant open question: the bridge's production order step 9 leaves undecided whether NML3 is one long lesson or an NML3.1/NML3.2 split, and this mock lesson is the first material that would sit on one side of such a split. Sorted from inbox 2026-08-09. NOT an excavated note - no dN model applied. Normalization no-op: no math delimiters to convert, nothing banked. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/entry-cut-dependent/ (path field updated; filename untouched, no dN implied by the move). RETIRED AS AUTHORITY, KEPT AS REASONING RECORD - this note was written against the NML3 entry cut that is now being withdrawn (E13-E17 with E16 as the force-member/admission wall and E17 as the IFS/closure wall), so it must not be read as a current target. Retirement follows the E10 packet precedent: superseded as the working account, deliberately kept, and NOT EDITED IN PLACE - no banner was added to the file, the boundary lives in the folder, this catalog note, and the reset record at Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md. Never-archive rule honoured: nothing deleted. OPEN AT SOURCE: whether the new cut reuses E13-E17 or advances to fresh numbers is a VD-Newton decision; until it is settled, bare E13-E17 references in this file name the RETIRED cut. The layer subfolder is NOT a note folder - note_name stays null."
