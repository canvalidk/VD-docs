    note: "THE VD LAW-HOUSE FOUNDATION - consolidated working orientation note, self-dated 25 August 2026, self-labelled 'Project: VD Newton / Design 3'. Separates two questions: what makes a structure a VD LAW at all (an irreducible three-headword triplet represented by a directed hypercycle) and what further entries make that law USABLE (the six-entry law-house that grounds all three headwords in the rest of the dictionary). Part I fixes the notation that does the work: every entry owns its own indexed residue Res_n, there is no free-floating Res, and Res_9() versus Res_9(B,C) distinguishes the residue from the residue with its headword-accessible inputs exposed. Closes by naming its own use - 'the law-house foundation to use when analysing arguments such as why mass must be estimated' - which ties it directly to why_inertial_mass_must_be_estimated.md, written the same day and whose sec 1 recasts Newton II as a six-entry house with local numbering. ARRIVED IN inbox/ 2026-08-25 15:35, an hour before that draft. NOT SORTED: the branch question is genuinely open and was put to the user rather than guessed. Core fits its character - a consolidated statement of VD rules presented without justification, the same shelf as vd_six_entry_structure.md and degree_of_law_formal.md, which it overlaps. Newton/Design 3 fits its own declared project header, and identity-follows-the-file's-own-declaration is a standing rule here (it is what placed hookean). Newton-analysis is the weakest of the three: this is not analysis, it is a rules consolidation. Math normalization checked 2026-08-25 and reported NO MATH DELIMITERS TO CONVERT - already in $/$$ form, nothing banked. Catalogued in place so the catalog<->disk bijection stays true while it waits. SORTED TO CORE 2026-08-25, USER RULING, on the character reading rather than the file's own project header: it is a consolidated statement of VD rules presented without justification, which is precisely what the Core folder note says the branch is for, and it sits on the same shelf as vd_six_entry_structure.md and degree_of_law_formal.md, which it overlaps and arguably consolidates. The 'Project: VD Newton / Design 3' header is therefore OVERRIDDEN here - worth recording as a limit on the identity-follows-the-file's-own-declaration rule that placed hookean: a project header names what the work was FOR, not what the document IS, and where the two diverge the character reading wins. FILED FLAT, and this makes a standing exception explicit rather than adding one: Core has never used per-object folders - every one of its markdown documents sits at branch level - so giving this file a folder would have made it the only foldered object on the shelf. Recording it here converts an unrecorded branch-wide shortfall into a recorded exception. Filename kept as it arrived, SCREAMING_CASE and all, per the precedent set by force_sum_member_value; no dN, because it is a record and records take none. Normalization run on intake and reported NO MATH DELIMITERS TO CONVERT, so nothing was banked and math_normalized stays null - the file was already in $/$$ form at source."
