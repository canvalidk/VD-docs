    note: "ENTRY PACKET E10 `inertial-mass-material-object`, d5 (1064 lines) — successor after the upstream-reconciliation correction, written SELF-CONTAINED (every 'as d4' shorthand expanded, so d5 stands alone as the spec; vocabulary counts, all Allowed/Blocked bullets and all twelve acceptance tests verified present verbatim), written by Claude 2026-08-01 AT CAN'S EXPLICIT REQUEST. STANDING-RULE OVERRIDE RECORDED: the 2026-07-27 instruction is that packet internals are the user's and not Claude's to manage; Can overrode it for this one packet ('will you update the E10 entry packet, make sure it makes sense'), and the exception reverts afterwards. Governing correction is the E8/E9 dilemma from why_reconciliation_cannot_be_upstream_of_E10.md: E9 consumes acceleration so acceleration must be identifiable without net-force, E8 consumes net-force so net-force must be identifiable without acceleration; any upstream reconciliation either leaves the pair non-conforming (definition INERT over the trace domain) or reconciles it and makes E8/E9 INOPERABLE. Carries a VERIFICATION NOTE that E8's 2026-07-25 definiens ('its net-force divided by its inertial-mass') makes the first premise a fact about the VD rather than a convenient reading. CHANGES FROM d4: open question 3 CLOSED by dissolution (the estimation capability exists but lies outside the dictionary's authority, on the DIFFERENTIATION PRECEDENT — the VD does not define, number or own differentiation and E8 is not defective for it); decision 11's capability-naming made PERMANENT rather than pending an E12 ratification; the lesson boundary's 'whether that later capability is E12 or a separately named entry remains open' WITHDRAWN; decision 1 given its rationale (exact-vs-measured is the DISPATCHABLE form — a level distinction the trace cannot branch on belongs to Theory); open question 6 RELOCATED as a declared-policy question in the admission sense rather than a defect in decision 8; candidate D upgraded from DEFERRED to REJECTED (a 'certified pair' presupposes the ruled-out upstream predecessor); a non-uniqueness rider added sourcing the policy-recording requirement to the external competence rather than to the mass corner; three acceptance tests added (13 upstream-reconciliation rejected, 14 E8/E9 remain operable on the same inputs, 15 capability name must not resolve to an entry). NEW BOUNDING SECTION 'What E10 is not required to establish' — the retention theorem is a SEPARATE chain (self-confirmation, d3 secs 3-4) and object-scoping is WARRANT not content (alpha governs warrant, the triplet records content, per Theory/triplet_as_admission_event d2), both recorded because both had been read as defects in E10. NEW 'Settled — do not reopen' table naming the GENERATOR behind the recurring objections: reading entries as statements judged for accuracy rather than as triggers judged by P(correct trace). WORDING DELIBERATELY UNTOUCHED — candidates A-D and the draft entry reproduced verbatim from d4 at Can's instruction that the wording is a placeholder; candidate A re-checked and found consistent with the new results, and that the correction forces no wording change is recorded. All twelve d4 decisions survive (11 corrected in rationale only); nothing silently dropped. New open question 9 flags whether numerical differentiation's policy-ladenness gives E8 the same latent under-specification — raised as a question for the E8 packet, not a claim. Normalization was a no-op: written in $/$$ form at source, nothing banked."
