    note: "THE FULL INERTIAL-MASS ESTIMATOR (1393 lines, 35 sections in nine parts), authored by the user 2026-08-30 and sorted in the same day. It is the synthesis of this whole family: its Source basis names ALL FOUR drafts of why_mass_estimation and FOUR of the six records already in this discussion, plus NML2_1_CONTENT_d2. WHAT IS NEW BY ITS OWN ACCOUNT: the compatible-pair mean readout, the reciprocal-equivalence requirement, rejection-gate dominance, the anti-aligned stress test, and the fixed/common-mass falsifiability analysis. THE TWO LOAD-BEARING MOVES. (1) RECIPROCAL INVARIANCE as a hard requirement, sec 11: F = m a and F = (1/mu) a describe the same compatible pairs, so choosing the symbol must not alter the inference - finite estimates, bounds, non-identification and poor compatibility must all map across. This is parameterization invariance stated physically, and it is a real discriminator, since uniform-in-m and uniform-in-mu are different policies. The readout that satisfies it is sec 10s ratio of support-weighted MEAN MAGNITUDES, m_hat = fbar/alphabar, deliberately NOT E[f/alpha] and not a posterior mean of m: the induced ratio has a long high-mass tail as alpha approaches zero and its mean may not exist, while the two magnitude means do. (2) THE REJECTION GATE, Part IV: absolute Newton-II compatibility is tested SEPARATELY from relative preference among masses, and rejection suppresses the conditional mass readout. Sec 23 gives the reason that makes it structural - a normalized mass distribution can always be manufactured even when every mass fits badly in absolute terms, so no posterior summary can do the rejecting. Part VII then builds three levels of falsifiability on it: can any mass fit this trial, does a KNOWN mass fit it, does ONE COMMON mass fit repeated trials. RELATIONS, none asserted as a catalog binding. Part VI demotes median_based_estimator_inertial_mass from the core operation, but sec 22 keeps its six insights explicitly alive and sec 23 says a richer Bayesian or excitation-model analysis may still be added downstream provided it inherits the rejection and reciprocal requirements - SCOPING, not supersession, the same shape as the disagreement rules sec 10 and the same as the users 2026-08-26 lumping_horizon ruling, so no supersedes and no corrects. Sec 7 does the same to the old best-point estimator: the profile objective stays valuable FOR THE COMPATIBILITY TEST, but its positive stationary root is not the general point estimator, since for anti-aligned data that root can be a MAXIMUM. That touches why_the_estimator_is_the_definition, which argued the errors-in-variables estimator IS the definition of inertial mass - the argument form survives, the identified estimator changes. FLAGGED FOR HIM, not acted on: whether that pair now stands in a corrects or supersedes relation. THE DISAGREEMENT RULE IS ABSORBED: secs 21 and 32 items 4-6 carry the exact-zero-zero versus measured-zero-zero distinction and the repair-disagreement/preserve-non-identification rule as settled structure, three days after that record was written and its -informing copy placed. KIND LEFT UNSET, deliberately: the d1 is AUTHORED (header reads working synthesis, d1), and per the 2026-08-26 sweep neither grandfathering (which covers an ASSIGNED lone d1) nor the successor test (which needs a chain) runs on a lone authored d1 with no successor. It files as a record by default under the absence rule, exactly as vd_coverage_five_aspects_and_industry_appearances_d1 does. OPEN AND OFFERED: this is the strongest candidate in the repo for a note created-to-write-into - it is called a working synthesis, sec 32 lists what is settled and sec 33 what remains policy, which is a document that knows the form it has not reached. A note ruling would cost one folder operation and a direction line. Also worth his eye: as it stands it does the job of a STATEMENT-RECORD for this discussion, naming its own basis and ordering the material. NORMALIZATION WAS A NO-OP - already in $/$$ form at source, nothing banked, math_normalized null. No rename: the name was house style and the authored d1 stays. COPY PLACED 2026-08-30, same day, on his instruction - third consecutive offer taken in the next message. Home stays here; the copy is read-only and banners this path. The note workbench is now five copies deep. PROMOTED 2026-10-22 into _note_mass_estimator_equation as d0, on his ruling that it is the first statement of the thing the note is about. NUMBERED d0, NOT d1 WITH THE OTHERS SHIFTED: dN is an identity and d1 and d2 state their numbers in their own headers, so renumbering would falsify them; d0 keeps the order and rewrites nothing. The filename keeps its legacy _d1 suffix, which makes no draft claim. Its informing copy in the equation note was dropped as redundant; the copy in _note_why_mass_estimation stays."
