08-26 PASS CHECKLIST, 2026-09-02: their pass to folders/2026-08-26/PASS_CHECKLIST.md (19 rows, Delete/Keep per file) was never returned; filled in today under the custody rule and written to inbox/2026-08-26_vd_newton_pass/PASS_CHECKLIST_RETURNED.md for VD-Newton to read here (outbound naming, same shape as the 08-15 pass). Rulings: 10 Delete (rows 1-5, 7-9, 13, 14 - byte-identical, equivalent bar delimiters, or identical bar a term map now recorded in the managed copys note), 9 Keep - three marked NOT YET INGESTED on his instruction so that belongs-here is never read as may-be-deleted (row 6 randomness_declarative_boundary, row 10 canonical-orientation 08-26 version, row 12 force-sum triplet 08-26 version - all agreed to come here, none ingested yet), four UNDECIDED with both sides holding on his ruling (row 11 FORCE_SUM_IFS note - the 08-14 hand-out neither reversed nor confirmed; rows 15, 18, 19 the NML3 conceptual records under the shared nml exception, of which 19 is substantively newer at source, +98 lines), and two steering decisions (16, 17) that stay at source by rule. NOTHING WAS INGESTED THIS PASS. Delete this folder once VD-Newton has applied the rulings and the three pending ingests have their own return. 2026-09-05: inbox/_to_delete/claude_outputs/ holds one scratch file (mass_address_lumping_informing_table_proposal.md) that the desktop app dropped into a 'Claude outputs/' folder at the repo root when Claude sent it to chat on 09-02; never catalogued, never a repo object; moved here so the root is clean. The empty 'Claude outputs/' folder at the root also awaits deletion (the mount refuses rmdir). LESSON RECORDED: sending a file to chat while this folder is connected writes it into the repo - deliver scratch files by other means or expect this staging step. INGEST 2026-09-05, THE THREE PENDING ROWS OF THE 08-26 PASS, done under the standing mandate to carry the agreed dispositions through: row 6 randomness_declarative_boundary to Newton-analysis, flat; rows 10 and 12, the 2026-08-26 versions of CANONICAL_FORCE_ORIENTATION and FORCE_SUM_TRIPLET, into new folders in _dscn_entry_structure as supersessions of our _d1s with the relations set. Sources read from VD-Newton at f559ba1 (branch codex/nml2-entry-renumbering; their 06_newton_analysis/ copy of row 6 was already gone, the bundle copy and their 05_design_3_catchup/ copy being byte-identical), landed in inbox/2026-08-26_vd_docs_pass/ with hashes verified against the clone, bank -> normalize -> gates (CANONICAL 1 edit, banked; the other two no-ops), moved, catalogued. The emptied bundle folder went to _to_delete/empty_folders/. AND A NEW INBOUND SHAPE, same day: VD-Newton now stages documents for us in a workspace-root pass to VD-docs/ folder (their AGENTS.md policy, 2026-09-05), with the rule that saving there does not itself mean we have received it - so the catalog row here is the receipt, and the re-issued return says so. First batch: three mass-estimator records (two-cases, originality research, additional derivations), landed in inbox/2026-09-05_vd_docs_pass/ (hashes verified), all normalization no-ops, filed flat into _dscn_mass_estimator on his instruction, no informing copies; the emptied folder went to _to_delete/empty_folders/. PASS_CHECKLIST_RETURNED.md RE-ISSUED 2026-09-05 with rows 6, 10 and 12 flipped to Delete and the managed paths given: now 13 Delete, 6 Keep (11, 15, 18, 19 UNDECIDED; 16, 17 steering), plus a receipt section for the pass to VD-docs/ batch. Newton had NOT applied the 09-02 return at f559ba1 - 8 of the 10 Delete-row originals were still there - so the user hands the re-issued file over by hand. CLOSED 2026-09-05, evening - THE 08-26 PASS IS DONE IN BOTH DIRECTIONS. The user reports that VD-Newton applied the re-issued return (13 Delete rows deleted at source, the bundle removed, the three pass to VD-docs/ files marked received and their staging copies dropped) and then, on this side, emptied inbox/_to_delete/ (five subfolders: the