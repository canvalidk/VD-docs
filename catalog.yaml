    informs: "vd_review_corrections (particle_and_mass_origins discussion, home since 2026-09-05; nml2.2 before) -> nml2_2_lesson (Parts I, II and V - the lesson-facing corrections and the open-item list); -> presentation track (Part III - see the SEAM FLAG below; receiving home not yet established, no copy materialized); -> nml2_2_lesson (informing copy left at the old home 2026-09-05 when custody moved)"
    kind: record
    note: "WORKING NOTE (NML2.2 target construction), authored 2026-07-24, sorted from inbox 2026-07-25. Corrections record from an adversarial review of three NML2.2 documents - the pre-water inventory d1, the 1D redundancy note d1, and glass_ball_mdp_example d1 - filing each objection as resolved, withdrawn, retracted or promoted. Part I: (1) the redundancy criterion is split into TWO named tolerances, eps_shape (distance preservation, licenses a body, permits rotation and forbids bending - replacing the offset criterion, which wrongly forbade rotation) and eps_trans (residual scatter, licenses one particle), with the 1D note's max-height-spread test kept but renamed a LOCALISATION criterion; also records that distance preservation is rotation-frame-blind, which moves the inertial-frame commitment forward to the Newton-II step instead of leaking back into lumping, and that velocity spread times interval length bounds admissible interval length. (2) The force-pipeline objection is withdrawn on scope (forces are the next lesson) with two changes still required - declare Part VIII's procedures as unjustified worked examples, and reweight the checklist toward the record form. (3) The M_A = M_B objection is partially retracted - same additivity rule twice, but the co-reference of the fragment masses across the scatter interval is n persistence certificates plus material closure and must be stated. (4) The flake objection is resolved and PROMOTED into general procedure - suspected unrepresented material gets its own address and a negligibility determination yielding a BOUND, which makes negligibility a sixth determination family, and which exposes the load-bearing gap: coverage currently inherits a POSITION tolerance and has no mass scale, so a new eps_m budget is required to close the certificate. (5) Distinctiveness is retained but reclassified as experimental preparation rather than a fifth sampling knob, adds a distinctiveness-vs-fidelity trade-off (tracer slip / Stokes number, as in PIV practice), and flags a re-audit ordering bug (extent, density and balance are never re-audited on surviving tracks). Part II proposes replacing water as the lesson vehicle with the INEXTENSIBLE CHAIN OVER A PULLEY - 3D redundancy fails exactly, arc-length redundancy holds exactly, and the lesson ratifies a move every first-year already makes - keeping water as the contrast case that yields an ordered many rather than one bundle. Part III (presentation track) argues volume is not a Newtonian quantity, keeps the two gates separate, and sets up the Mach dispute. Part IV proposes renaming MDP. Part V carries eight open items forward. SEAM FLAG (user decision 2026-07-25): this doc is deliberately two-track - Parts I, II and V are lesson-facing, Part III is presentation-facing and its own open item 8 states the two tracks now want opposite things and will degrade if kept as one document set. Filed WHOLE in nml2.2 with the seam recorded rather than split, since the presentation track has no established home yet; splitting is deferred to a dedicated session. OPEN TERMINOLOGY ITEM (Part IV, recorded not acted on per user 2026-07-25): 'MDP' collides with Markov Decision Process; candidates are mass determination, mass-binding process, or mass valuation (the doc favours valuation, pairing with 'address'); the doc notes the cost of the rename rises monotonically and asks for it before the presentation. No file or in-document renames performed. UNRATIFIED ADDITIONS needing the ratification route rather than silent adoption: eps_m (Part I sec 4.4), negligibility as a sixth family, and the open item that the chain-as-success vs fluids-as-defeat ordering may reopen a ratified decision in nml2_split_ratification (that document was not retrievable during the review, so the conflict is unconfirmed). Largest gap the review found: no taxonomy slot for a bundle with a licensed common velocity and no licensed common position - the convoy case - which is exactly where the standard first-year chain treatment lives. MOVED 2026-09-05 from Newton/nml/nml2/nml2.2/ to Newton-analysis/_dscn_particle_and_mass_origins/, FLAT, on user instruction - reversing his 2026-08-26 ruling that it stay in nml2.2 for its third review target's sake. What changed: the lumping note (_note_lumping) now wants the rigidity side of the criterion argument, and this file's Part I sec 1 is the strongest statement of it in the repo (eps_shape licenses a body, eps_trans licenses one particle; the offset criterion said to forbid rotation). WHY THIS DISCUSSION and not lumping_consequences: two of its three targets' subject is constitution - the criterion (sec 1) and coverage (sec 5) - and the origins discussion holds the 1D note it corrects; its glass-ball sections (3-4) reach into the consequences discussion by citation. WHY FLAT although it is a correction: it corrects THREE documents in two discussions and a lesson folder, so it binds into no single record's folder - a shared correction sits flat beside the member it corrects most, recorded here. An -informing copy stays at the old path (custody moved, the lesson keeps the reading it depended on), and the ai-context-bundle copy in nml2.2 is unchanged. Filename kept; every citation resolves. Part III (volume is not a Newtonian quantity) still has no receiving home; the seam flag stands. RESIDUE PARTLY CLEARED 2026-09-05 (housekeeping sweep): current set to null - current is a notes-only field marking a CHOSEN draft, and no promotion ever chose one here. draft is KEPT because this dN was AUTHORED (orig_name null or carries it), and neither grandfathering (assigned lone d1) nor the successor test (needs a chain) runs on a lone authored dN; erasing an author's own label is a ruling, not housekeeping. kind stays unset: files as record by default under the absence rule. THE USER'S RULING IS STILL OWED on this row - the one kind of residue the sweep did not close. KIND RULED record BY THE USER, 2026-09-05 ('make all 4 records'), closing the one residue the housekeeping sweep could not: an AUTHORED dN on a lone file, which neither grandfathering nor the successor test reaches. draft cleared; the authored dN stays in the filename as an identity. No direction, no drafts, no current - terminal."
