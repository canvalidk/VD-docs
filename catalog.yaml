    note: "STANDALONE CORRECTION NOTE (264 lines) against ENTRY_PACKET_E10_..._d4, authored in-repo 2026-08-01 from a working session with Can. Target: the DEFERRAL PICTURE that d3 and d4 both leave unchallenged — the assumption that reconciliation COULD be a prior operation (metrology, an evaluator pre-pass, a separate numbered entry) handing E10 a conforming pair, which is what makes E10 look repairable by better wording. Argument: E9 takes acceleration as input and so requires it identifiable without net-force; E8 takes net-force as input and so requires it identifiable without acceleration; neither may be defined by reference to the other, and in practice the channels ARE separate (component forces / load cells vs differentiated position samples). Independently determined vectors are then generically non-conforming. Hence a two-horn dilemma on what any upstream step could deliver: HORN ONE, it delivers the quantities as its channels found them, and the exact definition is INERT over the whole domain traces run on; HORN TWO, it delivers a reconciled pair, and E8/E9 become INOPERABLE because each entry's input would presuppose its own output. No third delivery, so reconciliation is INTERNAL to mass determination, not preprocessing. NOT a draft of this note and deliberately outside the draft line (d3 stays current) — same grounds as why_the_mass_entry_cannot_be_short.md, per ORGANIZATION.md 'assign dN only when the order is confident'. Consequences recorded: open question 3 SETTLED BY DISSOLUTION (Can, same day) — E12-as-upstream and any separate feeding entry are ruled out by the dilemma, but the remaining alternatives were malformed too, since both assumed the estimator needs a home INSIDE the dictionary. It does not: the estimation capability exists but lies OUTSIDE THE SCOPE OF THE VD'S AUTHORITY, on the DIFFERENTIATION PRECEDENT — E8 returns an acceleration and obtaining one means differentiating position data, which the VD neither defines, numbers nor owns, without that making E8 defective. So E10 NAMES the operation and does not supply it; decision 11's capability-naming is permanent rather than a deferral pending the E12 ratification. Also dissolves the pedagogical tension (a first-year uses acceleration without deriving a differentiation scheme, and can hold 'the true pair must be estimated' without meeting ODR). ONE RIDER recorded: this external competence is NON-UNIQUE where differentiation usually passes as innocent (d1's competing estimators and the g(cos-theta) result), so the trace must record WHICH POLICY was applied — already provided for by decision 6's policy/provenance fields, but its source is the non-uniqueness of the external competence, not the mass corner. E10's payload also derived as three items rather than asserted as a length. Explicitly does NOT establish the retention theorem (residual, provenance, independence status) — that stays on the separate self-confirmation chain in d3 secs 3-4 — and does not close the cross-trial invariance gap. Carries a PROVENANCE OF THE CLAIMS section separating Can's argument from Claude's formalisation, and records a position Claude withdrew in session (that deferral to metrology was a coherent division of labour VD merely could not afford; horn two refutes it — conventional treatments do not notice because they do not trace). Written in $/$$ form at source, normalization a no-op, nothing banked."
