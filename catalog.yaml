    note: "NOTE FOLDER, created 2026-09-07: nml2_lesson d1 (NML2_FINAL_DRAFT_v1_d1, 2026-07-10), the integrated NML2 lesson whose direction died on 2026-07-11 when the split ratification forked NML2 into 2.1 and 2.2. Made a note on his instruction that each nml's lesson draft becomes one; the abandonment is recorded in the direction line, not by demotion. Read it as the ancestor of both daughter lessons - nml2.1's note holds an informing copy. DIRECTION (ruled by the user 2026-09-07, the same line on every nml lesson note): A single document giving a teacher, at any level of education from school to university, everything needed to design and deliver this lesson of the Newtonian-mechanics curriculum from the VD entries it covers: what it teaches and in what order, the exercises and demonstrations, the misconceptions to expect, and how the lesson adapts across levels. For nml2 this direction is the one abandoned at the split; for nml2.2 and nml3 it is what the empty note is created to write into. ONE -INFORMING COPY ADDED 2026-09-15 (NML2_note_net_force_wall_withheld): home moved from _dscn_nml2_content to the Criticism History; the copy stays with the parent lesson because both daughters inherit the withheld-wall design."
