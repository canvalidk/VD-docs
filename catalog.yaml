    note: "NML3 MOCK LESSON - ADDING FORCES AND BUILDING A FORCE ACCOUNT. Self-described status: mock younger-student lesson draft; audience upper primary / early secondary, adaptable upward - so its AUDIENCE DIFFERS from the introductory-university audience of NML3_CONTENT_SPECIFICATION_d1, and the two are not drafts of each other. Filed FLAT in nml3/ by user instruction 2026-08-09 (options offered were a younger-student subfolder or a single dN note; flat-and-tagged was chosen), so the audience split is recorded here rather than in the folder shape. Ten parts plus teacher notes: force as arrow, same-direction addition, opposing forces, head-to-tail addition in two dimensions, order independence, net force, target discipline, cancellation, the decomposition trap, a box-on-a-table interaction example, four board rules, an exit ticket, and teacher notes. Its own teacher notes are the useful part for the project: sec 17 says most of the lesson should feel like an ORDINARY introductory forces lesson and that this is intentional - NML3 does not need to make vector addition seem strange, the conceptual extension arrives only after students already understand the sum. Sec 18 names the one distinctive move: refusing the hidden textbook step of taking the net force and decomposing it into whatever named forces make the equation work, installing instead interaction-account-first / sum-second (board version: FORCES FIRST. ADDITION SECOND.), and lists the formal machinery - IFS, force-member identity, acting-object-instance keys, set uniqueness, equal vectors from distinct members, empty vs nonempty zero-resultant accounts, generation vs closure - that the same idea becomes at higher levels, so the younger lesson is explicitly a preparation for it rather than a simplification of it. Sec 19 records a VOCABULARY DECISION for young learners: prefer force contribution / force arrow / force account / physical interaction, and use the verb REPRESENTS - captures is judged slightly me