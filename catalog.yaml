    note: "ORIGINALS BANK for tools/normalize_math.py — pre-conversion copies, date-partitioned, with MANIFEST.tsv. CATALOG EXEMPTION (ratified 2026-07-28): banked files are deliberately NOT catalogued individually; this folder entry covers them and the catalog<->disk bijection check must skip this subtree. MANIFEST.tsv is the per-file record. Prune only when the user has confirmed the converted file renders AND the entry is >90 days old; never prune an entry with unresolved soft flags. Created on first `apply` run."

