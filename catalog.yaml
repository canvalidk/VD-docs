    note: "WORKING NOTE (NML2.2 target construction), authored 2026-07-24, sorted from inbox 2026-07-25. The glass-ball worked example separating lumping from mass determination: lumping decides which target may own a mass value, an MDP decides what value sits at that target's mass address. A 1 kg glass ball hits a wall and cracks; object count is shown to be an OUTPUT of the redundancy audit, not something supplied by the word 'glass' or by the visible crack (crack is neither necessary nor sufficient for a split). Three post-impact cases (licence held / licence lost then reassembled / several surviving targets), then a fast-robot scenario that runs four determination routes on the same scene - density-volume, weight-gravity, partition and remainder/assembly - each with its assumptions, failure modes and uncertainty budget, ending in a Newton-II prediction that inherits its mass value's provenance. Eight numbered lessons in Part XI. Renamed with +_d1 suffix (lossless, orig_name recorded); filename deliberately KEEPS 'mdp' pending the terminology decision recorded on the vd_review_corrections entry (user 2026-07-25: record the rename, do not act on it). CORRECTED BY vd_review_corrections d1: sec 3 (the M_A = M_B deduction needs n persistence certificates plus material closure stated as premises, currently hidden in the notation) and sec 4 (the sub-resolution loss must be given its own flake TARGET bound by a negligibility determination, not absorbed into the variance budget; the bound is asymmetric and non-zero). Both are amendments to record, not yet written into this draft. MOVED 2026-08-26 to the particle_and_mass_origins discussion in Newton-analysis, on user instruction, with an -informing copy left in nml2.2. WHY: it works the defeat-and-re-lump cycle of d4 section 7 through a case, and keeps address apart from value - which is exactly the disclaimer the mass_address_lumping note carries, the proxy license without the account license. KIND CONFIRMED record: its d1 was ASSIGNED at intake (orig_name glass_ball_mdp_example.md carries no dN) and it is a terminal worked example, not a rendering of anything. NOTE THE DEFERRAL IT DISCHARGES: the informs line had held the 2.2 copy back until 2.2 drafting started; the copy now exists for a different reason, because home left the branch, so the deferral is spent rather than met. RESIDUE CARRIED, NOT FIXED: status draft, draft d1, current true beside kind record, and project nml2.2. MOVED 2026-09-05 from _dscn_particle_and_mass_origins to _dscn_lumping_consequences, FLAT, on user instruction - the first two members of the new discussion. Path row only; filename, relations and content untouched; every citation by filename still resolves. Why this one: a worked case of what a lumping judgment does and undoes - a consequence record, not a constitution record. 2026-09-05: its correction, vd_review_corrections_d1 (secs 3-4: the M_A = M_B premise set, the flake route, eps_m), moved from nml2.2 to _dscn_particle_and_mass_origins - a different discussion from this one, reached by citation; the correction is shared with two other documents and binds into no folder. RESIDUE CLEARED 2026-09-05 (housekeeping sweep under the user's standing mandate - he supplies the rules, Claude applies them): draft and current set to null. kind: record was already confirmed on this row, and under the ratified model a record carries no dN and no current; the row had been self-contradictory since the 2026-08-26 dissolution. The dN in the filename is an identity and stays; ordering, where there is one, lives in supersedes/superseded_by. status is a different axis and is untouched."
