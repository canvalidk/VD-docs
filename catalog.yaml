    note_name: action_reaction_asymmetry
    draft: d1
    current: true
    variant: null
    orig_name: ACTION_REACTION_CONSTITUTIVE_ASYMMETRY_SKETCH.md
    informs: null
    note: "CLAUDE-AUTHORED CAPTURE SKETCH, 2026-08-13, written at user request to pull the §7 finding out of Newton/Design 3/FORCE_SUM_IFS_ABSTRACTION_BOUNDARY_DISCOVERY_NOTE.md and hold it as a standalone note. THAT SOURCE DOC HAS SINCE LEFT THIS REPO - handed to VD Newton and deleted 2026-08-14 (see the HANDED TO VD NEWTON record in the inbox folder note), on the user's judgement that the doc as a whole does not fit here while the part that does had already been extracted into this sketch. So this sketch is now the surviving carrier of that finding, and the citation above is a provenance pointer, not a live path. Self-described status: SKETCH / capture draft, not presentable, not yet a note. Core claim: the pair relation F_12 = -F_21 plus a constitutive law does NOT assign forces to targets - both assignments satisfy the pair relation - so the missing datum is WHICH PARTICIPANT CARRIES THE CONSTITUTIVE MECHANISM. Once supplied, action and reaction differ in construction history (action computed from constitutive state and applied to the non-acting participant; reaction obtained by negating the action and applied back to the acting object) and are therefore not interchangeable labels for +F and -F. Eleven parts: motivation and goal; the core argument restated; what the asymmetry buys (justifies the two action-force/reaction-force slots in the acting-object inventory's working picture, gives the V(f) wall its branch structure, and may let NML3's exclusivity condition be DERIVED rather than stipulated, which is what NML3 §20 asked for); where the acting object sits; the status of the third law; the universality crux; stress tests; terminology; scope exclusions; consolidated open questions; and a method note. EVERY CLAIM IS PROVENANCE-TAGGED [SOURCED] (14, cited), [EXTENDED] (11, drawn out from sourced material), or [RAISED] (13, Claude-raised prompts rather than findings). KNOWN SHORTFALL, RECORDED RATHER THAN FIXED (user reviewed 2026-08-13 and elected to proceed): the sketch UNDER-CITES three existing documents found only after it was written. (1) Newton-analysis/hookean_response_type_chain/hookean_response_type_chain_d1.md already names the same missing datum from the elasticity side - its §0 lists 'a direction/interface rule, which determines how the response is delivered to another object' as the fourth thing the word 'spring' hides, and §11 makes it a required component of a Design 3 spring-like acting-object; Part II of the sketch presents this as newly exposed. (2) Part IV's participant-vs-mechanism ownership tension is tagged [RAISED] but was already worked in Newton/folded in docs/vd_bug_report_actobject_owner_design2.md (proposes inverting ownership so acting-objects are properties of their paired particles) and resolved in Newton/folded in docs/vd_acting_object_fix.md (E39 defines candidates from the particle side). (3) Part V does not engage Newton/Design 3/vd_design_3_oop_discussion.md, which makes paired-particle a DEFINITIONAL component of the acting-object and grounds it in Newton III ('something must receive the reaction'). Part VI - whether the constitutive asymmetry is universal, type-dependent, or an artefact of one-sided state, with gravity between two masses as the breaking case - was searched for and appears genuinely unasked anywhere in the corpus; that part stands. Filed in Newton-analysis rather than Newton because it is an output-side finding about mechanics rather than an entry-design decision, and because its nearest neighbour, the Hookean response-type chain, lives here; the design consequences are a hand-off to Newton, not a reason to file it there. Hand-off targets when they exist: the V(f) wall and the NML3 impressed-force identity problem; no informs-link recorded yet because no receiving note exists. Filename kept in SCREAMING_CASE for losslessness (only the _d1 suffix was added) although the rest of Newton-analysis is lowercase. Normalization no-op: written in $/$$ form from the start, no delimiters to convert, nothing banked. TWO SIBLING NOTES ARRIVED 2026-08-14 and both engage this sketch directly, so read them together: Newton-analysis/canonical_force_orientation/ cites this sketch as a source and answers its missing datum DIFFERENTLY (a human-supplied orientation convention rather than which participant carries the constitutive mechanism), and Newton-analysis/participant_symmetric_forces/ names this sketch as its Related note and its Part VII proposes that gravity does not refute the constitutive asymmetry but shows the VD needs a second, participant-symmetric acting-object architecture beside it — which is a direct answer to Part VI, the universality crux this sketch left standing as genuinely unasked."
