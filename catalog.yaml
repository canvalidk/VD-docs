    note: "CLAUDE-AUTHORED CAPTURE SKETCH, 2026-08-13, written at user request to pull the §7 finding out of Newton/Design 3/FORCE_SUM_IFS_ABSTRACTION_BOUNDARY_DISCOVERY_NOTE.md and hold it as a standalone note. THAT SOURCE DOC HAS SINCE LEFT THIS REPO - handed to VD Newton and deleted 2026-08-14 (see the HANDED TO VD NEWTON record in the inbox folder note), on the user's judgement that the doc as a whole does not fit here while the part that does had already been extracted into this sketch. So this sketch is now the surviving carrier of that finding, and the citation above is a provenance pointer, not a live path. Self-described status: SKETCH / capture draft, not presentable, not yet a note. Core claim: the pair relation F_12 = -F_21 plus a constitutive law does NOT assign forces to targets - both assignments satisfy the pair relation - so the missing datum is WHICH PARTICIPANT CARRIES THE CONSTITUTIVE MECHANISM. Once supplied, action and reaction differ in construction history (action computed from constitutive state and applied to the non-acting participant; reaction obtained by negating the action and applied back to the acting object) and are therefore not interchangeable labels for +F and -F. Eleven parts: motivation and goal; the core argument restated; what the asymmetry buys (justifies the two action-force/reaction-force slots in the acting-object inventory's working picture, gives the V(f) wall its branch structure, and may let NML3's exclusivity condition be DERIVED rather than stipulated, which is what NML3 §20 asked for); where the acting object sits; the status of the third law; the universality crux; stress tests; terminology; scope exclusions; consolidated open questions; and a method note. EVERY CLAIM IS PROVENANCE-TAGGED [SOURCED] (14, cited), [EXTENDED] (11, drawn out from sourced material), or [RAISED] (13, Claude-raised prompts rather than findings). KNOWN SHORTFALL, RECORDED RATHER THAN FIXED (user reviewed 2026-08-13 and elected to proceed): 