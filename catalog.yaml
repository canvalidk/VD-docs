    note: "Staging area. 'VD unsorted important' behaves the same way — drop things in, then sort. TRANSFER-BUNDLE RECORD, 2026-08-05 batch (folded in here 2026-08-09 when the emptied inbox/2026-08-05_vd_docs_pass/ folder and its README were deleted by user instruction, retiring that catalog entry): handoff from VD-Newton@059ca8647550a05aeefe96beff7fd8a1707e9207, compared against VD-docs@8e09dbf9d3e521cbe76e36426ead656c04a71650. Standing rule from that README - active copies remain in VD-Newton and are authoritative for entry production, so ingesting a copy here is never grounds to delete or demote the source. COVERAGE CAVEAT preserved: the selected August E10 writing pass cites an E10 d5 packet present in neither VD-Newton nor its Git history, so that batch is NOT a complete packet lineage. Disposition: of 9 listed new files, 4 were already homed and byte-identical (mass d3, triplet d2, E10 _b pass, E11 pass) and their staging copies were deleted per the dedupe rule; 3 decision records (NML2 renumbering, NML3 entry sequence, NML3 contributing-force terminology) were dropped uningested by user instruction and survive only at source; 2 NML3 conceptual notes went to Newton/nml/nml3/; 2 refresh files were overwritten in place in inbox/VD unsorted important/. HANDED TO VD NEWTON - standing record of docs whose custody moved OUT of this repo (user decision; recorded here because the VD-Newton transfer ledger already lives in this note, and because both departures were cited by path from entries that stay). The direction is the reverse of the transfer-bundle traffic above: these are not copies we declined to ingest, they are documents we HELD and gave up, so their catalog entries were RETIRED rather than kept as absences. In both cases the file was removed from disk and the active copy is now VD Newton's, authoritative there; do not re-ingest either without a fresh decision. (1) inbox/DESIGN_2_1_BUG_REPORT_AGGREGATE_VS_MEMBER_CONSTRAINT.md - the confirmed Design 2.1 structural bug report (an aggregate constraint misused as a member constraint; P(x) != Q(E), and an aggregate condition usually fixes a FAMILY of admissible sets rather than one). Held in inbox from 2026-08-12 under the carve-out 'leave Design 2.1 in inbox, you aren't responsible for it'; handed over and removed by the user at some point after that, discovered missing by the 2026-08-14 bijection check and confirmed by the user the same day. (2) Newton/Design 3/FORCE_SUM_IFS_ABSTRACTION_BOUNDARY_DISCOVERY_NOTE.md - the chronological discovery note that derived that bug set-theoretically and produced the candidate Force-Sum triplet {net-force, IFS, V(f)} with the polymorphism result that the Force-Sum law needs only the TYPES and is therefore NOT the IFS-construction law; also the source of the HAND ON THE WALL method note. Sorted into Design 3 on 2026-08-13, deleted 2026-08-14 on user instruction - the user judged the doc as a whole does not fit this repo, while noting that the material in it that DOES fit had already been extracted into a separate note. WHAT SURVIVES HERE, so nothing load-bearing left with them: the extraction is Newton-analysis/action_reaction_asymmetry/ACTION_REACTION_CONSTITUTIVE_ASYMMETRY_SKETCH_d1.md, which carries the sec 7 constitutive-carrier finding; Newton-analysis/canonical_force_orientation/ carries the triplet forward and names the third corner impressed-force; Newton/nml/nml3/NML3_OPEN_PROBLEM_IMPRESSED_FORCE_IDENTITY_ACTION_REACTION_EXCLUSIVITY.md, which the FORCE_SUM note reframed, is unaffected and stays. Both departed files also survive as PRE-NORMALIZATION copies in the bank (_math_originals/2026-08-12/ and /2026-08-13/), which is provenance only, NOT a retained working copy - the normalized versions (86 and 194 edits) are not preserved anywhere, so recovery means re-running tools/normalize_math.py on the banked original."
