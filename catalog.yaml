    note: "NML3 WARRANTED FORCE ACCOUNT: FOUNDATIONAL EXPLICATION (2026-08-05, 28.7 KB). Self-described status: active local conceptual note authored from the force-sum discussion; sharpens WHY the force-sum triplet is needed, does not yet define the warranting mechanism or ratify entry wording. Central claim: the force-sum law's deeper role is to admit the commitment that for a specified material object under specified conditions there is a CORRECT interacting-forces-set, whose members' membership is warranted INDEPENDENTLY of their ability to reproduce the measured net force, and whose vector sum is the net force. Introduces `warranted` / W to mark the gap between a writable vector summand and a force that has earned membership; explicitly says naming it does not settle what makes a force warranted — that belongs to the law's outward walls. Opens with the spring experiment: measuring dF_net/dx = -k and fitting F_net(x) = -kx is a substantive empirical result that still does NOT establish an interaction with the spring. Successor in role to NML3_FORCE_SUM_FOUNDATIONAL_UNDERSTANDING_2026-08-02.md, which raised the decomposition-is-not-membership problem this note deepens; neither is marked as a draft of the other. Sorted from inbox 2026-08-05, from the 2026-08-05_vd_docs_pass transfer bundle (source VD-Newton@059ca86); the active copy stays in VD-Newton and remains authoritative. The bundle README left the final managed home to the VD folders manager; placed in Newton/nml/nml3/ by user instruction 2026-08-05, beside the force-sum note it continues. NOT an excavated note — no dN model applied. NORMALIZED on intake: 39 inline-delim edits, all four hard gates passed, original banked at _math_originals/2026-08-05/. Soft flag mixed-delimiter-styles — the source mixed \\( \\) inline with $$ display, expected for a file drafted across two conventions. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/conceptual/ (path field updated; filename untouched, no dN implied by the move). This note is ENTRY-CUT-INDEPENDENT and is NOT retired by the reset - its content does not depend on which entries exist or which wall each carries, so a re-cut of the NML3 entry structure leaves it standing as live authority and as input to the new cut. Boundary record: Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md. The layer subfolder is NOT a note folder - note_name stays null."
