    note: "Everything VD-docs addresses to VD-Newton (canvalidk/VD-Newton), created 2026-09-08 with its first document, the receipt for their 2026-09-08 pass to VD-docs/. Their side: passes arrive from their pass to VD-docs/ staging folder; they keep a context copy of each return beside it and record closures in their AGENTS.md. Filenames carry date and kind; the newest is current, earlier ones are history. Second document 2026-09-23: PASS_RECEIPT_2026-09-23.md, a PARTIAL receipt (7 received, 5 haze held, 37 still covered by the unapplied 09-08 receipt). Third document 2026-09-23 (evening): PASS_RECEIPT_2026-09-23_ecd1a1c.md, a COMPLETE receipt for the second pass of the day (one record); named with the source commit because the date-only name was taken."
