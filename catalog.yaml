# VD-docs catalog — per-file notes and tags. Maintained collaboratively, filled in over time.
# Folder/note model spec: see ORGANIZATION.md at the repo root (governs EXCAVATED NOTES).
# role:   primary | ai-context | reference | informing   (ai-context = a borrowed copy that feeds a branch AI; informing = a read-only copy from another note's branch, placed to inform this note)
# status: idea | draft | sketch | publishable | published
# project: name of the mini-project a file belongs to (esp. under Newton-analysis)
# dup_group: files sharing a label are byte-identical copies of each other.
# --- excavated-note fields (see ORGANIZATION.md) ---
# note_name: the note (folder) a file belongs to  (model field; distinct from the free-text 'note' below)
# draft:     draft number (d1, d2, ...; d2a/d2b for parallel variants), 'unknown', or null (not a draft)
# current:   true on the current draft of a note
# variant:   variant label for parallel drafts, else null
# orig_name: filename before a dN suffix was added (renames are lossless/reversible)
# informs:   for an informing note, the home->target hand-off link
# RULE: if a file in inbox/unsorted-important is identical to one in a real branch, the unsorted copy is deleted.

folders:
  Core:
    note: "VD as a rigorous set of mathematical rules, presented without justification."
  Theory:
    note: "Philosophical writing justifying the VD's core commitments."
  Code:
    note: "In-repo spec/management layer for the VD codebase: specs, design notes, requirements. Links VDfirst, which is responsible for the code; context copies of code may live here but VDfirst owns/maintains it."
  Newton:
    note: "Bridges Newton-analysis and Code — the 'program' that runs on the Code 'compiler'."
  Newton-analysis:
    note: "INCUBATOR: many mini-projects, each building documents toward a publishable sketch. To be split into one subfolder per mini-project."
  inbox:
    note: "Staging area. 'VD unsorted important' behaves the same way — drop things in, then sort."

