    note: "CANONICAL-FORCE ORIENTATION CONVENTION - working discovery note dated 2026-08-14, authored OUTSIDE this repo against the managed snapshot canvalidk/VD-docs@cae6cd109c1dfcae4f6c1f57c89c5b91660351b2; sec 18 states it is the local Design 2.1 entry-facing interpretation of that material and records the result locally WITHOUT editing or assuming custody of the NML documents. PART I is the result. Sec 1: for one active binary interaction the relation A = -R supplies opposition but NOT canonical orientation - (A,R) = (K,-K) and (A,R) = (-K,K) both satisfy it - so which member is quoted as the principal force is a real representational degree of freedom, not a further physical force. Sec 2: a convention C supplies a canonical recipient c_C(i) in P(i) and a canonical-force vector K_C(i); the target-side impressed-force value returns K_C to the canonical recipient, -K_C to the paired participant, and UNDEFINED for a nonparticipant - the third branch is load-bearing, a non-member does not receive the negative force merely by not being canonical. An independently named sign function sigma(f) is REJECTED as a restatement of the supplied orientation rather than an input of its own. Sec 3: the opposite convention transforms recipient and quoted vector TOGETHER and leaves every target-side value unchanged. Sec 4: the Hooke case makes it concrete - F = -kx and F = +kx quote opposite members of one pair and do not contradict, but are not interchangeable while F, x, recipient and orientation keep their meanings. Sec 5 partitions physical from conventional content. Sec 6: interaction discovery and system closure never need the pair relation - closure is structural (if P(i) meets S then P(i) is contained in S) - and internal-pair cancellation is a CONSEQUENCE of an already-classified internal interaction, not a criterion of closure. Sec 7 is the entry-structure consequence: the candidate Force-Sum triplet is now {net-force, IFS, impressed-force V(f)}, naming the corner the 2026-08-13 FORCE_SUM note left as bare V(f), and the impressed-force wall becomes a chimney into a deeper evaluation law with provisional corners {impressed-force V(f), canonical-force-acting-object, canonical-force orientation convention}; five candidate headwords are listed and none is settled - the eventual headword must expose the runtime human choice without suggesting the convention is an additional physical force. Sec 8: action and reaction need not be stored as two independently valued forces plus a stored equation - store one interaction identity, its incidences, one canonical value, one convention and the target address, and A = -R becomes an invariant of the evaluation network; a structural law is still needed for counterpart existence, shared interaction, distinct participants, and binary-pair suitability. Sec 9 gives six tests (convention reversal, equal-and-opposite underdetermination, interaction-before-value, external cancellation, invalid target, spring convention pair). Sec 10 leaves eight open questions incl. the final headword, the scope at which the convention is supplied (instance, type, model, lesson, or authority record), symmetric mechanisms such as gravity where neither participant is a privileged constitutive carrier, and what empirical content remains for Newton III. PART II (secs 11-17) is the discovery route: the aggregate/member correction, force occurrence separated from vector value, action/reaction moved behind the evaluator wall, the rejected sigma(f) placeholder, the two-way assignment, the Hooke recognition, and sec 17's methodological claim - the VD demanded a structural input BEFORE its physical meaning was known, on the working principle that EVERY WALL EXPOSES AN INPUT and a fixed sign function is not a runtime input. PLACEMENT, USER DECISION 2026-08-14: filed in Newton-analysis - NOT in Newton/Design 3 where its predecessor Newton/Design 3/FORCE_SUM_IFS_ABSTRACTION_BOUNDARY_DISCOVERY_NOTE.md went on 2026-08-13 (that predecessor has since left the repo entirely - handed to VD Newton and deleted 2026-08-14, see the HANDED TO VD NEWTON record in the inbox folder note - which retroactively vindicates keeping this note out of Design 3), and NOT left in inbox under the standing 2026-08-12 Design-2.1 carve-out ('leave Design 2.1 in inbox, you aren't responsible for it'), which the user elected not to extend to this note. Own note folder; single draft; the _d1 suffix was ADDED (lossless, orig_name recorded) and the SCREAMING_CASE filename kept, as for the action_reaction sketch. Nearest kin is Newton-analysis/action_reaction_asymmetry/ACTION_REACTION_CONSTITUTIVE_ASYMMETRY_SKETCH_d1.md, which this note cites as a source and whose missing datum it answers DIFFERENTLY: the sketch locates it in which participant carries the constitutive mechanism, this note in a human-supplied orientation convention. The two are compatible for constitutive mechanisms but come apart for symmetric ones - which is this note's own open question 4 and the subject of the sibling note Newton-analysis/participant_symmetric_forces/. Kept as a SEPARATE note, not a d2 of the sketch: it does not name the sketch as a predecessor, it cites it. The design consequences are a hand-off to Newton, not a reason to file it there; no informs-link recorded yet because no receiving note exists. KNOWN RENDERING DEFECT, RECORDED NOT FIXED: many intended inline maths in Part I are written as BARE PARENTHESES - (A), (R), (K_C(i)), (A=-R), (sigma(f)), (p in P(i)) - the backslash-paren delimiters were lost at authoring, so they render as literal parentheses. Out of scope for tools/normalize_math.py, which converts delimiters that are present and does not invent missing ones; fix at source if the note is developed further. Math-normalized on intake 2026-08-14: 1 edit (inline-delim - the one surviving backslash-paren pair, at sec 3), soft flag mixed-delimiter-styles, all four hard gates passed; original banked at _math_originals/2026-08-14/. STALE-PATH NOTICE 2026-08-17 (NML3 entry-structure reset): this file's source list cites Newton/nml/nml3/NML3_OPEN_PROBLEM_IMPRESSED_FORCE_IDENTITY_ACTION_REACTION_EXCLUSIVITY.md, Newton/nml/nml3/NML3_PRIMITIVE_EXERCISE_BANK_FORCE_ACCOUNTING.md and Newton/nml/nml3/NML3_FORCE_SUM_VOCABULARY_RESERVOIR.md, all three of which moved in the reset. THE CITATIONS WERE DELIBERATELY NOT REWRITTEN: they are explicitly scoped to the pinned snapshot VD-docs@cae6cd1, where those paths are correct, so editing them would falsify a true claim about that commit. Current homes: the open problem and the vocabulary reservoir are in nml3/conceptual/ (not retired); the primitive exercise bank is in nml3/entry-cut-dependent/ (retired as authority, kept as reasoning record). Anything this note took FROM the exercise bank should be re-checked against the new cut when it lands - see Newton/nml/nml3/NML3_ENTRY_STRUCTURE_RESET_2026-08-17.md sec 2."
