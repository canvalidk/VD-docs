    note: "NML3 CONTENT SPECIFICATION, d1 (self-declared in the file header). Self-described status: working synthesis; the teacher-facing CONTENT AUTHORITY sitting between the NML3 force-sum entries and a timed lesson plan - the same role NML2_1_CONTENT.md plays for NML2.1, and the step-7 product of NML3_ENTRY_TO_LESSON_BRIDGE_d1. Audience: introductory university mechanics, adaptable downward only after the logical structure is preserved. Frames NML3 as opening the debt NML2.1 deliberately left: how a material object's opaque net-force slot acquires a physically licensed and COMPLETE force account. 28 sections. The complete student route in sec 2 runs from the NML2 net-force demand through fixing target and context, opening a ledger, inspecting acting-object-instance candidate keys one at a time, admitting only on an independent warrant, rejecting duplicate keys, preserving distinct members with equal vector values, recording exclusions, keeping the account open after every positive step, obtaining an independent no-further-member determination, closing the IFS, and only then summing all and only its members - with an explicit HALT route when a warrant, an exhaustive candidate domain, a resolution, or a closer witness is missing. Sec 9 is the piece the earlier notes did not have: a MINIMUM MEMBERSHIP-WARRANT INTERFACE of six requirements (independence from the sum, physical attachment - a familiar algebraic shape like -kx does not by shape alone identify the spring, identity preservation of the acting-object key, context preservation, traceability of observations and grade, and revisability without licensing arbitrary decompositions), specified as an interface so the concrete implementation can defer to the later acting-object and force-law blocks. Sec 8.3 fixes IFS cardinality as acting-object-key cardinality - not the number of written terms, distinct vector values, named force-law types, material objects mentioned, or coordinate components. Terminology is handled explicitly in sec 3: the formal working headword contributing-force is used only provisionally because it can sound as though appearing in the sum suffices for membership, so the specification teaches in the neutral phrases force-account member / warranted force member / force-instance and selects no final entry wording; formal placeholders IFS(M | C), W_A, vec(W_A). Also carries the lesson-production apparatus the bridge asked for: required learning outcomes (19), the installed student trace (20), signature questions (21), an exercise and evaluator bank (22), misconceptions and repairs (23), criteria of instillment (24), a provisional lesson sequence (25), explicit later destinations (26), and entry-facing consequences (27). Sec 0 states what NML3 does NOT teach - concrete force laws, empirical discovery of acting-object candidates from an unstructured scene, activation-condition tests, action/reaction pairing, mechanically closed systems, continuum or infinite accounts - and licenses using SUPPLIED candidate keys, warrant records, exclusion records, vector values, and closer witnesses to teach the structure without pretending those later objects exist yet. Sorted from inbox 2026-08-09. NOT an excavated note - self-declared d1 honoured as given, no dN model imposed, and it is NOT a draft of the bridge. Normalization no-op: no math delimiters to convert, nothing banked. ENTRY-STRUCTURE RESET 2026-08-17: relocated to Newton/nml/nml3/entry-cut-dependent/ (path field updated; filename untouched, no dN implied by the move). RETIRED AS AUTHORITY, KEPT AS REASONING RECORD - this note was written against the NML3 entry cut that is now being withdrawn (E13-E17 with E16 as the force-member/admission wall and E17 as the IFS/closure wall), so it must not be read as a current target. Retirement follows the E10 packet precedent: superseded as the working account, deliberately kept, and NOT EDITED IN PLACE - no banner was added to the file, the boundary lives in the folder, th